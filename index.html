  const closeAll=()=>overlay?.remove();
  close?.addEventListener('click',closeAll);
  overlay?.addEventListener('click',e=>{if(e.target===overlay) closeAll();});

  document.getElementById('profileAttendance')?.addEventListener('click',()=>{
    closeAll();
    document.getElementById('myAttendanceBtn')?.click();
  });
  document.getElementById('profileSettings')?.addEventListener('click',openMyPasswordSettings);
  document.getElementById('profileSwitch')?.addEventListener('click',()=>{
    if(!hasWmSwitchAccess()) { toast('Workshop Manager switch access is not available'); return; }
    closeAll();
    renderWmSwitchPanel();
  });

  document.querySelectorAll('[data-add-master]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!currentUser || currentUser.role!=='Workshop Manager') return;
      const key=btn.dataset.addMaster;
      const input=document.getElementById('master_'+key);
      const value=input?.value.trim();
      if(!value){toast('Enter an item first');return;}
      DATA.settings[key]=Array.isArray(DATA.settings[key])?DATA.settings[key]:[];
      if(DATA.settings[key].some(x=>x.toLowerCase()===value.toLowerCase())){toast('Item already exists');return;}
      DATA.settings[key].push(value);
      saveData().then(()=>{toast('Item added');document.getElementById('profileOverlay')?.remove();document.getElementById('profileBtn')?.click();});
    });
  });
  document.querySelectorAll('[data-remove-master]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!currentUser || currentUser.role!=='Workshop Manager') return;
      const key=btn.dataset.removeMaster, idx=Number(btn.dataset.masterIndex);
      if(!Array.isArray(DATA.settings[key])) return;
      confirmAndRun('Remove this item from the list?',async()=>{
        DATA.settings[key].splice(idx,1); await saveData(); toast('Item removed');
        document.getElementById('profileOverlay')?.remove(); document.getElementById('profileBtn')?.click();
      });
    });
  });
}

function attachHandlers(){
  bindPartMasterPickers();
  if(activeServiceSchedule && currentUser?.role==='Workshop Manager'){
    document.getElementById('serviceScheduleBack')?.addEventListener('click',()=>{activeServiceSchedule=false;history.pushState({},'',location.pathname+location.search);render();});
    document.getElementById('serviceScheduleForm')?.addEventListener('submit',async e=>{
      e.preventDefault();
      const partNos=String(document.getElementById('ss_partnos_value')?.value||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
      const description=document.getElementById('ss_desc')?.value.trim();
      const firstDue=Number(document.getElementById('ss_first')?.value); const interval=Number(document.getElementById('ss_interval')?.value); const allowed=Number(document.getElementById('ss_allowed')?.value);
      const fixedQty=Number(document.getElementById('ss_qty')?.value);
      const minQtyRaw=String(document.getElementById('ss_minqty')?.value??'').trim(); const maxQtyRaw=String(document.getElementById('ss_maxqty')?.value??'').trim();
      const minQty=minQtyRaw===''?null:Number(minQtyRaw); const maxQty=maxQtyRaw===''?null:Number(maxQtyRaw);
      if(!partNos.length||!description||!Number.isFinite(firstDue)||firstDue<0||!Number.isFinite(interval)||interval<=0||!Number.isFinite(allowed)||allowed<0||!Number.isFinite(fixedQty)||fixedQty<0){toast('Enter valid part numbers, description, due KM, interval, allowed ± KM and fixed quantity');return;}
      if(minQty!==null && (!Number.isFinite(minQty)||minQty<0)){toast('Enter a valid minimum quantity');return;}
      if(maxQty!==null && (!Number.isFinite(maxQty)||maxQty<0)){toast('Enter a valid maximum quantity');return;}
      if(minQty!==null && maxQty!==null && maxQty<minQty){toast('Maximum quantity cannot be less than minimum quantity');return;}
      const normalized=[...new Set(partNos.map(normPartNo))];
      if(!normalized.length){toast('Select at least one part from the WM Parts Master');return;}
      const masterNos=masterParts().map(x=>normPartNo(x.partNo)).filter(Boolean);
      if(normalized.some(x=>!masterNos.includes(x))){toast('Only parts from the WM Parts Master are allowed');return;}
      const duplicate=(DATA.settings.serviceSchedule||[]).some(x=>x.active!==false && JSON.stringify((Array.isArray(x.partNos)?x.partNos:[]).map(normPartNo).sort())===JSON.stringify(normalized.sort()) && String(x.description||'').trim().toLowerCase()===description.toLowerCase());
      if(duplicate){toast('This service schedule item already exists');return;}
      DATA.settings.serviceSchedule.push({id:uid(),partNos,description,itemType:document.getElementById('ss_type').value,firstDueKm:firstDue,intervalKm:interval,allowedKm:allowed,qty:fixedQty,minQty,maxQty,vehicleType:document.getElementById('ss_vehicle').value||'ALL',resetKeywords:document.getElementById('ss_reset').value.trim(),remark:document.getElementById('ss_remark').value.trim(),resetRemark:document.getElementById('ss_resetremark').value.trim(),active:true,createdAt:nowISO(),createdBy:whoTag()});
      if(await saveData()){toast('Service schedule added');render();}
    });
    document.querySelectorAll('[data-ss-toggle]').forEach(btn=>btn.addEventListener('click',async()=>{const x=(DATA.settings.serviceSchedule||[]).find(r=>String(r.id)===String(btn.dataset.ssToggle));if(!x)return;x.active=x.active===false;await saveData();render();}));
    document.querySelectorAll('[data-ss-remove]').forEach(btn=>btn.addEventListener('click',async()=>{const x=(DATA.settings.serviceSchedule||[]).find(r=>String(r.id)===String(btn.dataset.ssRemove));if(!x)return;confirmAndRun('Delete this service schedule item?',async()=>{DATA.settings.serviceSchedule=DATA.settings.serviceSchedule.filter(r=>String(r.id)!==String(x.id));await saveData();toast('Service schedule deleted');render();});}));
    return;
  }

  const globalVehicleEntryBtn=document.getElementById('globalVehicleEntryBtn');
  if(globalVehicleEntryBtn) globalVehicleEntryBtn.addEventListener('click',()=>{
    activeVehicleEntry=true; ACTIVE_TAB='vehicles'; selectedVehicleComplaints=[]; render();
  });
  const vehiclePageEntryBtn=document.getElementById('vehiclePageEntryBtn');
  if(vehiclePageEntryBtn) vehiclePageEntryBtn.addEventListener('click',()=>{
    activeVehicleEntry=true; ACTIVE_TAB='vehicles'; selectedVehicleComplaints=[]; render();
  });
  const vehicleEntryBack=document.getElementById('vehicleEntryBack');
  if(vehicleEntryBack) vehicleEntryBack.addEventListener('click',()=>{activeVehicleEntry=false;render();});

  document.querySelectorAll('[data-tech-assign-bd]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(currentUser.role!=='Technician') return;
      const v=DATA.vehicles.find(x=>x.id===btn.dataset.techAssignBd);
      if(!v) return;
      confirmAndRun(`Assign ${v.vehicleNo} as your breakdown vehicle?`,async()=>{
        const existing=DATA.breakdowns.find(b=>b.vehicleNo===v.vehicleNo && b.stage!=='CLOSED');
        if(existing){
          existing.assignedTechnician=currentUser.name;
          existing.technicianAssignedAt=nowISO();
          existing.technicianAssignedBy=whoTag();
        }else{
          DATA.breakdowns.push({id:uid(),vehicleTicketId:v.id,vehicleNo:v.vehicleNo,km:v.km||'',driverName:v.driverName||'',mobileNo:v.driverPhone||'',vehicleLocation:'',district:'',assignedTechnician:currentUser.name,assignedMsvDriver:'',complaint:v.complaint||'',partsCarrying:[],stage:'ASSIGNED',fuelEntries:[],consumedParts:[],createdAt:nowISO(),createdBy:whoTag(),technicianAssignedAt:nowISO()});
        }
        await saveData(); toast('Breakdown vehicle assigned'); render();
      });
    });
  });


  /* Vehicle job workflow */
  document.querySelectorAll('[data-open-job]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      try{
        const vehicleId=btn.dataset.openJob;
        const v=(DATA.vehicles||[]).find(x=>String(x.id)===String(vehicleId));
        if(!v){ toast('Vehicle record not found'); return; }
        if(isVehicleDeleted(v)){ toast('This vehicle entry was deleted'); return; }
        if(isVehicleHeld(v) && currentUser?.role!=='Workshop Manager' && !techOwnPause(v)){ toast('Vehicle is on HOLD'); return; }

        // MANAGE JOB is a dedicated page, not a popup/overlay.
        // Keep the vehicle id in the URL so refresh/back navigation works.
        activeVehicleJobId = String(vehicleId);
        ACTIVE_TAB = 'vehicles';
        if(!location.hash || location.hash !== '#manage-job='+encodeURIComponent(String(vehicleId))) {
          history.pushState({manageJob:String(vehicleId)}, '', '#manage-job='+encodeURIComponent(String(vehicleId)));
        }
        window.scrollTo(0,0);

        document.getElementById('vehicleJobModal')?.remove();
        const html=renderVehicleJobModal(v);
        if(!html){ toast('You do not have permission to manage this vehicle'); return; }
        const routePage = location.hash.startsWith('#manage-job=');
        if(routePage){
          const c=document.getElementById('content');
          c.innerHTML = html.replace('class="modal-backdrop"', 'class="vehicle-job-page"');
          c.scrollIntoView({block:'start'});
        }else{
          document.body.insertAdjacentHTML('beforeend',html);
        }
        const modal=document.getElementById('vehicleJobModal');
        if(!modal){ toast('Unable to open Manage Job'); return; }

        // Dedicated-page mode: no fixed positioning and no overlay.
        if(routePage){
          modal.style.cssText += ';position:relative!important;inset:auto!important;width:100%!important;max-width:100%!important;min-height:0!important;background:transparent!important;display:block!important;z-index:auto!important;padding:0!important;box-sizing:border-box!important;';
          const panel=modal.querySelector('.vehicle-job-modal');
          if(panel) panel.style.cssText += ';position:relative!important;left:auto!important;top:auto!important;margin:0 auto!important;width:100%!important;max-width:900px!important;max-height:none!important;overflow:visible!important;box-sizing:border-box!important;';
        } else {
        // Legacy fallback positioning.
        const r=btn.getBoundingClientRect();
        const vw=window.innerWidth, vh=window.innerHeight;
        const mw=Math.min(460, Math.max(300, vw-24));
        const mh=Math.min(vh-24, Math.max(260, modal.scrollHeight || 500));
        let left=r.left + (r.width/2) - (mw/2);
        let top=r.top + Math.min(18, r.height);
        if(top + mh > vh - 12) top=Math.max(12, vh - mh - 12);
        left=Math.max(12, Math.min(left, vw - mw - 12));
        modal.style.cssText += `;position:fixed!important;left:${left}px!important;top:${top}px!important;width:${mw}px!important;max-width:calc(100vw - 24px)!important;height:auto!important;max-height:calc(100vh - 24px)!important;overflow:visible!important;background:rgba(20,24,28,.48)!important;display:block!important;z-index:2147483647!important;padding:12px!important;box-sizing:border-box!important;`;
        const panel=modal.querySelector('.vehicle-job-modal');
        if(panel){
          panel.style.cssText += ';position:relative!important;left:auto!important;top:auto!important;margin:0!important;width:100%!important;max-width:none!important;max-height:calc(100vh - 48px)!important;overflow-y:auto!important;box-sizing:border-box!important;';
        }
        }
        if(!routePage) modal.addEventListener('click',e=>{ if(e.target===modal) modal.remove(); });
        // Load DMS directly from the published Google Sheet for this vehicle.
        dmsLoadVehicleReport(v.vehicleNo, v.id);
        bindJobStickyBar(v); bindClosureSection(v);
      const close=()=>{
        if(routePage){ activeVehicleJobId=null; history.pushState({},'',location.pathname+location.search); ACTIVE_TAB='vehicles'; render(); window.scrollTo(0,0); }
        else modal?.remove();
      };
      document.getElementById('closeVehicleJob')?.addEventListener('click',close);
      document.getElementById('closeVehicleJobBottom')?.addEventListener('click',close);
      document.querySelectorAll(`[data-vjob-id=\"${v.id}\"]`).forEach(tab=>{
        if(!tab.matches('.vehicle-job-tab')) return;
        tab.addEventListener('click',()=>{
          const target=tab.dataset.vjobTab;
          document.querySelectorAll(`#vehicleJobModal .vehicle-job-tab[data-vjob-id=\"${v.id}\"]`).forEach(x=>x.classList.toggle('active',x===tab));
          document.querySelectorAll(`#vehicleJobModal .vehicle-job-tab-panel[data-vjob-id=\"${v.id}\"]`).forEach(x=>x.classList.toggle('active',x.dataset.vjobPanel===target));
        });
      });

      document.getElementById(`addVehicleComplaint_${v.id}`)?.addEventListener('click',async()=>{
        const input=document.getElementById(`newVehicleComplaint_${v.id}`);
        const val=input?.value.trim();
        if(!val){toast('Enter a complaint');return;}
        vehicleComplaints(v).push({id:uid(),text:val,status:'',pendingReason:'',pna:'',action:'',remark:'',resolvedAt:null,resolvedBy:null,workStartedAt:null});
        v.complaint=vehicleComplaints(v).map(c=>c.text).join(' | ');
        await saveData(); toast('Complaint added');
        input.value='';
        const listBox=document.querySelector('#vehicleJobModal .complaint-list-scroll');
        if(listBox) listBox.outerHTML=renderVehicleComplaints(v);
        const countBadge=document.querySelector('#vehicleJobModal .inline-action b .badge');
        if(countBadge) countBadge.textContent=vehicleComplaints(v).length;
      });

      document.getElementById(`cancelVehicleAssignment_${v.id}`)?.addEventListener('click',()=>close());

      document.getElementById(`reassignTop_${v.id}`)?.addEventListener('click',()=>{
        const editor=document.getElementById(`assignmentEditor_${v.id}`);
        if(editor){ editor.style.display=editor.style.display==='none'?'block':'none'; }
      });

      // Service Advisor / WM assignment
      document.getElementById(`saveVehicleAssignment_${v.id}`)?.addEventListener('click',async()=>{
        if(!['Service Advisor','Workshop Manager'].includes(currentUser.role)) return;
        const bay=document.getElementById(`assignBay_${v.id}`)?.value||'';
        const inc=document.getElementById(`incident_${v.id}`)?.value.trim()||'';
        const resp=document.getElementById(`respTech_${v.id}`)?.value||'';
        const support=[...(document.getElementById(`supportTech_${v.id}`)?.selectedOptions||[])].map(o=>o.value).filter(Boolean);
        if(!bay){toast('Bay is mandatory');return;}
        if(!/^\d{6}$/.test(inc)){toast('Incident No. must be exactly 6 digits');return;}
        if(!resp){toast('Responsible Technician is mandatory');return;}
        if(support.includes(resp)){toast('Responsible technician cannot be supporting');return;}
        if((DATA.staff.find(s=>s.id===resp)||{}).position!=='Technician'){toast('Responsible user must be a Technician');return;}
        if(technicianIsBusy(resp,v.id)){toast('Responsible Technician is already busy');return;}
        if(support.some(id=>technicianIsBusy(id,v.id))){toast('A selected supporting user is already busy');return;}
        v.allocatedBay=bay; v.workBay=bay;
        v.incidentNumber=inc;
        v.responsibleTechnicianId=resp;
        v.responsibleTechnician=technicianStaffList().find(s=>s.id===resp)?.name||'';
        v.responsibleTechnicianName=v.responsibleTechnician;
        v.supportingTechnicianIds=support;
        v.supportingTechnicians=support.map(id=>(DATA.staff.find(s=>s.id===id)||{}).name||'').filter(Boolean);
        if(!v.assignedAt) v.assignedAt=nowISO();
        v.assignedBy=whoTag();
        v.currentStatus='ASSIGNED';
        if(!await persistWorkflow(v,'ASSIGN VEHICLE',nowISO(),{bay,incidentNumber:inc,responsibleTechnician:v.responsibleTechnician,supportingTechnicians:v.supportingTechnicians||[]})) return;
        toast('Vehicle assigned and saved successfully');
        close();
        render();
      });

      // Search and add more complaints ONLY from WM master Complaint List.
      const jobSearch=document.getElementById(`jobComplaintSearch_${v.id}`);
      if(jobSearch){
        const drawJobComplaints=()=>{
          const q=jobSearch.value.trim().toLowerCase();
          const master=[...new Set((DATA.settings?.complaintList||[]).map(x=>String(x).trim()).filter(Boolean))];
          const existing=vehicleComplaints(v).map(c=>c.text.toLowerCase());
          const box=document.getElementById(`jobComplaintResults_${v.id}`);
          // Keep the complaint master hidden until the user actually searches.
          // Only matching complaints are shown; selected complaints remain in the
          // vehicle's complaint list above.
          if(!q){
            if(box) box.innerHTML='';
            return;
          }
          const matches=master.filter(x=>!existing.includes(x.toLowerCase()) && x.toLowerCase().includes(q)).slice(0,15);
          if(box) box.innerHTML=matches.map(x=>`<button type="button" class="master-result" data-add-job-complaint="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('') || '<small style="color:var(--muted)">No matching master complaints.</small>';
          box?.querySelectorAll('[data-add-job-complaint]').forEach(b=>b.addEventListener('click',async()=>{
            vehicleComplaints(v).push({id:uid(),text:b.dataset.addJobComplaint,status:'',pendingReason:'',remark:'',resolvedAt:null,resolvedBy:null,workStartedAt:null});
            v.complaint=vehicleComplaints(v).map(c=>c.text).join(' | ');
            await saveData(); jobSearch.value=''; drawJobComplaints();
            const box2=document.querySelector('#vehicleJobModal .complaint-list-scroll');
            if(box2) box2.outerHTML=renderVehicleComplaints(v);
          }));
        };
        jobSearch.addEventListener('input',drawJobComplaints); drawJobComplaints();
      }

      // Technician-only complaint addition from the Complaint Master.
      const techSearch=document.getElementById(`techComplaintSearch_${v.id}`);
      if(techSearch){
        const drawTechComplaints=()=>{
          const q=techSearch.value.trim().toLowerCase();
          const master=[...new Set((DATA.settings?.complaintList||[]).map(x=>String(x).trim()).filter(Boolean))];
          const existing=vehicleComplaints(v).map(c=>String(c.text||'').toLowerCase());
          const box=document.getElementById(`techComplaintResults_${v.id}`);
          if(!q){if(box)box.innerHTML='';return;}
          const matches=master.filter(x=>!existing.includes(x.toLowerCase())&&x.toLowerCase().includes(q)).slice(0,15);
          if(box)box.innerHTML=matches.map(x=>`<button type="button" class="master-result" data-add-tech-complaint="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('')||'<small style="color:var(--muted)">No matching master complaints.</small>';
          box?.querySelectorAll('[data-add-tech-complaint]').forEach(b=>b.addEventListener('click',async()=>{
            vehicleComplaints(v).push({id:uid(),text:b.dataset.addTechComplaint,status:'',pendingReason:'',remark:'',resolvedAt:null,resolvedBy:null,workStartedAt:null});
            v.complaint=vehicleComplaints(v).map(c=>c.text).join(' | ');
            await saveData();toast('Driver complaint added');techSearch.value='';drawTechComplaints();
            const listBox=document.querySelector('#vehicleJobModal .complaint-list-scroll');
            if(listBox)listBox.outerHTML=renderVehicleComplaints(v);
          }));
        };
        techSearch.addEventListener('input',drawTechComplaints);drawTechComplaints();
      }

      // Any Technician or MSV Driver can start work after Security GATE IN.
      // The person who starts the job becomes the main responsible technician.
      document.getElementById(`workStart_${v.id}`)?.addEventListener('click',async()=>{
        const role=String(currentUser?.role||'').trim();
        if(!['Technician','MSV Driver'].includes(role)){toast('Only Technician / MSV Driver can start work');return;}
        if(v.status!=='IN'){toast('Vehicle must be GATE IN first');return;}
        if(v.hold){toast('Vehicle is on HOLD');return;}
        if(hasActiveWorkSegment(v)){toast('WORK TIMER IS ALREADY RUNNING');return;}
        const bay=document.getElementById(`startBay_${v.id}`)?.value||'';
        const support=[...(document.getElementById(`startSupport_${v.id}`)?.selectedOptions||[])].map(o=>o.value).filter(Boolean);
        if(!bay){toast('Please select Work Bay');return;}
        if(support.includes(String(currentUser?.id||''))){toast('Starter cannot be selected as supporting technician');return;}
        if(support.some(id=>technicianIsBusy(id,v.id))){toast('A selected supporting technician is already busy');return;}
        const started=nowISO();
        if(!startWorkSegment(v,started)){toast('WORK TIMER IS ALREADY RUNNING');return;}
        vehicleComplaints(v).forEach(c=>{if(!c.workStartedAt)c.workStartedAt=started;});
        v.allocatedBay=bay; v.workBay=bay;
        v.responsibleTechnicianId=currentUser.id||'';
        v.responsibleTechnician=currentUser.name||'';
        v.responsibleTechnicianName=v.responsibleTechnician;
        v.supportingTechnicianIds=support;
        v.supportingTechnicians=support.map(id=>(DATA.staff.find(st=>String(st.id)===String(id))||{}).name||'').filter(Boolean);
        v.assignedAt=v.assignedAt||started;
        v.assignedBy=whoTag();
        v.workStartedById=currentUser.id||'';
        v.workStartedBy=currentUser.name||'';
        v.workStartedByRole=role;
        v.currentStatus='WIP';
        if(!await persistWorkflow(v,'START WORK',started,{segmentStart:started,startedBy:v.workStartedBy,bay,supportingTechnicians:v.supportingTechnicians||[]})) return;
        toast('WORK STARTED — WIP');close();render();
      });

      const saveComplaintState=async(idx)=>{
        const c=vehicleComplaints(v)[idx]; if(!c)return;
        const st=document.getElementById(`vc_status_${v.id}_${idx}`)?.value||'';
        const reason=document.getElementById(`vc_reason_${v.id}_${idx}`)?.value||'';
        const remark=document.getElementById(`vc_action_${v.id}_${idx}`)?.value.trim()||'';
        if(!st){toast('Complaint status is mandatory');return;}
        if(st==='PENDING' && !reason){toast('Pending reason is mandatory');return;}
        c.status=st;c.pendingReason=st==='PENDING'?reason:'';
        c.remark=remark;
        if(st==='RESOLVED'){c.resolvedAt=nowISO();c.resolvedBy=whoTag();}
        else {c.resolvedAt=null;c.resolvedBy=null;}
        await saveData();toast('Complaint updated');
        const box=modal.querySelector('.complaint-list-scroll');if(box)box.outerHTML=renderVehicleComplaints(v);
        /* FIX: keep WORK DONE button in sync with complaint decisions without reopening the job */
        {const wd=modal.querySelector(`#workDone_${v.id}`);
        if(wd){ const ok=vehicleWorkDoneAllowed(v); wd.disabled=!ok; const sm=wd.querySelector('small'); if(sm) sm.textContent=ok?'Complete this job':'Resolve complaints / add pending reason'; }}
      };
      modal?.addEventListener('click',async(e)=>{
        const b=e.target.closest(`[data-save-complaint="${v.id}"]`);
        if(b){
          if(!technicianCanSeeVehicle(v,currentUser) && currentUser?.role!=='Workshop Manager'){return;}
          await saveComplaintState(Number(b.dataset.complaintIndex)); return;
        }
        if(e.target.closest(`#saveVehicleRemark_${v.id}`)){
          if(!technicianCanSeeVehicle(v,currentUser) && currentUser?.role!=='Workshop Manager')return;
          v.workRemark=document.getElementById(`vehicleRemark_${v.id}`)?.value.trim()||'';
          await saveData();toast('Remark saved');return;
        }
        if(e.target.closest(`#copyDriverFeedback_${v.id}`)){
          if(currentUser?.role!=='Workshop Manager' && currentUser?.role!=='Service Advisor')return;
          await sendDriverFeedbackCopy(v);
          return;
        }
        if(e.target.closest(`#workDone_${v.id}`)){
          if(!['Technician','MSV Driver'].includes(currentUser?.role) || !techIsMainWorker(v)){toast('Only the main responsible technician who started the work can complete it');return;}
          if(v.hold || !hasActiveWorkSegment(v)){toast('Work is not actively running. Resume the job before WORK DONE.');return;}
          if(v.workDoneAt || v.rfdAt){toast('This job is already completed.');return;}
          if(!vehicleWorkDoneAllowed(v)){toast('Complete every complaint or give a pending reason');return;}
          const t=nowISO();
          closeActiveWorkSegment(v,t);
          v.workDoneAt=t;
          v.workDoneBy=whoTag();
          v.workStartedAt=null;
          v.currentStatus='WORK DONE';
          v.workTimerFinishedAt=t;
          v.workTimerFinishedDuration=vehicleWorkElapsed(v);
          driverFeedbackToken(v);
          if(!await persistWorkflow(v,'WORK DONE',t,{finalWorkTime:v.workTimerFinishedDuration,workDoneAt:t})) return;
          toast(`WORK DONE — final work time ${v.workTimerFinishedDuration}`);close();render();return;
        }
        if(e.target.closest(`#holdVehicleJob_${v.id}`)){
          if(currentUser?.role!=='Workshop Manager' && !technicianCanSeeVehicle(v,currentUser))return;
          if(v.hold || !hasActiveWorkSegment(v) || v.workDoneAt || v.rfdAt){toast('No active work timer to put on HOLD.');return;}
          // Use a safe default so HOLD works reliably on Android/WebView where prompt dialogs may be blocked.
          let reason='WORK HOLD';
          try{ const entered=window.prompt('Hold reason (optional):', v.holdReason||'WORK HOLD'); if(entered!==null && String(entered).trim()) reason=String(entered).trim(); }catch(err){ cocoLog('ignored error',err); }
          const t=nowISO();
          closeActiveWorkSegment(v,t);
          v.hold=true;
          v.holdKind='WORK_PAUSE'; v.holdById=currentUser?.id||'';
          v.holdAt=t;
          v.holdBy=whoTag();
          v.holdReason=reason.trim();
          v.holdStartedWorkAt=v.workStartedAt||v.holdStartedWorkAt||t;
          v.workStartedAt=null;
          v.currentStatus='HOLD';
          if(!await persistWorkflow(v,'HOLD WORK',t,{holdReason:v.holdReason,holdAt:t,workTime:vehicleWorkElapsed(v)})) return;
          toast(`WORK PAUSED — timer stopped at ${vehicleWorkElapsed(v)}`);close();render();return;
        }
        if(e.target.closest(`#resumeHeld_${v.id}`)){
          if(!(['Service Advisor','Workshop Manager'].includes(currentUser?.role) || techOwnPause(v)))return;
          if(!v.hold || v.workDoneAt || v.rfdAt){toast('Vehicle is not in a resumable HOLD state.');return;}
          if(hasActiveWorkSegment(v)){toast('WORK TIMER IS ALREADY RUNNING');return;}
          const bay=(currentUser?.role==='Technician'&&v.allocatedBay)?v.allocatedBay:prompt('Parking / Bay for resumed vehicle:',v.allocatedBay||'');
          if(!bay?.trim()){toast('Parking / Bay is required');return;}
          v.allocatedBay=bay.trim();
          const resumed=nowISO();
          v.hold=false; v.holdKind='';
          v.holdReleasedAt=resumed;
          v.holdReleasedBy=whoTag();
          // Resume creates a new work segment. Previous segments remain closed,
          // so HOLD time is excluded from the total and the live timer continues.
          if(!startWorkSegment(v,resumed)){toast('Unable to resume — active work timer already exists');return;}
          if(!await persistWorkflow(v,'UNHOLD / RESUME',resumed,{holdReleasedAt:resumed,bay:v.allocatedBay||''})) return;
          toast(`WORK RESUMED — timer continues from ${vehicleWorkElapsed(v)}`);close();render();return;
        }
        if(e.target.closest(`#rfd_${v.id}`)){
          if(currentUser?.role!=='Workshop Manager')return;
          if(!v.workDoneAt || v.hold || hasActiveWorkSegment(v)){toast('RFD is available only after WORK DONE and a stopped timer.');return;}
          const inc=document.getElementById(`incidentFinal_${v.id}`)?.value.trim()||v.incidentNumber||'';
          if(!/^\d{6}$/.test(inc)){toast('Incident No. must be exactly 6 digits');return;}
          if(!vehicleWorkDoneAllowed(v)){toast('Pending complaint needs a reason before RFD');return;}
          const rfdAt=nowISO();
          v.incidentNumber=inc;v.rfdAt=rfdAt;v.rfdBy=whoTag();
          // RFD immediately releases the vehicle to Security for GATE OUT.
          v.releaseAt=rfdAt;v.releaseBy=whoTag();v.currentStatus='WAITING FOR OUT';
          if(!await persistWorkflow(v,'RFD',rfdAt,{incidentNumber:inc,rfdAt,releaseAt:rfdAt})) return;
          toast('RFD completed — vehicle released to Security');close();render();return;
        }
        if(e.target.closest(`#reassignVehicle_${v.id}`)){
          if(!['Service Advisor','Workshop Manager'].includes(currentUser?.role))return;
          const resumed=nowISO();v.rfdAt=null;v.rfdBy=null;v.workDoneAt=null;
          if(!startWorkSegment(v,resumed)){toast('Unable to resume — active work timer already exists');return;}
          if(!await persistWorkflow(v,'RE-ASSIGN / RESUME',resumed,{fromRFD:true})) return;
          toast('Work resumed — timer continues from previous segments');close();render();return;
        }
        if(e.target.closest(`#releaseVehicle_${v.id}`)){
          if(currentUser?.role!=='Workshop Manager')return;
          if(!vehicleCanRelease(v)){toast('Complete billing/payment and enter a valid 6-digit incident number before RFD');return;}
          const releasedAt=nowISO();
          v.releaseAt=releasedAt;v.releaseBy=whoTag();v.currentStatus='WAITING FOR OUT';
          if(!await persistWorkflow(v,'RELEASE TO SECURITY',releasedAt,{releaseAt:releasedAt})) return;
          toast('Vehicle released — WAITING FOR OUT');close();render();return;
        }
        if(e.target.closest(`#gateOutFromJob_${v.id}`)){
          if(!['Security Guard','Workshop Manager'].includes(currentUser?.role)){toast('Security Guard / Workshop Manager permission required');return;}
          if(isVehicleHeld(v)){toast('Vehicle is on HOLD');return;}
          if(v.currentStatus!=='WAITING FOR OUT' || !v.releaseAt){toast('Vehicle must be released to Security first');return;}
          if(v.status==='OUT'){toast('Vehicle is already OUT');return;}
          const outAt=nowISO();
          v.outTime=outAt;v.outLoggedBy=whoTag();v.status='OUT';v.currentStatus='OUT';
          if(!await persistWorkflow(v,'GATE OUT',outAt,{outTime:outAt,releaseAt:v.releaseAt})) return;
          toast('Vehicle marked OUT');close();render();return;
        }

  const vNo=document.getElementById('v_no');

  if(vNo){
    let lookupTimer;
    let lastDuplicatePopupNo='';
    const duplicateMsg=document.getElementById('vehicleDuplicateMsg');
    const duplicateModal=document.getElementById('duplicateVehicleModal');
    const duplicateText=document.getElementById('duplicateVehicleText');
    const duplicateClose=document.getElementById('duplicateVehicleClose');
    const isOpenVehicleTicket=(no)=>{
      const normalized=String(no||'').trim().toUpperCase();
      if(!normalized) return null;
      return (DATA.vehicles||[]).find(v=>!isVehicleDeleted(v)
        && String(v.vehicleNo||'').trim().toUpperCase()===normalized
        && v.status!=='OUT' && v.currentStatus!=='OUT');
    };
    const checkVehicleDuplicate=()=>{
      // FIX: delayed lookup/blur timers can fire after the form was submitted and
      // removed; never raise the duplicate popup for a form that is gone.
      if(!vNo.isConnected){ duplicateModal?.classList.remove('show'); return null; }
      const no=vNo.value.trim().toUpperCase();
      const duplicate=isOpenVehicleTicket(no);
      vNo.classList.toggle('vehicle-number-duplicate',!!duplicate);
      duplicateMsg?.classList.toggle('show',!!duplicate);
      const submitBtn=vNo.form?.querySelector('button[type="submit"]');
      if(submitBtn) submitBtn.disabled=!!duplicate;
      if(duplicate && no!==lastDuplicatePopupNo){
        lastDuplicatePopupNo=no;
        if(duplicateText) duplicateText.textContent=`Vehicle ${no} already has an active ticket. Please use the existing ticket.`;
        duplicateModal?.classList.add('show');
      }
      if(!duplicate) lastDuplicatePopupNo='';
      return duplicate;
    };
    duplicateClose?.addEventListener('click',()=>duplicateModal?.classList.remove('show'));
    duplicateModal?.addEventListener('click',e=>{if(e.target===duplicateModal) duplicateModal.classList.remove('show');});

    const driverLookupMsg=document.getElementById('driverLookupMsg');
    const addSecondDriverBtn=document.getElementById('addSecondDriverBtn');
    const secondDriverSection=document.getElementById('secondDriverSection');
    const vPhone2=document.getElementById('v_phone2');
    const vDriver2=document.getElementById('v_driver2');
    let secondDriverEnabled=false;

    addSecondDriverBtn?.addEventListener('click',()=>{
      secondDriverEnabled=!secondDriverEnabled;
      if(secondDriverSection) secondDriverSection.style.display=secondDriverEnabled?'block':'none';
      if(addSecondDriverBtn) addSecondDriverBtn.textContent=secondDriverEnabled?'− REMOVE SECOND DRIVER':'＋ ADD SECOND DRIVER';
      if(vPhone2) vPhone2.required=secondDriverEnabled;
      if(vDriver2) vDriver2.required=secondDriverEnabled;
      if(!secondDriverEnabled){ if(vPhone2) vPhone2.value=''; if(vDriver2) vDriver2.value=''; }
    });

    const normalizedPhone=x=>String(x||'').replace(/\D/g,'');
    const lookupPreviousVehicle=async()=>{
      if(!vNo.isConnected) return;
      const no=vNo.value.trim().toUpperCase();
      if(!no) return;
      if(checkVehicleDuplicate()) return;
      let matches=(DATA.vehicles||[])
        .filter(v=>!isVehicleDeleted(v) && String(v.vehicleNo||'').trim().toUpperCase()===no && (v.driverPhone||v.driverName||v.driverContact))
        .sort((a,b)=>new Date(b.reportedAt||b.createdAt||b.inTime||0)-new Date(a.reportedAt||a.createdAt||a.inTime||0));

      // Refresh the single cloud state before deciding that no previous driver exists.
      // This fixes lookups when another device/browser created the vehicle history.
      try{ if(supabaseClient){ await readRemote(); matches=(DATA.vehicles||[])
        .filter(v=>!isVehicleDeleted(v) && String(v.vehicleNo||'').trim().toUpperCase()===no && (v.driverPhone||v.driverName||v.driverContact))
        .sort((a,b)=>new Date(b.reportedAt||b.createdAt||b.inTime||0)-new Date(a.reportedAt||a.createdAt||a.inTime||0)); } }catch(e){ console.warn('driver lookup refresh failed',e); }

      const previous=matches[0];
      if(!previous){
        if(driverLookupMsg) driverLookupMsg.textContent='';
        return;
      }
      const phone=previous.driverPhone||previous.driverContact||'';
      const name=previous.driverName||'';
      if(vPhone && phone) vPhone.value=phone;
      if(vDriver && name) vDriver.value=name;
      if(driverLookupMsg){ driverLookupMsg.textContent='✓ Previous driver details fetched — editable'; driverLookupMsg.className='driver-lookup-msg'; }
    };
    vNo.addEventListener('input',()=>{
      checkVehicleDuplicate();
      clearTimeout(lookupTimer);

            <button class="btn btn-primary" id="saveClockEdit">Save Time</button>
          </div>
        </div>
      </div>`;
      document.body.insertAdjacentHTML('beforeend',html);

      let selected=options[0];
      let hour=new Date(selected.time).getHours()%12 || 12;
      let minute=new Date(selected.time).getMinutes();

      const punchSel=document.getElementById('clockPunch');
      const minuteSlider=document.getElementById('clockMinute');
      const readout=document.getElementById('clockReadout');

      function syncClock(){
        readout.textContent=`${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
        const deg=((hour%12)*30)-90;
        const hand=document.getElementById('clockHand');
        if(hand) hand.style.transform=`translate(-50%,-100%) rotate(${deg}deg)`;
        minuteSlider.value=minute;
      }
      function setHourFromPoint(clientX,clientY){
        const face=document.getElementById('clockFace');
        const rect=face.getBoundingClientRect();
        const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
        const angle=Math.atan2(clientY-cy,clientX-cx)*180/Math.PI+90;
        let h=Math.round(angle/30);
        h=((h%12)+12)%12;
        hour=h===0?12:h;
        syncClock();
      }
      const face=document.getElementById('clockFace');
      let draggingHour=false;
      face.addEventListener('pointerdown',e=>{
        draggingHour=true; face.setPointerCapture?.(e.pointerId);
        setHourFromPoint(e.clientX,e.clientY);
      });
      face.addEventListener('pointermove',e=>{
        if(draggingHour) setHourFromPoint(e.clientX,e.clientY);
      });
      face.addEventListener('pointerup',()=>draggingHour=false);
      face.addEventListener('pointercancel',()=>draggingHour=false);
      minuteSlider.addEventListener('input',()=>{minute=Number(minuteSlider.value);syncClock();});

      document.getElementById('cancelClockEdit').onclick=()=>document.getElementById('clockEditModal')?.remove();
      document.getElementById('saveClockEdit').onclick=()=>{

          toast('Security can only edit within ±30 minutes of current time');
          return;
        }
        const emp=DATA.employees.find(e=>e.id===selected.id);
        if(!emp){toast('Punch record not found');return;}
        if(selected.kind==='IN' && emp.outTime && chosen>new Date(emp.outTime)){
          toast('IN time cannot be after OUT time');return;
        }
        if(selected.kind==='OUT' && chosen<new Date(emp.inTime)){
          toast('OUT time cannot be before IN time');return;
        }
        confirmAndRun(`Save ${selected.kind} time as ${chosen.toLocaleString()}?`,async()=>{
          if(selected.kind==='IN') emp.inTime=chosen.toISOString();
          else emp.outTime=chosen.toISOString();
          emp.editedBy=whoTag();
          emp.editedAt=nowISO();
          await saveData();
          document.getElementById('clockEditModal')?.remove();
          toast(`${selected.kind} time updated`);
          render();
        });

    });

/* ---------------- DRIVER FEEDBACK ---------------- */
const DRIVER_FEEDBACK_TABLE = 'driver_feedback';

function driverFeedbackToken(v){
  if(!v.driverFeedbackToken){
    v.driverFeedbackToken = (crypto && crypto.randomUUID) ? crypto.randomUUID() : ('fb_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));
  }
  return v.driverFeedbackToken;
}
// A driver feedback link must be HTTPS-hosted to work on the driver's phone.
// When COCO FLOW is opened from Android content://, there is no shareable public URL.
// Set this constant after hosting the same HTML at an HTTPS address.
const DRIVER_FEEDBACK_PUBLIC_BASE_URL = '';
function driverFeedbackBaseUrl(){
  if(DRIVER_FEEDBACK_PUBLIC_BASE_URL) return DRIVER_FEEDBACK_PUBLIC_BASE_URL.replace(/\?$/,'');
  if(/^https?:$/i.test(location.protocol)) return location.href.split('#')[0].split('?')[0];
  return '';
}

function driverFeedbackLink(v){
  const token = driverFeedbackToken(v);
  const base = driverFeedbackBaseUrl();
  if(!base) return '';
  const p = new URLSearchParams();
  p.set('driverFeedback', token);
  return base+'?'+p.toString();
}
function driverFeedbackMessage(v, link){
  return `COCO FLOW – Driver Feedback\n\nDear ${v.driverName||'Driver'}, your vehicle ${v.vehicleNo||''} work has been completed.\nPlease share your feedback about the service received.\n\nFeedback Link:\n${link}\n\nThank you – COCO FLOW`;
}
function driverFeedbackPhone(v){
  return String(v.driverPhone||v.phone||'').replace(/[^\d+]/g,'');
}
function driverFeedbackWhatsApp(v){
  const phone=driverFeedbackPhone(v);
  const link=driverFeedbackLink(v);
  const msg=driverFeedbackMessage(v,link);
  return 'https://wa.me/'+phone.replace(/^\+/,'')+'?text='+encodeURIComponent(msg);
}
function driverFeedbackSms(v){
  const phone=driverFeedbackPhone(v);
  const link=driverFeedbackLink(v);
  const msg=driverFeedbackMessage(v,link);
  return 'sms:'+phone+'?body='+encodeURIComponent(msg);
}
function driverFeedbackHtml(v){
  if(!v.workDoneAt) return '';
  const phone=driverFeedbackPhone(v);
  const link=driverFeedbackLink(v);
  const status=v.driverFeedbackSubmittedAt
    ? `Received ${fmtTime(v.driverFeedbackSubmittedAt)} · Rating: ${v.driverFeedbackRating||'—'}/5`
    : 'Not yet received';
  return `<div class="driver-feedback-box">
    <div class="driver-feedback-head">
      <span class="driver-feedback-title">DRIVER FEEDBACK</span>
      <span class="badge stage">${v.driverFeedbackSubmittedAt?'RECEIVED':'PENDING'}</span>
    </div>
    <div class="driver-feedback-status">${escapeHtml(status)}</div>
    <div class="driver-feedback-actions">
      ${phone && link ? `<a class="btn btn-green" href="${escapeHtml(driverFeedbackWhatsApp(v))}" target="_blank" rel="noopener">WHATSAPP</a>` : ''}
      ${phone && link ? `<a class="btn btn-blue" href="${escapeHtml(driverFeedbackSms(v))}">SMS</a>` : ''}
      ${link ? `<button type="button" class="btn-ghost" id="copyDriverFeedback_${v.id}">COPY LINK</button>` : ''}
    </div>
    ${!link ? '<small style="color:var(--red);display:block;margin-top:8px;">Feedback link is not active while COCO FLOW is opened from a local Android file. Host the app at an HTTPS address first.</small>' : (phone ? '' : '<small style="color:var(--red);display:block;margin-top:8px;">Driver phone number is missing. Add the number before sending feedback.</small>')}
  </div>`;
}
async function sendDriverFeedbackCopy(v){
  const link=driverFeedbackLink(v);
  if(!link){toast('Feedback link is not active until COCO FLOW is hosted at an HTTPS web address');return;}
  try{
    await navigator.clipboard.writeText(link);
    toast('Driver feedback link copied');
  }catch(e){
    prompt('Copy driver feedback link:',link);
  }
}
async function ensureDriverFeedbackSupabase(){
  if(window.supabase?.createClient) return window.supabase;
  await loadExternalScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js','supabase',12000);
  if(!window.supabase?.createClient) throw new Error('Feedback connection library unavailable');
  return window.supabase;
}
async function saveDriverFeedbackPublic(payload){
  const sb=await ensureDriverFeedbackSupabase();
  const client=sb.createClient(DEFAULT_SUPABASE_URL,DEFAULT_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false}});
  const {error}=await client.from(DRIVER_FEEDBACK_TABLE).insert(payload);
  if(error) throw error;
}
function bootDriverFeedbackMode(){
  const params=new URLSearchParams(location.search);
  const token=params.get('driverFeedback');
  if(!token) return false;

  document.documentElement.style.background='var(--bg)';
  document.body.innerHTML=`<main class="driver-feedback-public">
    <section class="driver-feedback-card">
      <div class="driver-feedback-brand">COCO FLOW</div>
      <div class="driver-feedback-sub">Driver Service Feedback</div>
      <div id="driverFeedbackApp"></div>
    </section>
  </main>`;

  const vehicle=params.get('vehicle')||'';
  const driver=params.get('driver')||'Driver';
  const incident=params.get('incident')||'';
  const host=document.getElementById('driverFeedbackApp');
  if(!/^https?:$/i.test(location.protocol)){
    host.innerHTML=`<div class="driver-feedback-error" style="margin-top:20px;">This feedback link is not publicly reachable because COCO FLOW is currently opened from an Android local file (content://). Host COCO FLOW at an HTTPS web address and set DRIVER_FEEDBACK_PUBLIC_BASE_URL in the app.</div>`;
    return true;
  }

  let rating=0;
  const renderForm=()=>{
    host.innerHTML=`<div class="driver-feedback-vehicle">
      <b>Vehicle: ${escapeHtml(vehicle||'—')}</b>
      ${driver ? `<div style="margin-top:4px;color:var(--muted);font-size:13px;">Driver: ${escapeHtml(driver)}</div>`:''}
      ${incident ? `<div style="margin-top:3px;color:var(--muted);font-size:12px;">Incident: ${escapeHtml(incident)}</div>`:''}
    </div>
    <div class="field">
      <label>Overall Service Rating *</label>
      <div class="driver-feedback-stars">
        ${[1,2,3,4,5].map(n=>`<button type="button" data-feedback-rating="${n}" aria-label="${n} star">${'★'.repeat(n)}</button>`).join('')}
      </div>
    </div>
    <div class="field"><label>Was your issue resolved? *</label>
      <select id="driverFeedbackResolved"><option value="">Select</option><option value="YES">Yes</option><option value="NO">No</option></select>
    </div>
    <div class="field"><label>Technician Behaviour</label>
      <select id="driverFeedbackTechnician"><option value="">Select</option><option value="EXCELLENT">Excellent</option><option value="GOOD">Good</option><option value="AVERAGE">Average</option><option value="POOR">Poor</option></select>
    </div>
    <div class="field"><label>Repair Quality</label>
      <select id="driverFeedbackQuality"><option value="">Select</option><option value="EXCELLENT">Excellent</option><option value="GOOD">Good</option><option value="AVERAGE">Average</option><option value="POOR">Poor</option></select>
    </div>
    <div class="field"><label>Comments / Suggestions</label><textarea id="driverFeedbackComment" rows="4" maxlength="1000" placeholder="Tell us what went well or what we should improve..."></textarea></div>
    <div id="driverFeedbackError"></div>
    <button type="button" class="btn btn-primary driver-feedback-submit" id="driverFeedbackSubmit">SUBMIT FEEDBACK</button>`;

    host.querySelectorAll('[data-feedback-rating]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        rating=Number(btn.dataset.feedbackRating);
        host.querySelectorAll('[data-feedback-rating]').forEach(x=>x.classList.toggle('selected',Number(x.dataset.feedbackRating)===rating));
      });
    });
    document.getElementById('driverFeedbackSubmit').addEventListener('click',async()=>{
      const err=document.getElementById('driverFeedbackError');
      const resolved=document.getElementById('driverFeedbackResolved').value;
      if(!rating){err.innerHTML='<div class="driver-feedback-error">Please select an overall rating.</div>';return;}
      if(!resolved){err.innerHTML='<div class="driver-feedback-error">Please tell us whether your issue was resolved.</div>';return;}
      const btn=document.getElementById('driverFeedbackSubmit');
      btn.disabled=true; btn.textContent='SUBMITTING...'; err.innerHTML='';
      try{
        await saveDriverFeedbackPublic({
          token,
          vehicle_id:null,
          vehicle_no:vehicle,
          driver_name:driver,
          incident_no:incident,
          rating,
          issue_resolved:resolved,
          technician_behaviour:document.getElementById('driverFeedbackTechnician').value||null,
          repair_quality:document.getElementById('driverFeedbackQuality').value||null,
          comments:document.getElementById('driverFeedbackComment').value.trim()||null,
          submitted_at:new Date().toISOString()
        });
        host.innerHTML=`<div class="driver-feedback-thanks">
          <div style="font-size:40px;">✓</div>
          <h2>Thank You</h2>
          <p style="color:var(--muted);">Your feedback has been submitted successfully.</p>
          <p style="font-size:12px;color:var(--muted);">COCO FLOW Workshop</p>
        </div>`;
      }catch(e){
        console.error(e);
        btn.disabled=false; btn.textContent='SUBMIT FEEDBACK';
        err.innerHTML='<div class="driver-feedback-error">Feedback could not be submitted. The feedback table/policy may not be configured yet.</div>';
      }
    });
  };
  renderForm();
  return true;
}

}

<script id="clean-login-controller">
(function(){
  function loadCachedWorkshopData(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const parsed=JSON.parse(raw);
      if(!parsed || typeof parsed!=='object') return false;
      normalizeData(parsed);
      return Array.isArray(DATA.staff);
    }catch(e){ console.warn('Local workshop cache unavailable',e); return false; }
  }
  function getStaffList(){
    const list=Array.isArray(DATA.staff)?DATA.staff:[];
    return list.filter(s=>s && (s.name||s.empName) && ROLES.includes(String(s.position||s.role||'').trim()));
  }
  async function doCleanLogin(ev){
    if(ev) ev.preventDefault();
    const err=document.getElementById('cleanLoginError');
    const button=document.getElementById('cleanLoginButton');
    const mobile=String(document.getElementById('cleanLoginMobile')?.value||'').replace(/\D/g,'');
    const password=String(document.getElementById('cleanLoginPassword')?.value||'');
    if(err) err.textContent='';
    if(!mobile){if(err)err.textContent='Enter your registered mobile number.';return;}
    if(!password){if(err)err.textContent='Enter your password.';return;}
    if(!getStaffList().length){if(err)err.textContent='No registered staff accounts found. Connect to workshop cloud or ask WM to check Staff Directory.';return;}
    const staff=getStaffList().find(s=>staffPhoneDigits(s)===mobile);
    if(!staff){if(err)err.textContent='Mobile number is not registered. Contact Workshop Manager.';return;}
    const defaultPw=defaultStaffPassword(staff);
    const legacyPw=legacyDefaultStaffPassword(staff);
    const stored=staff.password==null?'':String(staff.password);
    const isLegacyDefault=!!legacyPw && stored===legacyPw && legacyPw!==defaultPw;
    const accepted=stored?[stored]:[defaultPw];
    if(isLegacyDefault)accepted.push(defaultPw);
    if(!accepted.includes(password)){if(err)err.textContent='Incorrect mobile number or password.';return;}
    if(isLegacyDefault && password===defaultPw){staff.password=defaultPw;await saveData();}
    if(button)button.disabled=true;
    lastLocalWriteAt=null;localWriteSnapshot=null;lastRemoteUpdatedAt=null;
    const staffRole=String(staff.position||staff.role||'').trim();
    currentUser={id:staff.id??staff.staffId??staffRole+'-'+(staff.name||''),name:staff.name||staff.empName||'',role:staffRole,phone:staff.phone||staff.mobile||staff.loginId||'',loginPhone:mobile};
    if(staffRole==='Workshop Manager'){
      try{localStorage.setItem('coco-flow-wm-original-user',JSON.stringify({id:staff.id,name:staff.name,role:'Workshop Manager',phone:currentUser.phone}));}catch(_e){}
    }else{
      try{localStorage.removeItem('coco-flow-wm-original-user');}catch(_e){}
    }
    try{
      await saveSession();
      document.body.classList.remove('clean-login-active');
      const screen=document.getElementById('cleanLoginScreen');if(screen)screen.style.display='none';
      if(err)err.textContent='';
      render();
    }catch(e){
      console.error(e);currentUser=null;if(button)button.disabled=false;
      if(err)err.textContent=e?.message||'Could not log in. Please try again.';
    }
  }
  loadCachedWorkshopData();
  // Load shared data before login, but never display a staff-name list on the login screen.
  (async()=>{try{await loadData(false);}catch(e){console.warn('Initial shared staff sync failed:',e);}})();
  const form=document.getElementById('cleanLoginForm');
  if(form)form.addEventListener('submit',doCleanLogin);
})();
</script>

<script id="coco-security-guard-access-fix">
(function(){
  function isSecurityGuard(emp){
    const text = [
      emp?.role, emp?.position, emp?.designation, emp?.employeeRole,
      emp?.department, emp?.employee_type, emp?.employeeType, emp?.name
    ].map(x=>String(x||'').toLowerCase()).join(' ');
    return /\bsecurity\b|\bsecurity guard\b|\bguard\b/.test(text);
  }

  function getSecurityGuards(){
    const a = Array.isArray(DATA?.staff) ? DATA.staff : [];
    return a.filter(isSecurityGuard);
  }

  function guardId(g){
    return String(g?.id || g?.employee_id || g?.employeeCode || g?.code || g?.name || '');
  }

  function ensureDutyStore(){
    if(!DATA) return {};
    if(!DATA.securityDuty || typeof DATA.securityDuty !== 'object' || Array.isArray(DATA.securityDuty)){
      DATA.securityDuty = {};
    }
    return DATA.securityDuty;
  }

  window.cocoIsSecurityGuard = isSecurityGuard;

  window.cocoSetSecurityDuty = async function(guard, action){
    if(!guard || !isSecurityGuard(guard)) return false;
    action = String(action||'').toUpperCase();
    if(!['IN','OUT'].includes(action)) return false;

    const id = guardId(guard);
    if(!id) return false;

    const store = ensureDutyStore();
    const now = new Date().toISOString();
    const old = store[id] || {};
    store[id] = {
      ...old,
      employee_id:id,
      employee_name:guard.name || guard.employee_name || 'Security Guard',
      phone:guard.phone || guard.mobile || guard.loginId || guard.loginPhone || '',
      status: action==='IN' ? 'ON DUTY' : 'OFF DUTY',
      inAt: action==='IN' ? now : (old.inAt || null),
      outAt: action==='OUT' ? now : null,
      lastAction: action,
      lastUpdatedAt: now,
      updatedBy: currentUser ? currentUser.name : 'Security Guard'
    };

    try{
      if(typeof window.saveData === 'function') await window.saveData();
      if(typeof window.render === 'function') window.render();
    }catch(e){
      console.error('Security duty save failed:', e);
      return false;
    }

    window.cocoRefreshSecurityCallPanel?.();
    return true;
  };

  window.cocoGetAvailableSecurityGuards = function(){
    const store = ensureDutyStore();
    const guards = getSecurityGuards();
    return guards.filter(g=>{
      const d = store[guardId(g)];
      const punch = (()=>{ try { return typeof window.staffPunchRecords==='function' ? window.staffPunchRecords(g).find(e=>!e?.outTime && String(e?.status||'').toUpperCase()==='IN') : (DATA.employees||[]).find(e=>(e?.staffId===g?.id || e?.empName===g?.name) && !e?.outTime && String(e?.status||'').toUpperCase()==='IN'); } catch(e){ return null; } })();
      return !!(punch || (d && d.status==='ON DUTY' && d.lastAction==='IN'));
    });
  };

  // Emergency contacts. Set the nearest hospital number here when your site number is available.
  window.COCO_EMERGENCY_CONTACTS = window.COCO_EMERGENCY_CONTACTS || { hospital:'', fire:'101' };

  window.cocoRefreshSecurityCallPanel = function(){
    const p=document.getElementById('cocoSecurityCallPanel');
    if(!p) return;
    const list=p.querySelector('#cocoSecList');
    if(!list) return;

    const staffList=Array.isArray(DATA?.staff)?DATA.staff:[];
    const employees=Array.isArray(DATA?.employees)?DATA.employees:[];
    const store=ensureDutyStore();
    const settings=(DATA?.settings && typeof DATA.settings==='object') ? DATA.settings : {};
    const saved=(settings.emergencyContacts && typeof settings.emergencyContacts==='object') ? settings.emergencyContacts : {};
    const norm=v=>String(v??'').trim();
    const digits=v=>norm(v).replace(/\D/g,'');
    const roleText=x=>[x?.role,x?.position,x?.designation,x?.employeeRole,x?.employee_type,x?.employeeType].map(norm).join(' ');
    const isSG=x=>/security\s*guard|security|guard/i.test(roleText(x)+' '+norm(x?.name));
    const isWM=x=>/workshop\s*manager/i.test(roleText(x)) || norm(x?.role).toUpperCase()==='WM';
    const personName=x=>norm(x?.name||x?.employee_name||x?.empName||x?.staffName||'');
    const personId=x=>norm(x?.id||x?.employee_id||x?.staffId||x?.employeeCode||x?.code||'');

    // Find a phone number regardless of which field the old/new staff record uses.
    const phoneOf=(obj)=>{
      const seen=new Set();
      const preferred=/(phone|mobile|contact|telephone|tel|whatsapp|cell)/i;
      const blocked=/(password|pass|pin|otp|incident|vehicle|staffid|employee.?id|^id$|code)/i;
      const walk=(v,key='')=>{
        if(v===null||v===undefined) return '';
        if(typeof v==='string'||typeof v==='number'){
          const raw=norm(v), d=digits(raw);
          if(blocked.test(key)) return '';
          if(preferred.test(key) && d.length>=7 && d.length<=15) return raw;
          if(/^\+?91[\s-]?\d{10}$/.test(raw) || /^\d{10}$/.test(d)) return raw;
          return '';
        }
        if(typeof v!=='object'||seen.has(v)) return '';
        seen.add(v);
        const keys=Object.keys(v);
        for(const k of keys){ if(preferred.test(k)){ const hit=walk(v[k],k); if(hit) return hit; } }
        for(const k of keys){ if(blocked.test(k)) continue; const hit=walk(v[k],k); if(hit) return hit; }
        return '';
      };
      return walk(obj);
    };

    const samePerson=(a,b)=>{
      if(!a||!b) return false;
      const ai=personId(a), bi=personId(b);
      if(ai&&bi&&ai===bi) return true;
      const an=personName(a).toLowerCase(), bn=personName(b).toLowerCase();
      return !!an && !!bn && an===bn;
    };

    // Attendance can contain the staff phone even when the staff directory record is old.
    const attendanceFor=(person)=>employees.filter(e=>{
      if(!e) return false;
      if(person?.id!=null && norm(e.staffId)===norm(person.id)) return true;
      if(personName(e) && personName(person) && personName(e).toLowerCase()===personName(person).toLowerCase()) return true;
      const a=digits(e.staffPhone||e.phone||e.mobileNo||e.mobile);
      const b=digits(phoneOf(person));
      return !!a && !!b && a===b;
    });
    const openAttendanceFor=(person)=>attendanceFor(person).find(e=>!e.outTime && String(e.status||'').toUpperCase()==='IN') || null;

    const allSG=staffList.filter(isSG);
    const allWM=staffList.filter(isWM);
    const currentSG=isSG(currentUser) ? currentUser : null;
    const currentWM=isWM(currentUser) ? currentUser : null;
    // The login screen authenticates by mobile/Login ID. Keep that value even
    // when an older staff record has an empty phone field.
    const currentSGPhone = currentSG ? norm(currentSG.phone || currentSG.mobile || currentSG.loginId || currentSG.loginPhone || '') : '';
    const currentWMPhone = currentWM ? norm(currentWM.phone || currentWM.mobile || currentWM.loginId || currentWM.loginPhone || '') : '';

    // Prefer an actually on-duty Security Guard; otherwise use the first registered guard.
    let dutyGuard=currentSG || allSG.find(g=>openAttendanceFor(g));
    if(!dutyGuard) dutyGuard=allSG.find(g=>{
      const d=store[guardId(g)];
      return d && d.status==='ON DUTY' && d.lastAction==='IN';
    }) || allSG[0] || null;

    // If the logged-in Security Guard is not present in DATA.staff, still use the login record.
    if(!dutyGuard && currentSG) dutyGuard=currentSG;
    const dutyRec=dutyGuard ? (openAttendanceFor(dutyGuard) || attendanceFor(dutyGuard).slice(-1)[0] || null) : null;
    const dutyStore=dutyGuard ? store[guardId(dutyGuard)] : null;
    if(dutyGuard===currentSG && currentSG?.loginPhone && dutyStore && !phoneOf(dutyStore)){ dutyStore.phone=currentSG.loginPhone; }
    const dutyPhone=phoneOf(dutyGuard) || phoneOf(dutyRec) || phoneOf(dutyStore) || currentSGPhone || norm(currentSG?.loginPhone||'') || phoneOf(currentSG) || norm(saved.securityGuard?.phone||saved.security?.phone||'');
    const dutyDigits=digits(dutyPhone);

    // WM: current login is the strongest source; otherwise find the registered WM.
    const wm=currentWM || allWM[0] || employees.find(isWM) || null;
    const wmRec=wm ? (openAttendanceFor(wm) || attendanceFor(wm).slice(-1)[0] || null) : null;
    const wmPhone=phoneOf(wm) || phoneOf(wmRec) || currentWMPhone || norm(currentWM?.loginPhone||'') || phoneOf(currentWM) || norm(saved.workshopManager?.phone||saved.wm?.phone||'');
    const wmDigits=digits(wmPhone);

    // Persist the two verified login contacts so they survive old/missing directory fields.
    try{
      if(!DATA.settings || typeof DATA.settings!=='object') DATA.settings={};
      if(!DATA.settings.emergencyContacts || typeof DATA.settings.emergencyContacts!=='object') DATA.settings.emergencyContacts={};
      if(currentSG && (currentSGPhone || currentSG.loginPhone || phoneOf(currentSG))) DATA.settings.emergencyContacts.securityGuard={name:personName(currentSG)||'Security Guard',phone:currentSGPhone || norm(currentSG.loginPhone||'') || phoneOf(currentSG)};
      if(currentWM && (currentWMPhone || currentWM.loginPhone || phoneOf(currentWM))) DATA.settings.emergencyContacts.workshopManager={name:personName(currentWM)||'Workshop Manager',phone:currentWMPhone || norm(currentWM.loginPhone||'') || phoneOf(currentWM)};
    }catch(e){ cocoLog('ignored error',e); }

    const hospitalPhone=norm(window.COCO_EMERGENCY_CONTACTS?.hospital);
    const firePhone=norm(window.COCO_EMERGENCY_CONTACTS?.fire||'101');
    const call=(label,icon,phone,sub)=>{
      const d=digits(phone);
      return `<div class="coco-emergency-card"><div style="min-width:0;flex:1"><b>${icon} ${escapeHtml(label)}</b><small>${escapeHtml(sub||'')}</small><div class="coco-emergency-number">${phone?escapeHtml(phone):'CONTACT NUMBER NOT AVAILABLE'}</div></div>${d?`<a class="coco-sec-call" href="tel:${escapeHtml(d)}">☎ Call</a>`:''}</div>`;
    };

    const guardName=dutyGuard ? (personName(dutyGuard)||'Security Guard') : 'Security Guard';
    const wmName=wm ? (personName(wm)||'Workshop Manager') : 'Workshop Manager';
    list.innerHTML=
      call('Security Guard','🛡️',dutyPhone,dutyGuard ? `${guardName}${openAttendanceFor(dutyGuard)?' · ON DUTY':' · CONTACT'}` : 'No Security Guard registered')+
      call('Workshop Manager','👷',wmPhone,wm ? wmName : 'No Workshop Manager registered')+
      call('Nearest Hospital','🏥',hospitalPhone,'Add hospital contact number in emergency settings')+
      call('Fire Station','🚒',firePhone,'Emergency fire number');
  };

  window.cocoOpenSecurityCallPanel = function(){
    let p=document.getElementById('cocoSecurityCallPanel');
    if(!p){
      p=document.createElement('div');
      p.id='cocoSecurityCallPanel';
      p.innerHTML=`<div class="coco-sec-overlay"></div>
        <aside class="coco-sec-drawer">
          <div class="coco-sec-head">
            <b>🚨 Emergency Security Call</b>
            <button type="button" id="cocoSecClose" aria-label="Close">×</button>
          </div>
          <div class="coco-sec-sub">Emergency contacts — one duty security guard, hospital, fire station and Workshop Manager</div>
          <div id="cocoSecList"></div>
        </aside>`;
      document.body.appendChild(p);
      p.querySelector('.coco-sec-overlay').addEventListener('click',()=>p.classList.remove('open'));
      p.querySelector('#cocoSecClose').addEventListener('click',()=>p.classList.remove('open'));
    }
    window.cocoRefreshSecurityCallPanel();
    p.classList.add('open');
  };

  function injectSecurityDutyControls(){
    const user=currentUser;
    if(!user) return;

    const guards=getSecurityGuards();
    if(!guards.length) return;

    /* Only a logged-in Security Guard gets IN/OUT controls.
       Everyone else only gets the emergency call button. */
    if(String(user.role||'')!=='Security Guard') return;

    const myGuard=guards.find(g=>guardId(g)===String(user.id) || String(g.name||'')===String(user.name||''));
    if(!myGuard) return;

    if(document.getElementById('cocoMySecurityDuty')){
      updateDutyControlState(myGuard);
      return;
    }

    const host=document.getElementById('identityBar') || document.querySelector('.wrap');
    if(!host) return;

    const box=document.createElement('div');
    box.id='cocoMySecurityDuty';
    box.style.cssText='margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap';
    box.innerHTML=`
      <div><b>Security Duty</b><div id="cocoDutyStatus" style="font-size:11px;color:var(--muted)">Checking duty status…</div></div>
      <div style="display:flex;gap:7px">
        <button type="button" class="btn btn-primary" id="cocoDutyIn">🟢 DUTY IN</button>
        <button type="button" class="btn-ghost" id="cocoDutyOut">🔴 DUTY OUT</button>
      </div>`;
    host.parentNode.insertBefore(box, host.nextSibling);

    box.querySelector('#cocoDutyIn').addEventListener('click',async()=>{
      await window.cocoSetSecurityDuty(myGuard,'IN');
    });
    box.querySelector('#cocoDutyOut').addEventListener('click',async()=>{
      await window.cocoSetSecurityDuty(myGuard,'OUT');
    });
    updateDutyControlState(myGuard);
  }

  function updateDutyControlState(guard){
    const d=ensureDutyStore()[guardId(guard)]||{};
    const status=document.getElementById('cocoDutyStatus');
    const inBtn=document.getElementById('cocoDutyIn');
    const outBtn=document.getElementById('cocoDutyOut');
    const on=d.status==='ON DUTY' && d.lastAction==='IN';
    if(status) status.textContent=on ? '🟢 ON DUTY' : '⚪ OFF DUTY';
    if(inBtn) inBtn.disabled=on;
    if(outBtn) outBtn.disabled=!on;
  }

  function ensureEmergencyButton(){
    if(!document.body || document.body.classList.contains('clean-login-active')) return;
    if(document.getElementById('cocoEmergencySecurityBtn')) return;

    const b=document.createElement('button');
    b.id='cocoEmergencySecurityBtn';
    b.type='button';
    b.title='Emergency Security Guard Call';
    b.setAttribute('aria-label','Emergency Security Guard Call');
    b.textContent='🛡️';
    b.addEventListener('click',window.cocoOpenSecurityCallPanel);
    document.body.appendChild(b);
  }

  function boot(){
    ensureEmergencyButton();
    injectSecurityDutyControls();
  }

  document.addEventListener('DOMContentLoaded',boot);
  const oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(){
      const r=oldRender.apply(this,arguments);
      setTimeout(boot,0);
      return r;
    };
  }
  setInterval(()=>{
    if(currentUser){
      ensureEmergencyButton();
      injectSecurityDutyControls();
      if(document.getElementById('cocoSecurityCallPanel')?.classList.contains('open')){
        window.cocoRefreshSecurityCallPanel();
      }
    }
  },1000);
})();
</script>

  document.querySelectorAll('[data-msv-fuel]').forEach(btn=>btn.addEventListener('click',async()=>{const t=DATA.msvTrips.find(x=>x.id===btn.dataset.msvFuel);if(!t||!t.securityOutAt)return;const amount=prompt('Enter fuel amount ₹','');if(amount===null||amount.trim()===''||!Number.isFinite(Number(amount))||Number(amount)<=0){toast('Enter valid fuel amount');return;}const rate=98.38;const amountValue=Number(amount);const qty=amountValue/rate;const confirmation=window.confirm('Fuel Amount: ₹'+amountValue.toFixed(2)+'\nRate: ₹'+rate.toFixed(2)+'/L\nCalculated Fuel Quantity: '+qty.toFixed(2)+' L\n\nConfirm fuel entry?');if(!confirmation)return;if(!Array.isArray(t.fuelEntries))t.fuelEntries=[];t.fuelEntries.push({amount:amountValue.toFixed(2),qty:qty.toFixed(2),fuelQty:qty.toFixed(2),rate:rate.toFixed(2),at:nowISO(),addedBy:whoTag()});await saveData();toast('Fuel saved: '+qty.toFixed(2)+' L');render();}));
  document.querySelectorAll('[data-msv-stop-location]').forEach(btn=>btn.addEventListener('click',async()=>{const t=DATA.msvTrips.find(x=>x.id===btn.dataset.msvStopLocation);if(!t)return;const km=prompt('Current KM at destination',String(t.currentKm??t.startKm??''));if(km===null||km.trim()===''||!Number.isFinite(Number(km))||Number(km)<Number(t.startKm||0)){toast('Enter valid current KM');return;}const location=prompt('Destination / location name','');if(location===null||!location.trim()){toast('Enter location');return;}const purpose=prompt('Purpose of visit','');if(purpose===null||!purpose.trim()){toast('Enter purpose');return;}if(!Array.isArray(t.locations))t.locations=[];t.locations.push({km:String(km),location:location.trim(),purpose:purpose.trim(),stoppedAt:nowISO(),stoppedBy:whoTag()});t.currentKm=String(km);t.status='AT_LOCATION';await saveData();toast('MSV stopped at location');render();}));
  document.querySelectorAll('[data-msv-resume]').forEach(btn=>btn.addEventListener('click',async()=>{const t=DATA.msvTrips.find(x=>x.id===btn.dataset.msvResume);if(!t)return;t.status='RESUMED';t.resumedAt=nowISO();t.resumedBy=whoTag();await saveData();toast('MSV trip resumed');render();}));
  document.querySelectorAll('[data-msv-in]').forEach(btn=>btn.addEventListener('click',async()=>{const t=DATA.msvTrips.find(x=>x.id===btn.dataset.msvIn);if(!t)return;const base=Number(t.currentKm||t.startKm||0);const km=prompt('MSV IN KM at COCO',String(t.returnKm??base));if(km===null||km.trim()===''||!Number.isFinite(Number(km))||Number(km)<base){toast('Enter valid IN KM. It cannot be below the last trip KM '+base);return;}t.returnKm=String(km);t.securityInAt=nowISO();t.inMsvAt=t.securityInAt;t.securityInBy=whoTag();t.status='IN_MSV';await saveData();toast('MSV IN recorded by Security');render();}));
  document.querySelectorAll('[data-msv-end]').forEach(btn=>btn.addEventListener('click',async()=>{const t=DATA.msvTrips.find(x=>x.id===btn.dataset.msvEnd);if(!t)return;const securityKm=t.returnKm??t.endKm??t.startKm??'';let km=prompt('Security entered MSV IN KM: '+securityKm+'\n\nVerify or edit final MSV KM before ending the trip:',String(securityKm));if(km===null||km.trim()===''||!Number.isFinite(Number(km))||Number(km)<Number(t.startKm||0)){toast('Enter valid final KM. It cannot be below starting KM.');return;}const verified=window.confirm('Final MSV KM: '+Number(km).toFixed(2)+'\n\nHave you verified the KM entered by Security?');if(!verified)return;t.endKm=String(Number(km));t.returnKm=String(Number(km));t.endAt=nowISO();t.endedBy=whoTag();t.driverKmVerifiedAt=nowISO();t.driverKmVerifiedBy=whoTag();t.status='ENDED';await saveData();toast('MSV KM verified and trip ended');render();}));
  const repairForm=document.getElementById('msvRepairForm');
  if(repairForm) repairForm.addEventListener('submit',async e=>{e.preventDefault();ensureMsvModuleData();DATA.msvRepairs.push({id:uid(),vehicleNo:document.getElementById('msv_repair_vehicle').value.trim(),issue:document.getElementById('msv_repair_issue').value.trim(),action:document.getElementById('msv_repair_action').value.trim(),status:'SUBMITTED',createdAt:nowISO(),createdBy:whoTag(),createdById:currentUser?.id||''});await saveData();toast('MSV repair submitted to WM');render();});

  const toolForm=document.getElementById('msvToolMasterForm');
  if(toolForm) toolForm.addEventListener('submit',async e=>{e.preventDefault();ensureMsvModuleData();DATA.msvToolMaster.push({id:uid(),name:document.getElementById('msv_tool_name').value.trim(),qty:Number(document.getElementById('msv_tool_qty').value)||0,createdAt:nowISO(),createdBy:whoTag()});await saveData();toast('Tool added to master');render();});

// Direct MSV START action. Uses an inline button action so it remains reliable after every render.
window.cocoMsvStart=async function(tripId){
  try{
    ensureMsvModuleData();
    let t=(DATA.msvTrips||[]).find(x=>String(x.id)===String(tripId));
    { const bz=msvActiveBd(t?t.driverId:currentUser?.id,t?t.driverName:currentUser?.name); if(bz){ toast('Complete breakdown '+bz.label+' first, then start a local trip'); return; } }

    // Single MSV: the driver can create and start a local-market trip directly.
    if(!t && currentUser?.role==='MSV Driver' && !tripId){
      const active=(DATA.msvTrips||[]).find(x=>String(x.driverId||'')===String(currentUser.id||'')&&!['ENDED'].includes(String(x.status||'')));
      if(active){ toast('An MSV trip is already active.'); render(); return; }
      const base=Number(msvTripLastKm(currentUser.id));
      const safeBase=Number.isFinite(base)&&base>0?base:100;
      const answer=window.prompt('Starting KM from COCO',String(safeBase));
      if(answer===null)return;
      const raw=String(answer).trim();
      const value=Number(raw);
      if(!raw || !Number.isFinite(value) || value<safeBase){toast('Enter valid KM. It cannot be below last end KM '+safeBase);return;}
      t={
        id:uid(),
        vehicleNo:'SINGLE MSV',
        driverId:currentUser.id||'',
        driverName:currentUser.name||'',
        purpose:'',
        startKm:String(value),
        startAt:nowISO(),
        startedBy:whoTag(),
        status:'STARTED',
        createdAt:nowISO(),
        createdBy:whoTag(),
        locations:[],
        fuelEntries:[]
      };
      DATA.msvTrips.push(t);
      await saveData();
      toast('MSV START recorded. Waiting for Security MSV OUT.');
      render();
      return;
    }

    if(!t){toast('MSV trip record not found');return;}
    if(t.status && t.status!=='ASSIGNED'){toast('This MSV trip is already '+t.status);return;}
      { const bz=msvActiveBd(t.driverId,t.driverName); if(bz){ toast('Complete breakdown '+bz.label+' first, then start a local trip'); return; } }
    const base=Number(msvTripLastKm(t.driverId));
    const safeBase=Number.isFinite(base)&&base>0?base:100;
    const answer=window.prompt('Starting KM from COCO',String(t.startKm??safeBase));
    if(answer===null)return;
    const raw=String(answer).trim();
    const value=Number(raw);
    if(!raw || !Number.isFinite(value) || value<safeBase){toast('Enter valid KM. It cannot be below last end KM '+safeBase);return;}
    t.startKm=String(value);
    t.startAt=nowISO();
    t.startedBy=whoTag();
    t.status='STARTED';
    await saveData();
    toast('MSV START recorded. Waiting for Security MSV OUT.');
    render();
  }catch(e){console.error(e);toast('MSV START failed: '+(e?.message||'Please try again'));}
};

// Single reliable delegated handler for MSV trip START buttons.
if(!window.__cocoMsvStartDelegated){
  window.__cocoMsvStartDelegated=true;
  document.addEventListener('click',async function(ev){
    const btn=ev.target && ev.target.closest ? ev.target.closest('button[data-msv-start]') : null;
    if(!btn || btn.disabled || btn.dataset.msvStartBusy==='1') return;
    ev.preventDefault();
    ev.stopImmediatePropagation();
    btn.dataset.msvStartBusy='1';
    try{
      if(typeof DATA==='undefined' || !Array.isArray(DATA.msvTrips)) throw new Error('MSV trip data is not available');
      const t=DATA.msvTrips.find(x=>String(x.id)===String(btn.getAttribute('data-msv-start')));
      if(!t){toast('MSV trip record not found');return;}
      if(t.status && t.status!=='ASSIGNED'){toast('This MSV trip is already '+t.status);return;}
      { const bz=msvActiveBd(t.driverId,t.driverName); if(bz){ toast('Complete breakdown '+bz.label+' first, then start a local trip'); return; } }
      const base=typeof msvTripLastKm==='function'?Number(msvTripLastKm(t.driverId))||0:0;
      const safeBase=Number.isFinite(base)&&base>0?base:100;
      const answer=window.prompt('Starting KM from COCO',String(t.startKm??safeBase));
      if(answer===null)return;
      const value=Number(String(answer).trim());
      if(String(answer).trim()==='' || !Number.isFinite(value) || value<safeBase){toast('Enter valid KM. It cannot be below last end KM '+safeBase);return;}
      t.startKm=String(value);
      t.startAt=typeof nowISO==='function'?nowISO():new Date().toISOString();
      t.startedBy=typeof whoTag==='function'?whoTag():'';
      t.status='STARTED';
      if(typeof saveData==='function') await saveData();
      toast('MSV START recorded');
      if(typeof render==='function') render();
    }catch(err){
      console.error('MSV START failed:',err);
      toast('MSV START failed. Please try again.');
    }finally{
      setTimeout(()=>{delete btn.dataset.msvStartBusy;},300);
    }
  },true);
}
</script>
