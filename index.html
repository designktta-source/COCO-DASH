<script>
/* External libraries are loaded lazily so an Android content:// page can never
   freeze the entire application while a CDN request is pending. */
function loadExternalScript(src, globalName, timeoutMs=10000){
  if(window[globalName]) return Promise.resolve(window[globalName]);
  if(window.__cocoScriptPromises?.[globalName]) return window.__cocoScriptPromises[globalName];
  window.__cocoScriptPromises=window.__cocoScriptPromises||{};
  window.__cocoScriptPromises[globalName]=new Promise((resolve,reject)=>{
    const script=document.createElement('script'); script.src=src; script.async=true;
    let done=false;
    const finish=(err)=>{if(done)return;done=true;clearTimeout(timer);script.onload=null;script.onerror=null;err?reject(err):resolve(window[globalName]);};
    const timer=setTimeout(()=>finish(new Error('Required library failed to load')),timeoutMs);
    script.onload=()=>window[globalName]?finish():finish(new Error('Required library loaded incorrectly'));
    script.onerror=()=>finish(new Error('Could not load required library'));
    document.head.appendChild(script);
  }).catch(err=>{delete window.__cocoScriptPromises[globalName];throw err;});
  return window.__cocoScriptPromises[globalName];
}

/*
 * COCO FLOW Android/content:// connection fix.
 * Do not make the whole application depend on the Supabase CDN.  Android
 * WebView/Chrome can block or indefinitely delay dynamic CDN scripts when an
 * HTML file is opened as content://.  COCO FLOW only needs a small subset of
 * the Supabase client, so provide a REST client locally and use it directly.
 */
(function installLocalSupabaseRestClient(){
  if(window.supabase?.createClient) return;
  function timeoutFetch(url, options, ms=15000){
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),ms);
    return fetch(url,Object.assign({},options,{signal:ctrl.signal})).finally(()=>clearTimeout(timer));
  }
  function makeQuery(baseUrl,key,session,table,operation,payload){
    let filters=[];
    let select='*'; let limit=null;
    const builder={
      select(cols='*'){select=cols; return builder;},
      eq(col,val){filters.push(`${encodeURIComponent(col)}=eq.${encodeURIComponent(val)}`); return builder;},
      maybeSingle(){return execute(true);},
      single(){return execute(true);},
      then(resolve,reject){return execute(false).then(resolve,reject);}
    };
    async function execute(single){
      const token=session()?.access_token || key;
      const headers={'apikey':key,'Authorization':`Bearer ${token}`,'Content-Type':'application/json','Prefer':operation==='select'?'return=representation':'return=representation'};
      let url=`${baseUrl}/rest/v1/${encodeURIComponent(table)}`;
      if(operation==='select'){
        url+=`?select=${encodeURIComponent(select)}`+(filters.length?'&'+filters.join('&'):'');
        const r=await timeoutFetch(url,{headers},15000); const text=await r.text();
        let data=null; try{data=text?JSON.parse(text):null;}catch{}
        if(!r.ok) return {data:null,error:{message:data?.message||text||`HTTP ${r.status}`,status:r.status}};
        if(single) return {data:Array.isArray(data)?(data[0]||null):data,error:null};
        return {data,error:null};
      }
      if(operation==='insert'){
        const r=await timeoutFetch(url,{method:'POST',headers,body:JSON.stringify(payload)},{ });
      }
    }
    return builder;
  }
  function clientFactory(url,key){
    const base=String(url||'').replace(/\/$/,'');
    const session=()=>{try{return JSON.parse(localStorage.getItem('coco-flow-supabase-session')||'null')}catch{return null}};
    const saveSession=(x)=>{try{localStorage.setItem('coco-flow-supabase-session',JSON.stringify(x||null))}catch{}};
    async function request(table,method,body,filters,select='*',prefer='return=representation'){
      const token=session()?.access_token || key;
      let urlx=`${base}/rest/v1/${encodeURIComponent(table)}`;
      const qs=[`select=${encodeURIComponent(select)}`];
      (filters||[]).forEach(([c,v])=>qs.push(`${encodeURIComponent(c)}=eq.${encodeURIComponent(v)}`));
      urlx+='?'+qs.join('&');
      const r=await timeoutFetch(urlx,{method,headers:{'apikey':key,'Authorization':`Bearer ${token}`,'Content-Type':'application/json','Prefer':prefer},body:body===undefined?undefined:JSON.stringify(body)},15000);
      const text=await r.text(); let data=null; try{data=text?JSON.parse(text):null}catch{}
      if(!r.ok) return {data:null,error:{message:data?.message||text||`HTTP ${r.status}`,status:r.status}};
      return {data,error:null};
    }
    const from=(table)=>{
      let filters=[];
      const q={
        select(cols='*'){q._select=cols;return q;},
        eq(c,v){filters.push([c,v]);return q;},
        maybeSingle(){return request(table,'GET',undefined,filters,q._select||'*').then(x=>({data:Array.isArray(x.data)?(x.data[0]||null):x.data,error:x.error}));},
        single(){return request(table,q._method||'GET',q._body,filters,q._select||'*',q._prefer||'return=representation').then(x=>({data:Array.isArray(x.data)?(x.data[0]||null):x.data,error:x.error}));},
        insert(body){q._method='POST';q._body=body;q._prefer='return=representation';return q;},
        update(body){q._method='PATCH';q._body=body;q._prefer='return=representation';return q;},
        upsert(body,opts={}){q._method='POST';q._body=body;q._prefer=`resolution=merge-duplicates,return=representation`;return q;}
      };
      return q;
    };
    const auth={
      async getSession(){
        const s=session();
        if(!s) return {data:{session:null},error:null};
        if(s.expires_at && Date.now()/1000 >= Number(s.expires_at)-30){saveSession(null);return {data:{session:null},error:null};}
        return {data:{session:s},error:null};
      },
      async signInWithPassword({email,password}){
        try{
          const r=await timeoutFetch(`${base}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({email,password})},15000);
          const text=await r.text(); let data=null; try{data=text?JSON.parse(text):null}catch{}
          if(!r.ok) return {data:null,error:{message:data?.error_description||data?.msg||data?.message||text||`Login failed (${r.status})`,status:r.status}};
          const sessionData=Object.assign({},data,{expires_at:data?.expires_at || (data?.expires_in?Math.floor(Date.now()/1000)+Number(data.expires_in):0)});
          saveSession(sessionData); return {data:{session:sessionData},error:null};
        }catch(e){return {data:null,error:{message:e?.name==='AbortError'?'Supabase connection timed out':(e?.message||'Supabase connection failed')}};}
      }
    };
    return {from,auth,channel:()=>({on(){return this},subscribe(){return this}})};
  }
  window.supabase={createClient:clientFactory};
})();
async function ensureSupabaseLibrary(){ return window.supabase; }
async function ensureXlsxLibrary(){return loadExternalScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','XLSX',10000);}
</script>
<script>
document.addEventListener('input',ev=>{
  if(ev.target?.id==='bd_coords'){
    const value=ev.target.value.trim();
    const p=parseLatLng(value);
    clearTimeout(window.__bdGeoTimer);
    clearTimeout(window.__cocoKmTimer);
    if(p){
      window.__bdGeoTimer=setTimeout(()=>fetchBreakdownGeo(p),500);
      window.__cocoKmTimer=setTimeout(()=>fetchCocoRoadKm(p.lat,p.lon),700);
    }else if(isTrackingLink(value)){
      window.__bdGeoTimer=setTimeout(()=>fetchBreakdownGeoFromTrackingLink(value),650);
    }
  }
});
document.addEventListener('change',ev=>{
  if(ev.target?.id==='bd_coords'){
    const value=ev.target.value.trim();
    const p=parseLatLng(value);
    if(p){ fetchBreakdownGeo(p); fetchCocoRoadKm(p.lat,p.lon); }
    else if(isTrackingLink(value)){ fetchBreakdownGeoFromTrackingLink(value); }
  }
});
</script>

function can(action){ return !!currentUser && (currentUser.role==='Workshop Manager' || (PERMS[currentUser.role] && PERMS[currentUser.role][action])); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function fmtTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ' · ' + d.toLocaleDateString([], {day:'2-digit',month:'short'}); }
function payrollCycleRange(baseDate=new Date()){
  const d=new Date(baseDate);
  let start;
  if(d.getDate()>=26) start=new Date(d.getFullYear(),d.getMonth(),26);
  else start=new Date(d.getFullYear(),d.getMonth()-1,26);
  const end=new Date(start.getFullYear(),start.getMonth()+1,25,23,59,59,999);
  return {start,end};
}
function dateKeyLocal(iso){
  const d=new Date(iso);
  if(!iso || Number.isNaN(d.getTime())) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function staffPunchRecords(staff){
  if(!staff) return [];
  const phone=(staff.phone||'').toString().replace(/\D/g,'');
  return (DATA.employees||[]).filter(e=>{
    if(e.staffId && e.staffId===staff.id) return true;
    if(phone && e.staffPhone && e.staffPhone.toString().replace(/\D/g,'')===phone) return true;
    return e.empName===staff.name;
  });
}
function dailyAttendance(staff,key){
  const recs=staffPunchRecords(staff).filter(e=>dateKeyLocal(e.inTime)===key);
  if(!recs.length) return null;
  const firstIn=recs.reduce((a,e)=>!a || new Date(e.inTime)<new Date(a.inTime)?e:a,null);
  const outs=recs.filter(e=>e.outTime).sort((a,b)=>new Date(a.outTime)-new Date(b.outTime));
  const lastOut=outs.length?outs[outs.length-1].outTime:null;
  return {firstIn:firstIn.inTime,lastOut,minutes:durationTextMinutes(firstIn.inTime,lastOut),open:recs.some(e=>e.status==='IN'&&!e.outTime)};
}
function durationTextMinutes(inTime,outTime){
  if(!inTime) return 0;
  const start=new Date(inTime).getTime();
  const end=outTime ? new Date(outTime).getTime() : Date.now();
  if(!Number.isFinite(start)||!Number.isFinite(end)||end<start) return 0;
  return Math.floor((end-start)/60000);
}
function getCurrentUserStaff(){
  if(!currentUser) return null;
  return (DATA.staff||[]).find(s=>s && (s.id===currentUser.id || s.name===currentUser.name || (s.phone&&currentUser.phone&&String(s.phone).replace(/\D/g,'')===String(currentUser.phone).replace(/\D/g,'')))) || null;
}

    if(!staff || staff.position!=='Security Guard') return;
    const start=new Date(e.inTime).getTime();
    if(Number.isFinite(start) && now-start>=9*60*60*1000){
      e.outTime=new Date(start+9*60*60*1000).toISOString();

function bytesToBase64(bytes){
  let binary=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));
  return btoa(binary);
}
function base64ToBytes(base64){
  const binary=atob(base64); const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}
async function gzipText(text){
  if(!('CompressionStream' in window)) throw new Error('This browser does not support compressed DMS storage. Please use current Chrome or Edge.');
  const cs=new CompressionStream('gzip');
  const writer=cs.writable.getWriter(); writer.write(new TextEncoder().encode(text)); writer.close();
  const ab=await new Response(cs.readable).arrayBuffer();
  return bytesToBase64(new Uint8Array(ab));
}
async function gunzipText(base64){
  if(!base64) return '';
  if(!('DecompressionStream' in window)) throw new Error('This browser does not support compressed DMS data. Please use current Chrome or Edge.');
  const ds=new DecompressionStream('gzip');
  const writer=ds.writable.getWriter(); writer.write(base64ToBytes(base64)); writer.close();
  return await new Response(ds.readable).text();
}
async function hydrateDmsFromPacked(){
  if(!DATA.dmsPacked) return;
  try{ DATA.dmsIndex=JSON.parse(await gunzipText(DATA.dmsPacked)) || {}; }
  catch(e){ console.error('DMS decompression error:',e); DATA.dmsIndex={}; throw new Error('Saved DMS data could not be opened: '+(e.message||'decompression failed')); }
}

}

async function loadData(isRetry=false){
  const attempt=++connectionAttempt;
  const loginErr=document.getElementById('cleanLoginError');
  if(connectionWatchdog) clearTimeout(connectionWatchdog);
  connectionWatchdog=setTimeout(()=>{
    if(attempt!==connectionAttempt || loaded) return;
    loaded=true; storageStatus='error';
    try{ render(); }catch(err){ console.error('Connection error render failed:',err); }
    showConnectionError('Workshop connection timed out. Please check internet and tap RECONNECT.');
  },1000);
  try{
    if(loginErr) loginErr.textContent=isRetry?'Reconnecting to workshop… please wait.':'Connecting to workshop… please wait.';
    // Android content:// pages can keep a network/auth request pending forever.
    await withTimeout(configureCloud(),12000,'Workshop cloud connection timed out. Please check internet and try again.');
    await withTimeout(readRemote(),12000,'Workshop data connection timed out. Please check internet and try again.');
    const session=await withTimeout(supabaseClient.auth.getSession(),6000,'Workshop session check timed out.');
    if(attempt!==connectionAttempt) return;
    const email=session?.data?.session?.user?.email || '';
    if(email) currentUser=null;
    loaded=true; storageStatus='ok';
    if(connectionWatchdog) clearTimeout(connectionWatchdog);
    try{ render(); }catch(err){ console.error('Workshop render error:',err); }
    startRealtime();

    if(attempt!==connectionAttempt) return;
    console.error(e); storageStatus='error'; loaded=true;

    try{ render(); }catch(renderErr){ console.error('Workshop error render failed:',renderErr); }
    showConnectionError((e&&e.message)||'Cloud connection failed.');
    toast('Workshop cloud connection failed');
  }
}

async function saveData(){
  // Always keep a local recovery copy first. This prevents an assignment or
  // work update from disappearing when the Android content:// page temporarily
  // loses its cloud connection. Cloud save is still attempted immediately.
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA)); }catch(e){ console.warn('Local recovery save failed',e); }
  if(!supabaseClient){ storageStatus='error'; toast('Cloud not connected — data saved on this device'); return false; }
  try{
    // DMS can be tens of MB as an Excel file. Never send the expanded index to Supabase.
    // Compress it first and keep only the compact gzip string in the shared row.
    const cloudData=Object.assign({},DATA);
    if(dmsDirty){
      const json=JSON.stringify(DATA.dmsIndex||{});
      cloudData.dmsPacked=await gzipText(json);
    }
    delete cloudData.dmsIndex;
    cloudData.dmsIndex={};
    const payload={id:'main',data:cloudData,updated_at:new Date().toISOString()};

    // UPSERT is safer than UPDATE+single(): it succeeds even if the main row was
    // missing after a migration, and confirms the row that was actually saved.
    // Do not request the saved row back. On Android/content:// and on a
    // Supabase project with INSERT/UPDATE allowed but a restrictive SELECT
    // policy, `upsert(...).select().single()` can report a false save failure
    // even though the write itself is valid.  A minimal upsert only needs the
    // INSERT/UPDATE permission and is the correct write path here.
    const result=await supabaseClient.from('workshop_state')
      .upsert(payload,{onConflict:'id'});
    if(result.error) throw result.error;
    if(dmsDirty){ DATA.dmsPacked=cloudData.dmsPacked; dmsDirty=false; }
    lastRemoteUpdatedAt=payload.updated_at;
    storageStatus='ok';
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA)); }catch(e){}
    return true;
  }catch(e){
    console.error('COCO FLOW saveData error:',e);
    storageStatus='error';
    toast('Save failed — '+(e?.message||'check internet / cloud permissions'));
    return false;
  }
}

}

function dateLabelInput(v){ const t=dateOnlyValue(v); return t?new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'; }
function dateRangesOverlap(aStart,aEnd,bStart,bEnd){ const a=dateOnlyValue(aStart), ae=dateOnlyValue(aEnd||aStart), b=dateOnlyValue(bStart), be=dateOnlyValue(bEnd||bStart); return a&&b&&a<=be&&b<=ae; }

function hasWeekOffInRange(st,start,end){ const a=dateOnlyValue(start), b=dateOnlyValue(end||start); if(!a||!b)return false; for(let t=a;t<=b;t+=86400000){ if(isWeekOffForDate(st,t))return true; } return false; }

function getTodayStaffStatus(staff){
  const raw=`${staff.attendanceStatus||''} ${staff.todayStatus||''} ${staff.status||''}`.toLowerCase().replace(/[_-]/g,' ');
  if(raw.includes('leave')) return 'Leave';
  if(raw.includes('break')) return 'On Break';
  const obj=dailyAttendance(staff,dateKeyLocal(nowISO()));
  if(!obj) return 'Absent';
  if(obj.open || obj.minutes>=540) return 'Present';
  return 'Half Day';
}
function attendanceStatusFor(obj,dateObj){
  if(obj){ if(obj.open) return 'IN'; return obj.minutes>=540?'Present':'Below 9h'; }
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(dateObj); d.setHours(0,0,0,0);
  return d>today?'—':'Absent';
}

function parseLatLng(value){
  const m=String(value||'').trim().match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(!m) return null;
  const lat=Number(m[1]),lon=Number(m[2]);
  if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180)return null;
  return {lat,lon};
}
function isTrackingLink(value){
  const v=String(value||'').trim();
  return /^https?:\/\//i.test(v) && /(?:intn\.gl|intugine\.)/i.test(v);
}
function normalizeTrackingUrl(value){
  const v=String(value||'').trim();
  if(!/^https?:\/\//i.test(v)) return '';
  try{ return new URL(v).href; }catch(e){ return ''; }
}
function extractTrackingLatLng(text){
  const raw=String(text||'');
  const candidates=[];
  const add=(lat,lon,score=0)=>{
    lat=Number(lat); lon=Number(lon);
    if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180)return;
    // India-focused candidate preference; still accepts any valid coordinates.
    const india=(lat>=6&&lat<=38&&lon>=68&&lon<=98)?3:0;
    const key=`${lat.toFixed(7)},${lon.toFixed(7)}`;
    if(!candidates.some(x=>x.key===key)) candidates.push({lat,lon,score:score+india,key});
  };
  const patterns=[
    /(?:currentLocation|current_position|currentPosition|vehicleLocation|vehicle_position|vehiclePosition|lastLocation|last_position)[\s\S]{0,500}?(?:latitude|lat)\s*[=:]\s*[\"']?(-?\d+(?:\.\d+)?)[\"']?[\s,;&\]}\)]{0,180}(?:longitude|lng|lon)\s*[=:]\s*[\"']?(-?\d+(?:\.\d+)?)/i,
    /(?:latitude|lat)\s*[=:]\s*[\"']?(-?\d+(?:\.\d+)?)[\"']?[\s,;&\]}\)]{0,120}(?:longitude|lng|lon)\s*[=:]\s*[\"']?(-?\d+(?:\.\d+)?)/gi,
    /[?&#](?:lat|latitude)=(-?\d+(?:\.\d+)?)[^#&\s]*(?:lon|lng|longitude)=(-?\d+(?:\.\d+)?)/gi,
    /(?:lat|latitude)=(-?\d+(?:\.\d+)?)[^#&\s]*(?:lon|lng|longitude)=(-?\d+(?:\.\d+)?)/gi,
    /\b(-?\d{1,2}\.\d{4,})\s*[, ]\s*(-?\d{2,3}\.\d{4,})\b/g
  ];
  patterns.forEach((re,i)=>{
    let m; while((m=re.exec(raw))!==null){ add(m[1],m[2],i===0?20:(i===4?1:5)); if(candidates.length>30)break; }
  });
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0] ? {lat:candidates[0].lat,lon:candidates[0].lon} : null;
}
async function fetchTrackingPageText(url){
  const targets = [
    {url:url, label:'direct'},
    {url:'https://r.jina.ai/http://'+url.replace(/^https?:\/\//i,''), label:'Jina HTTP'},
    {url:'https://r.jina.ai/https://'+url.replace(/^https?:\/\//i,''), label:'Jina HTTPS'},
    {url:'https://api.allorigins.win/raw?url='+encodeURIComponent(url), label:'AllOrigins'}
  ];
  let lastErr=null;
  for(const target of targets){
    try{
      const r=await fetch(target.url,{method:'GET',redirect:'follow',credentials:'omit',cache:'no-store'});
      if(!r.ok) throw new Error(`${target.label} HTTP ${r.status}`);
      const text=await r.text();
      if(text && text.length>100) return {text,source:target.label};
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error('Unable to read tracking page');
}
function extractTrackingData(text){
  const raw=String(text||'');
  const decoded=raw
    .replace(/\\u0026/g,'&').replace(/\\u002f/g,'/').replace(/\\u003d/g,'=')
    .replace(/\\"/g,'"').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  let p=extractTrackingLatLng(decoded);
  if(!p) p=extractTrackingLatLng(raw);
  let vehicle='';
  const vm=decoded.match(/(?:vehicle(?:_?number|No|Number)?|registration(?:_?number|No|Number)?|reg(?:istration)?)["'\s:=,-]{0,30}([A-Z]{2}\d{1,2}[A-Z]{1,3}\d{3,4})/i);
  if(vm) vehicle=vm[1].toUpperCase();
  const locationCandidates=[];
  const locPatterns=[
    /(?:currentLocation|current_location|locationName|location_name|locality|district|address|city|town|village)["'\s:=,-]{0,20}["']([^"'<>\n]{2,120})["']/gi,
    /(?:location|address)[^\n]{0,80}>\s*([^<]{2,120})</gi
  ];
  locPatterns.forEach(re=>{let m;while((m=re.exec(decoded))!==null){const v=m[1].trim();if(v&&!locationCandidates.includes(v))locationCandidates.push(v);if(locationCandidates.length>20)break;}});
  return {point:p,vehicle,locationCandidates};
}
async function fetchBreakdownGeoFromTrackingLink(link){
  const status=document.getElementById('bdGeoStatus');
  const input=document.getElementById('bd_coords');
  const url=normalizeTrackingUrl(link);
  if(!url){ if(status)status.textContent='Invalid tracking link'; return null; }
  if(input) input.dataset.trackingLink=url;
  if(status)status.textContent='Reading live vehicle location from tracking link...';
  try{
    const result=await fetchTrackingPageText(url);
    const data=extractTrackingData(result.text);
    const p=data.point;
    if(!p) throw new Error('Tracking page did not expose latitude/longitude');
    const latEl=document.getElementById('bd_lat'),lngEl=document.getElementById('bd_lng');
    if(latEl)latEl.value=p.lat;
    if(lngEl)lngEl.value=p.lon;
    if(input) input.dataset.resolvedCoords=`${p.lat}, ${p.lon}`;
    await fetchBreakdownGeo(p);
    await fetchCocoRoadKm(p.lat,p.lon);
    if(status)status.textContent=`Vehicle location fetched (${result.source}): ${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`;
    return p;
  }catch(e){
    if(status)status.textContent='Unable to read live coordinates from this Intugine link. Enter latitude, longitude or connect the Intugine API.';
    return null;
  }
}
async function resolveBreakdownCoordinates(){
  const input=document.getElementById('bd_coords');
  const value=input?.value?.trim()||'';
  const direct=parseLatLng(value);
  if(direct) return direct;
  if(isTrackingLink(value)){
    const resolved=await fetchBreakdownGeoFromTrackingLink(value);
    return resolved;
  }
  const cached=parseLatLng(input?.dataset?.resolvedCoords||'');
  return cached;
}
async function fetchBreakdownGeo(passedPoint=null){
  const p=passedPoint||parseLatLng(document.getElementById('bd_coords')?.value)||parseLatLng(document.getElementById('bd_coords')?.dataset?.resolvedCoords||'');
  const status=document.getElementById('bdGeoStatus');
  if(!p){
    if(status)status.textContent='Enter latitude, longitude or an Intugine tracking link';
    return null;
  }

  const distEl=document.getElementById('bd_dist');
  const locEl=document.getElementById('bd_loc');
  const latEl=document.getElementById('bd_lat');
  const lngEl=document.getElementById('bd_lng');
  if(latEl)latEl.value=p.lat;
  if(lngEl)lngEl.value=p.lon;
  if(status)status.textContent='Fetching exact nearby location...';

  const setFields=(dist,loc,msg)=>{
    if(distEl)distEl.value=dist||'Not found';
    if(locEl)locEl.value=loc||'No named location found within 10 km';
    if(status)status.textContent=msg||'Location fetched';
  };

  // Reverse geocode is used for district/address details, but we do NOT
  // blindly trust its locality name because some geocoders can return a
  // nearby postal locality instead of the actual village.
  let reverse=null;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${p.lat}&lon=${p.lon}&zoom=18&addressdetails=1&accept-language=en`,{
      headers:{'Accept':'application/json'}
    });
    if(r.ok) reverse=await r.json();
  }catch(e){}

  const a=reverse?.address||{};
  const district=a.state_district||a.district||a.county||a.city_district||a.city||a.town||'';

  // Find the nearest actual named settlement/place within 10 km.
  // This deliberately excludes post offices so a postal area cannot replace
  // the real village/locality (e.g. Adgaon being reported as Nipani).
  let nearestPlace=null;
  try{
    const q=`[out:json][timeout:15];(
      nwr(around:10000,${p.lat},${p.lon})["place"~"village|town|city|locality|hamlet|suburb"];
    );out center tags;`;
    const r=await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=UTF-8','Accept':'application/json'},
      body:q
    });
    if(r.ok){
      const d=await r.json();
      const priority={village:1,town:2,city:3,locality:4,hamlet:5,suburb:6};
      nearestPlace=(d.elements||[]).map(x=>{
        const lat=Number(x.lat??x.center?.lat),lon=Number(x.lon??x.center?.lon);
        const name=x.tags?.name||x.tags?.['name:en']||x.tags?.official_name||'';
        const type=x.tags?.place||'';
        return Number.isFinite(lat)&&Number.isFinite(lon)&&name ? {
          name, type, lat, lon, km:haversineKm(p.lat,p.lon,lat,lon)
        } : null;
      }).filter(x=>x&&x.km<=10)
        .sort((x,y)=>x.km-y.km || (priority[x.type]||99)-(priority[y.type]||99))[0]||null;
    }
  }catch(e){}

  // Prefer a real nearby settlement over the generic Nominatim display name.
  if(nearestPlace){
    setFields(
      district,
      nearestPlace.name,
      `${nearestPlace.name} (${nearestPlace.km.toFixed(1)} km from coordinates)`
    );
    return p;
  }

  // Safe fallback: use the locality/village tied to the exact reverse result.
  const safeLocality=a.village||a.town||a.city||a.locality||a.municipality||a.suburb||a.neighbourhood||'';
  setFields(
    district,
    safeLocality,
    safeLocality ? 'Location fetched from coordinates' : 'No named location found within 10 km'
  );
  return p;
}
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
async function getCurrentGPS(){
  // GPS is compulsory for breakdown START/REACH.  The browser Geolocation API
  // requires a secure context (normally HTTPS) and explicit location permission.
  // A local Android content:// page is not a reliable secure web origin, so fail
  // early with a useful diagnostic instead of silently continuing without GPS.
  if(!window.isSecureContext){
    const origin=String(location?.protocol||'unknown');
    throw new Error(`SECURE_CONTEXT_REQUIRED: COCO FLOW must be opened using HTTPS (current: ${origin})`);
  }
  if(!navigator.geolocation){
    throw new Error('GEOLOCATION_API_UNAVAILABLE: This browser/WebView does not expose GPS');
  }
  try{
    if(navigator.permissions?.query){
      const perm=await navigator.permissions.query({name:'geolocation'});
      if(perm.state==='denied'){
        throw new Error('LOCATION_PERMISSION_DENIED: Allow Location for COCO FLOW in browser site settings');
      }
    }
  }catch(e){
    if(String(e?.message||'').startsWith('LOCATION_PERMISSION_DENIED')) throw e;
    // Some WebViews do not implement Permissions API; getCurrentPosition below
    // remains the authoritative permission/location check.
  }
  return await new Promise((resolve,reject)=>{
    let settled=false;
    const fail=e=>{
      if(settled)return; settled=true;
      const code=Number(e?.code);
      let msg='GPS_LOCATION_FAILED';
      if(code===1) msg='LOCATION_PERMISSION_DENIED: Allow Location for COCO FLOW';
      else if(code===2) msg='LOCATION_UNAVAILABLE: Turn ON Android Location/GPS and move to an open area';
      else if(code===3) msg='GPS_TIMEOUT: Location fix timed out. Keep Location ON and retry';
      reject(new Error(msg));
    };
    navigator.geolocation.getCurrentPosition(
      p=>{ if(settled)return; settled=true; resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy}); },
      fail,
      {enableHighAccuracy:true,timeout:30000,maximumAge:0}
    );
  });
}

const NAGPUR_COCO={lat:20.9276689,lon:78.9377647};

async function fetchCocoRoadKm(lat,lon){
  const el=document.getElementById('bd_coco_km');
  if(!el) return null;
  const v=[NAGPUR_COCO.lat,NAGPUR_COCO.lon,Number(lat),Number(lon)];
  if(v.slice(2).some(x=>!Number.isFinite(x))){ el.value=''; return null; }
  el.value='Calculating…';
  try{
    const km=await getApproxRoadDistanceKm(NAGPUR_COCO.lat,NAGPUR_COCO.lon,Number(lat),Number(lon));
    el.value=`${km.toFixed(2)} km`;
    return km;
  }catch(e){
    // If routing is temporarily unavailable, show a straight-line fallback
    // but label it clearly so it is never mistaken for road KM.
    const straight=haversineKm(NAGPUR_COCO.lat,NAGPUR_COCO.lon,Number(lat),Number(lon));
    el.value=`${straight.toFixed(2)} km (air)`;
    return null;
  }
}

async function getApproxRoadDistanceKm(lat1,lon1,lat2,lon2){
  const v=[lat1,lon1,lat2,lon2].map(Number);
  if(v.some(x=>!Number.isFinite(x)))throw new Error('Invalid coordinates');
  const url=`https://router.project-osrm.org/route/v1/driving/${v[1]},${v[0]};${v[3]},${v[2]}?overview=false`;
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok)throw new Error('Routing unavailable');
  const d=await res.json();
  if(d.code!=='Ok'||!d.routes?.length)throw new Error('No route');
  return Number((d.routes[0].distance/1000).toFixed(2));
}

                 placeholder="Enter password">
        </div>
        <div class="row-actions">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
        <div style="margin-top:10px;color:var(--muted);font-size:12px;text-align:center;">
          Default password for a new staff member is the <b>last 6 digits of the mobile number</b>.
          Change it after login.
        </div>
      </form>
      `}
    </div>
  `;

  const form = document.getElementById('loginForm');
  if(!form) return;

  form.addEventListener('submit', async (ev)=>{
    ev.preventDefault();

    const mobile = document.getElementById('login_mobile').value.trim().replace(/\D/g,'');
    const password = document.getElementById('login_password').value;

    if(!mobile){ toast('Enter mobile number'); return; }
    if(!password){ toast('Enter password'); return; }

    const staff = (DATA.staff||[]).find(s => {
      if(!s) return false;
      const role=String(s.position||s.role||'').trim();
      const phone=String(s.phone||s.mobile||s.loginId||'').replace(/\D/g,'');
      return ROLES.includes(role) && phone === mobile;
    });

    if(!staff){
      toast('Mobile number not found');
      return;
    }

    // Existing staff accounts migrate automatically:
    // if no custom password exists, their default password is last 6 digits of mobile.
    const digits = mobile;
    const defaultPassword = digits.length >= 6 ? digits.slice(-6) : digits;
    const expectedPassword = String(staff.password ?? defaultPassword);

    if(String(password) !== expectedPassword){
      toast('Incorrect password');
      return;
    }

    currentUser = {
      id: staff.id,
      name: staff.name,
      role: staff.position,
      phone: staff.phone || staff.mobile || staff.loginId || '',
      loginPhone: mobile
    };

    await saveSession();
    render();
  });
}

function isSecurityStaff(st){
  const text=[st?.role,st?.position,st?.designation,st?.employeeRole,st?.department,st?.employee_type,st?.employeeType,st?.name]

  return /\bsecurity\b|\bguard\b/.test(text);
}

function isVehicleHeld(v){ return !!(v && v.hold === true); }

function fmtDuration(ms){
  ms=Math.max(0,Number(ms)||0);
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function vehicleWorkElapsed(v){
  if(!v) return '00:00:00';
  const now=Date.now();
  let total=0;
  if(Array.isArray(v.workSegments) && v.workSegments.length){
    v.workSegments.forEach(seg=>{
      if(!seg?.start) return;
      const a=new Date(seg.start).getTime();
      const b=seg.end ? new Date(seg.end).getTime() : now;
      if(Number.isFinite(a) && Number.isFinite(b) && b>=a) total += (b-a);
    });
    return fmtDuration(total);
  }
  // Backward compatibility for vehicles created before workSegments existed.
  if(!v.workStartedAt) return '00:00:00';
  const end=v.workDoneAt ? new Date(v.workDoneAt).getTime() : (v.rfdAt ? new Date(v.rfdAt).getTime() : now);
  const start=new Date(v.workStartedAt).getTime();
  return Number.isFinite(start) && Number.isFinite(end) && end>=start ? fmtDuration(end-start) : '00:00:00';
}
function hasActiveWorkSegment(v){
  return !!(v && Array.isArray(v.workSegments) && v.workSegments.some(s=>s && s.start && !s.end));
}
function closeActiveWorkSegment(v, at){
  if(!Array.isArray(v.workSegments)) v.workSegments=[];
  const active=v.workSegments.find(s=>s && s.start && !s.end);
  if(active) active.end=at;
}
function startWorkSegment(v, at){
  if(!Array.isArray(v.workSegments)) v.workSegments=[];
  // Never create a second live segment. If a timer is already running,
  // keep the existing segment instead of allowing START WORK to restart it.
  if(hasActiveWorkSegment(v)) return false;
  v.workSegments.push({start:at,end:null});
  v.workStartedAt=at;
  v.workStartedBy=whoTag();
  v.currentStatus='WIP';
  return true;
}

function recordWorkflowEvent(v, action, at, extra={}){
  if(!v) return;
  if(!Array.isArray(v.workflowHistory)) v.workflowHistory=[];
  v.workflowHistory.push(Object.assign({
    id:uid(), action:String(action||''), at:at||nowISO(), by:whoTag(),
    vehicleStatus:v.currentStatus||'', workElapsed:vehicleWorkElapsed(v)
  }, extra||{}));
  // Keep the embedded audit trail bounded so workshop_state remains compact.
  if(v.workflowHistory.length>200) v.workflowHistory=v.workflowHistory.slice(-200);
}
async function persistWorkflow(v, action, at, extra={}){
  recordWorkflowEvent(v,action,at,extra);
  const saved=await saveData();
  if(!saved){
    toast(`${action} NOT saved to cloud. Please reconnect and retry.`);
    return false;
  }
  return true;
}

}

  return technicianStaffList().filter(s=>!technicianIsBusy(s.id,excludeVehicleId));
}
function vehicleWorkComplete(v){
  const cs=vehicleComplaints(v);
  return cs.length>0 && cs.every(c=>c.status==='RESOLVED');
}

function technicianAndMsvStaffList(){
  return (DATA.staff||[]).filter(s=>s && s.name && (s.position==='Technician' || s.position==='MSV Driver'));
}
function presentTechniciansForVehicle(excludeVehicleId){
  return (DATA.staff||[]).filter(s=>{
    if(!s || !s.name) return false;
    if(!['Technician','MSV Driver'].includes(s.position)) return false;
    return !technicianIsBusy(s.id,excludeVehicleId);
  });
}
function responsibleTechniciansForVehicle(excludeVehicleId){
  return (DATA.staff||[]).filter(s=>s && s.name && s.position==='Technician' && !technicianIsBusy(s.id,excludeVehicleId));
}
function assignedToVehicle(v,userId){
  return !!v && !!userId && (v.responsibleTechnicianId===userId || (Array.isArray(v.supportingTechnicianIds)&&v.supportingTechnicianIds.includes(userId)));
}
function vehicleCanWork(v){
  return !!v && !isVehicleDeleted(v) && !isVehicleHeld(v) && v.status==='IN' && !!v.assignedAt;
}
function vehicleAllComplaintsHaveDecision(v){
  const cs=vehicleComplaints(v);
  return cs.length>0 && cs.every(c=>c.status==='RESOLVED' || (c.status==='PENDING' && !!c.pendingReason));
}
function vehicleWorkDoneAllowed(v){
  const cs=vehicleComplaints(v);
  return cs.length>0 && cs.every(c=>c.status==='RESOLVED' || (c.status==='PENDING' && !!c.pendingReason));
}
function vehicleCanRFD(v){
  return !!v && !!v.workDoneAt && vehicleWorkDoneAllowed(v);
}
function vehicleCanRelease(v){
  return !!v && !!v.rfdAt && !!v.incidentNumber && /^\d{6}$/.test(String(v.incidentNumber));
}

  return `<div class="complaint-list-scroll">${cs.map((c,i)=>{
    const pending=c.status==='PENDING';
    return `<div class="complaint-work-card complaint-row">
      <div class="complaint-full-line"><b>${i+1}. ${escapeHtml(c.text)}</b></div>
      <div class="complaint-status-line">

      </div>
      <div class="vehicle-actions">
        ${(v.currentStatus==='WAITING' && (currentUser.role==='Security Guard'||currentUser.role==='Workshop Manager') && !isVehicleHeld(v))?`<button type="button" class="btn btn-primary" data-gate-in="${v.id}">GATE IN NOW</button>`:''}
        ${(v.status==='IN' && assignedToVehicle(v,currentUser.id) && !isVehicleHeld(v))?`<button type="button" class="btn btn-blue" data-open-job="${v.id}">OPEN VEHICLE</button>`:''}
        ${['Service Advisor','Workshop Manager'].includes(currentUser.role) && v.status==='IN' ? `<button type="button" class="btn btn-blue" data-open-job="${v.id}">MANAGE JOB</button>`:''}
        ${(v.currentStatus==='WAITING FOR OUT' && ['Security Guard','Workshop Manager'].includes(currentUser?.role) && !isVehicleHeld(v))?`<button type="button" class="btn btn-out" data-out="${v.id}">🚪 GATE OUT — NEXT ACTION</button>`:''}
        ${canManageVehicleLock()?`<button type="button" class="btn-ghost" data-vehicle-hold="${v.id}">${isVehicleHeld(v)?'UNHOLD':'HOLD'}</button>`:''}
        ${canDeleteVehicle()?`<button type="button" class="btn-ghost danger-btn" data-vehicle-delete="${v.id}">DELETE</button>`:''}

    </div>`;
  }).join(''):emptyBlock('🚚','No vehicles found.');

  if(activeVehicleEntry)return `<div class="vehicle-entry-page"><div class="vehicle-entry-head"><button type="button" class="btn-ghost" id="vehicleEntryBack">← Back</button><div><h2>VEHICLE REPORT / TICKET</h2><small>Status after submit: WAITING</small></div></div>${formBlock}</div>`;
  return `${['Security Guard','Workshop Manager'].includes(currentUser.role)?`<div class="vehicle-page-quick"><button type="button" class="vehicle-page-entry-btn" id="vehiclePageEntryBtn">🚛 VEHICLE ENTRY</button></div>`:''}

}

function stageBadge(stage){
  const map = {ASSIGNED:'Assigned', STARTED:'Started — En Route', VERIFIED:'Parts &amp; KM Verified', REACHED:'Reached Location', ONROAD:'On Road (Repair)', RETURNED:'Returning to COCO', CLOSED:'Closed'};
  return `<span class="badge stage">${map[stage]||stage}</span>`;
}

function renderBreakdownCard(b){
  let inlineAction = '';

  if(b.stage==='ASSIGNED' && can('breakdownStart')){
    inlineAction = `<div class="inline-action"><b>Start (Gate Departure)</b><div class="row-actions"><button class="btn btn-blue" data-bdstart="${b.id}">Confirm Start</button></div></div>`;
  }
  else if(b.stage==='STARTED' && can('breakdownVerify')){
    inlineAction = `<div class="inline-action"><b>Security: Verify Parts &amp; MSV KM</b>
      <div class="field"><label>MSV KM (Odometer at gate)</label><input id="bd_kmout_${b.id}" type="number" placeholder="MSV KM out"></div>
      <div class="row-actions"><button class="btn btn-blue" data-bdverify="${b.id}">Confirm Parts Verified &amp; KM</button></div></div>`;
  }
  else if(b.stage==='VERIFIED'){
    let extra = '';
    if(can('breakdownFuel')){
      extra += `<div class="inline-action"><b>MSV Driver: Fuel Entry</b>
        <div class="grid"><div class="field"><label>Fuel Qty (Litres)</label><input id="bd_fuelqty_${b.id}" type="number"></div><div class="field"><label>Price</label><input id="bd_fuelprice_${b.id}" type="number"></div></div>
        <div class="row-actions"><button class="btn btn-blue" data-bdfuel="${b.id}">Add Fuel Entry</button></div></div>`;
    }
    if(can('breakdownReach')){
      extra += `<div class="inline-action"><b>MSV Driver: Mark Reached</b>
        <small>When REACH is clicked, current GPS is captured automatically and approximate road KM is calculated from the START location.</small>
        <div class="row-actions"><button class="btn btn-green" data-bdreach="${b.id}">REACH</button></div></div>`;
    }
    inlineAction = extra;
  }
  else if(b.stage==='REACHED' && can('breakdownOnroad')){
    inlineAction = `<div class="inline-action"><b>Technician: Select Consumed Parts</b>
      ${(b.partsCarrying||[]).map((p,i)=>`<div class="field"><label>${escapeHtml(p.name)} (carrying ${escapeHtml(p.qty)})</label><input id="bd_consume_${b.id}_${i}" type="number" placeholder="Qty consumed" value="0"></div>`).join('') || '<p style="color:var(--muted);font-size:12px;">No parts were listed as carrying.</p>'}
      <div class="row-actions"><button class="btn btn-green" data-bdonroad="${b.id}">Confirm Onroad</button></div></div>`;
  }
  else if(b.stage==='ONROAD'){
    let extra = '';
    if(can('breakdownReturnVerify') && !b.returnVerifiedBy){
      extra += `<div class="inline-action"><b>Security: Verify Physical Return of Parts</b><div class="row-actions"><button class="btn btn-blue" data-bdreturnverify="${b.id}">Confirm Parts Returned</button></div></div>`;
    }
    if(can('breakdownPunch') && !b.msvDriverPunchAt){
      extra += `<div class="inline-action"><b>MSV Driver: Punch (End)</b><div class="row-actions"><button class="btn btn-green" data-bdpunch="${b.id}">Punch Out</button></div></div>`;
    }
    inlineAction = extra;
  }

  const consumedList = (b.consumedParts||[]).map(p=>`${escapeHtml(p.name)}: ${escapeHtml(p.qty)}`).join(', ');
  const carryingList = (b.partsCarrying||[]).map(p=>`${escapeHtml(p.name)} × ${escapeHtml(p.qty)}`).join(', ');
  const fuelList = (b.fuelEntries||[]).map(f=>`${escapeHtml(f.qty)}L @ ${escapeHtml(f.price)}`).join('; ');

  return `
  <div class="card ${b.stage==='CLOSED'?'closed':''}">
    <div class="card-top">
      <div>
        <div class="card-title">${escapeHtml(b.vehicleNo)} ${stageBadge(b.stage)}</div>
        <div class="card-meta">
          Driver: ${escapeHtml(b.driverName)} ${b.mobileNo?('· '+phoneLink(b.mobileNo)):''} · KM: ${escapeHtml(b.km)}<br>
          Location: ${escapeHtml(b.vehicleLocation)}, ${escapeHtml(b.district)}<br>
          Complaint: ${escapeHtml(b.complaint)}<br>
          Technician: ${escapeHtml(b.assignedTechnician)} · MSV Driver: ${escapeHtml(b.assignedMsvDriver)}<br>
          ${carryingList?('Parts Carrying: '+carryingList+'<br>'):''}
          ${b.msvKmOut?('MSV KM Out: '+escapeHtml(b.msvKmOut)+' · Verified by '+escapeHtml(b.verifiedBy||'')+'<br>'):''}
          ${fuelList?('Fuel: '+fuelList+'<br>'):''}
          ${b.kmFromCOCO?('KM from COCO: '+escapeHtml(b.kmFromCOCO)+' · Reached: '+escapeHtml(b.reachedLocation||'')+'<br>'):''}
          ${consumedList?('Consumed Parts: '+consumedList+'<br>'):''}
          ${b.returnVerifiedBy?('Return verified by '+escapeHtml(b.returnVerifiedBy)+'<br>'):''}
          ${b.msvDriverPunchAt?('MSV punched out at '+fmtTime(b.msvDriverPunchAt)+'<br>'):''}
          Assigned: <span class="stamp-time">${fmtTime(b.createdAt)}</span> by ${escapeHtml(b.createdBy||'')}
        </div>
      </div>
    </div>
    ${inlineAction}
  </div>`;
}

/* ---------------- EMPLOYEES ---------------- */
function content_employees(){
  const isSecurity=currentUser && currentUser.role==='Security Guard';
  const isWM=currentUser && currentUser.role==='Workshop Manager';
  const staffList=regularStaffList().filter(s=>ROLES.includes(s.position)).sort((a,b)=>a.name.localeCompare(b.name));

  const recordsFor=staff=>(DATA.employees||[]).filter(e=>{
    if(e.staffId && e.staffId===staff.id) return true;
    const p=(staff.phone||'').toString().replace(/\D/g,'');
    if(p && e.staffPhone && e.staffPhone.toString().replace(/\D/g,'')===p) return true;
    return e.empName===staff.name;
  }).sort((a,b)=>new Date(b.inTime)-new Date(a.inTime));

  if(isSecurity && employeePunchStaffId){
    const staff=staffList.find(s=>s.id===employeePunchStaffId);
    if(!staff){ employeePunchStaffId=null; return content_employees(); }
    const records=recordsFor(staff);
    const open=records.find(e=>e.status==='IN'&&!e.outTime);
    const today=dailyAttendance(staff,dateKeyLocal(nowISO()));
    const action=open?'OUT':'IN';
    const mins=today?today.minutes:0;
    const total=today?durationText(today.firstIn,today.lastOut):'0h 0m';
    const attendance=today&&today.open?'IN':(today&&mins>=540?'Present':(today?'Below 9h':'Not Punched'));
    return `
      <div class="panel attendance-detail-clean">
        <div class="detail-back"><button class="btn-ghost" id="employeeBack">← Employee List</button></div>
        <div class="attendance-profile">
          <div class="attendance-avatar">${escapeHtml((staff.name||'E').trim().charAt(0).toUpperCase())}</div>
          <div class="attendance-profile-main"><h2>${escapeHtml(staff.name)}</h2><div class="card-meta">${escapeHtml(staff.position)} · ${escapeHtml(staff.phone||'No phone')}</div></div>
          <span class="attendance-status ${attendance==='IN'||attendance==='Present'?'good':attendance==='Below 9h'?'warn':'muted'}">${attendance}</span>
        </div>
        <div class="attendance-summary-grid">
          <div><small>FIRST IN</small><b>${today?fmtTime(today.firstIn):'—'}</b></div>
          <div><small>TOTAL TODAY</small><b>${total}</b></div>
          <div><small>REQUIRED</small><b>9h</b></div>
        </div>
        <div class="attendance-action-row">
          <button class="attendance-punch ${action==='IN'?'punch-in':'punch-out'}" data-staff-id="${escapeHtml(staff.id)}" data-punch-action="${action}">${action==='IN'?'🟢 MARK IN':'🔴 MARK OUT'}</button>
          ${today?`<button class="btn-ghost edit-clock-btn" data-staff-attendance="${escapeHtml(staff.id)}">🕒 Edit Time</button>`:''}
        </div>
        <div class="notice">Security Guard and Workshop Manager can record employee attendance. Time editing remains restricted by role rules.</div>
      </div>`;
  }

  const visibleStaffList=DASHBOARD_LIST_FILTER==='employeeIn'
    ? staffList.filter(staff=>recordsFor(staff).some(e=>e.status==='IN'&&!e.outTime))
    : staffList;

  const rows=visibleStaffList.map(staff=>{
    const records=recordsFor(staff);
    const open=records.find(e=>e.status==='IN'&&!e.outTime);
    const today=dailyAttendance(staff,dateKeyLocal(nowISO()));
    const mins=today?today.minutes:0;
    const total=today?durationText(today.firstIn,today.lastOut):'0h 0m';
    const attendance=today&&today.open?'IN':(today&&mins>=540?'Present':(today?'Below 9h':'Not Punched'));
    const cls=attendance==='IN'?'in':attendance==='Present'?'present':attendance==='Below 9h'?'below':'not';
    const initial=escapeHtml((staff.name||'E').trim().charAt(0).toUpperCase());
    const action=(isSecurity||isWM)&&(can('employee')||isWM)?(open?'OUT':'IN'):'';
    return `<div class="attendance-row">
      <div class="attendance-person">
        <div class="attendance-avatar small">${initial}</div>
        <div class="attendance-person-info"><b>${escapeHtml(staff.name)}</b><span>${escapeHtml(staff.position)}</span></div>
      </div>
      <div class="attendance-time"><b>${total}</b><small>${today&&today.firstIn?'IN '+fmtTime(today.firstIn):'No punch today'}</small></div>
      <span class="attendance-status ${cls}">${attendance}</span>
      <div class="attendance-row-actions">
        ${(isSecurity||isWM)&&action?`<button type="button" class="attendance-punch ${action==='IN'?'punch-in':'punch-out'}" data-staff-id="${escapeHtml(staff.id)}" data-punch-action="${action}">${action==='IN'?'🟢 IN':'🔴 OUT'}</button>`:''}${isSecurity?`<button type="button" class="attendance-open" data-select-employee="${escapeHtml(staff.id)}">OPEN</button>`:''}
        ${isWM&&can('employee')?`<button type="button" class="attendance-open" data-select-employee="${escapeHtml(staff.id)}">DETAIL</button>`:''}
      </div>
    </div>`;
  }).join('');

  const present=staffList.filter(st=>{const d=dailyAttendance(st,dateKeyLocal(nowISO()));return d&&(d.open||d.minutes>=540);}).length;
  const inNow=staffList.filter(st=>recordsFor(st).some(e=>e.status==='IN'&&!e.outTime)).length;
  const notPunched=staffList.filter(st=>!dailyAttendance(st,dateKeyLocal(nowISO()))).length;

  const header=`<div class="panel attendance-panel-clean">
    <div class="attendance-head-clean">
      <div><h2>Employee Attendance${DASHBOARD_LIST_FILTER==='employeeIn'?' — CURRENTLY IN':''}</h2><div class="card-meta">Regular employees only · Security guards are managed separately.</div></div>
      <div class="attendance-head-date">${dateLabelInput(localDateInput())}</div>
    </div>
    <div class="attendance-kpis">
      <div><b>${visibleStaffList.length}</b><span>${DASHBOARD_LIST_FILTER==='employeeIn'?'Employees IN':'Employees'}</span></div>
      <div><b>${inNow}</b><span>Currently IN</span></div>
      <div><b>${present}</b><span>Present ≥ 9h</span></div>
      <div><b>${notPunched}</b><span>Not Punched</span></div>
    </div>
    <div class="attendance-toolbar">
      <input id="attendanceSearch" class="attendance-search" type="search" placeholder="Search employee name or role…" autocomplete="off">
      <select id="attendanceFilter" class="attendance-filter"><option value="ALL">All</option><option value="IN">Currently IN</option><option value="PRESENT">Present</option><option value="NOT">Not Punched</option></select>
    </div>
    <div class="attendance-list-head"><span>EMPLOYEE</span><span>TODAY</span><span>STATUS</span><span>ACTION</span></div>
    <div id="attendanceRows" class="attendance-list">${rows||emptyBlock('👷','No regular employees added yet.')}</div>
  </div>`;

  const log=(isSecurity||isWM)?`<div class="panel attendance-log-clean"><div class="attendance-head-clean"><div><h2>Today's Attendance Log</h2><div class="card-meta">Latest punches for regular employees</div></div></div>${(DATA.employees||[]).filter(e=>{const st=staffList.find(s=>s.id===e.staffId||s.name===e.empName);return st&&(isToday(e.inTime)||(e.outTime&&isToday(e.outTime)));}).sort((a,b)=>new Date(b.inTime)-new Date(a.inTime)).map(e=>`
    <div class="attendance-log-row">

function dmsNorm(s){ return String(s??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,''); }

function dmsFind(row, aliases){

  for(const k of keys){ const nk=dmsNorm(k); if(wanted.includes(nk)) return row[k]; }
  for(const k of keys){ const nk=dmsNorm(k); if(wanted.some(a=>nk.includes(a)||a.includes(nk))) return row[k]; }
  return '';
}
function dmsVehicleNo(row){ return dmsVehicleClean(dmsFind(row,['VEHICLE NO','Vehicle Registration No','Vehicle Reg No','Registration No','Vehicle No','Reg No','VEHICLE','Vehicle'])); }

  return {vehicle,invoiceDate,soDate,km,location,type,partNo,partDesc,qty,dealType,so,incident,itemType,materialNo};

function dmsNum(v){
  const n=Number(String(v??'').replace(/,/g,'').trim());
  return Number.isFinite(n)?n:null;
}
function dmsDateValue(v){
  const raw=String(v??'').trim(); if(!raw) return 0;
  // Parse DD/MM/YYYY explicitly before Date.parse to avoid browser locale ambiguity.
  let m=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if(m){ let y=Number(m[3]); if(y<100)y+=2000; const d=new Date(y,Number(m[2])-1,Number(m[1])); return Number.isNaN(d.getTime())?0:d.getTime(); }
  m=raw.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
  if(m){ const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3])); return Number.isNaN(d.getTime())?0:d.getTime(); }
  m=raw.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);
  if(m){ const d=new Date(Number(m[1]),Number(m[2]),Number(m[3])); return Number.isNaN(d.getTime())?0:d.getTime(); }
  const t=Date.parse(raw); return Number.isNaN(t)?0:t;
}
function dmsFmtDate(v){
  const t=dmsDateValue(v); if(!t) return String(v||'—');
  return new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function dmsFmtKm(v){ const n=dmsNum(v); return n===null?'—':Math.round(n).toLocaleString('en-IN'); }
function dmsStatusClass(status){ const s=String(status||'').toUpperCase(); return s.includes('OVER')?'overdue':s==='DUE'?'due':s==='PENDING'?'pending':'normal'; }
function dmsEsc(v){ return escapeHtml(v===undefined||v===null?'':String(v)); }

/* ---------------- SERVICE SCHEDULE / DMS PENDING WORK ----------------
   Pending work is NOT inferred from old local vehicle fields or copied DASH rules.
   Workshop Manager creates the service schedule. The live Google Sheet is only
   the service-history source used to find the latest completed change. */
function normPartNo(v){ return String(v??'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function serviceScheduleRows(){
  return (DATA.settings?.serviceSchedule||[]).filter(x=>x && x.active!==false);
}
function serviceScheduleApplicable(rule,vehicle){
  const vt=String(rule.vehicleType||'ALL').trim().toUpperCase();
  return !vt || vt==='ALL' || vt===String(vehicle?.vehicleType||'').trim().toUpperCase();
}
function serviceRulePartNos(rule){
  const raw=Array.isArray(rule.partNos)?rule.partNos:(String(rule.partNos||'').split(/[,;\n]+/));
  return [...new Set(raw.map(normPartNo).filter(Boolean))];
}
function serviceRuleResetKeywords(rule){
  return String(rule.resetKeywords||'').split(/[,;\n]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);
}
function dmsRowKm(r){ return dmsNum(r?.km); }
function dmsRowDate(r){ return dmsDateValue(r?.invoiceDate||r?.soDate); }
function dmsRowMatchesPart(r,partNos){
  const p=normPartNo(r?.partNo);
  return !!p && partNos.includes(p);
}
function dmsQtyMatchesSchedule(r,rule){
  const min=rule.minQty===null||rule.minQty===undefined||rule.minQty===''?null:dmsNum(rule.minQty);
  const max=rule.maxQty===null||rule.maxQty===undefined||rule.maxQty===''?null:dmsNum(rule.maxQty);
  if(min===null && max===null) return true;
  const qty=dmsNum(r?.qty);
  if(qty===null) return false;
  if(min!==null && qty<min) return false;
  if(max!==null && qty>max) return false;
  return true;
}
function dmsLatestScheduleEvent(rows,rule,currentKm){
  const partNos=serviceRulePartNos(rule);
  const resetWords=serviceRuleResetKeywords(rule);
  const usable=rows.filter(r=>{ const k=dmsRowKm(r); return k===null || currentKm===null || k<=currentKm; });
  // A part change counts only when its DMS quantity is inside the WM-defined quantity range.
  // If a row is below the minimum, keep searching older records for the last valid change.
  const partRows=usable.filter(r=>dmsRowMatchesPart(r,partNos) && dmsQtyMatchesSchedule(r,rule));
  const resetRows=resetWords.length ? usable.filter(r=>{ const hay=String(r?.partDesc||'').toLowerCase(); return resetWords.some(w=>hay.includes(w)); }) : [];
  const best=(arr)=>arr.slice().sort((a,b)=>{
    const ak=dmsRowKm(a), bk=dmsRowKm(b);
    if(ak!==null && bk!==null && ak!==bk) return bk-ak;
    if(ak!==null && bk===null) return -1; if(ak===null && bk!==null) return 1;
    return dmsRowDate(b)-dmsRowDate(a);
  })[0]||null;
  const part=best(partRows), reset=best(resetRows);
  const pk=part?dmsRowKm(part):null, rk=reset?dmsRowKm(reset):null;
  if(reset && (rk!==null) && (pk===null || rk>pk)) return {row:reset,kind:'RESET',partRow:part,resetRow:reset};
  return {row:part,kind:'PART',partRow:part,resetRow:null};
}
function serviceScheduleStatus(rows,rule,currentKm,vehicle){
  if(!serviceScheduleApplicable(rule,vehicle)) return null;
  const interval=dmsNum(rule.intervalKm), firstDue=dmsNum(rule.firstDueKm), tolerance=Math.max(0,dmsNum(rule.allowedKm)??2000);
  if(interval===null || interval<=0) return null;
  if(currentKm===null || !Number.isFinite(currentKm)) return null;
  const event=dmsLatestScheduleEvent(rows,rule,currentKm);
  const lastKm=event.row ? dmsRowKm(event.row) : null;
  const baseDue=lastKm!==null ? lastKm+interval : (firstDue!==null ? firstDue : interval);
  const dueFrom=baseDue-tolerance, overdueAfter=baseDue+tolerance;
  let status='';
  if(currentKm>=dueFrom && currentKm<=overdueAfter) status='DUE';
  else if(currentKm>overdueAfter) status='OVERDUE';
  const remark=event.kind==='RESET' ? (rule.resetRemark||`Reset by replacement: ${event.row?.partDesc||'aggregate/engine replacement'}`) : (rule.remark||'');
  return {
    rule,id:rule.id,partNo:(Array.isArray(rule.partNos)?rule.partNos[0]:(String(rule.partNos||'').split(/[,;\n]+/)[0]||'')),partDesc:rule.description||'',itemType:rule.itemType||'PART',
    currentKm, lastKm, baseDueKm:baseDue, dueFromKm:dueFrom, overdueAfterKm:overdueAfter, status,
    fixedQty:rule.qty, minQty:rule.minQty, maxQty:rule.maxQty, changedPartNo:event.partRow?.partNo||event.row?.partNo||'', changedDate:event.row?.invoiceDate||event.row?.soDate||'',
    changedCoco:event.row?.location||'', changedQty:event.row?.qty||'', reset:event.kind==='RESET', remark
  };
}
function dmsScheduledItems(rows,currentKm,vehicle){
  return serviceScheduleRows().map(rule=>serviceScheduleStatus(rows,rule,currentKm,vehicle)).filter(Boolean).filter(x=>x.status);
}
function dmsConnectionSummary(rows,vehicleNo,currentKm,vehicle){
  const invoices=rows.map(r=>r.invoiceDate||r.soDate).filter(Boolean).sort((a,b)=>dmsDateValue(b)-dmsDateValue(a));
  const latest=invoices[0]||''; const scheduled=dmsScheduledItems(rows,currentKm,vehicle);
  return {vehicle:vehicleNo,currentKm,latestInvoice:latest,overdue:scheduled.filter(x=>x.status==='OVERDUE').length,due:scheduled.filter(x=>x.status==='DUE').length,pendingCampaigns:dmsPendingCampaigns(rows).length};
}
function dmsPendingCampaigns(rows){
  const map=new Map();
  rows.forEach(r=>{
    const deal=String(r.dealType||'').toUpperCase();
    const desc=String(r.partDesc||'').trim();
    const pn=String(r.partNo||'').trim();
    if(deal.includes('TECHCAMPGN') || deal.includes('CAMPAIGN') || /campaign/i.test(desc)){
      const key=(pn+'|'+desc).toLowerCase();
      if(!map.has(key) || dmsDateValue(r.invoiceDate||r.soDate)>dmsDateValue(map.get(key).invoiceDate||map.get(key).soDate)) map.set(key,r);
    }

  return [...map.values()].map(r=>({date:r.invoiceDate||r.soDate||'',coco:r.location||'',vehicle:r.vehicle||'',dealType:r.dealType||'TECHCAMPGN',onKm:dmsNum(r.km),partNo:r.partNo||'',partDesc:r.partDesc||'',qty:r.qty||'',status:'PENDING',so:r.so||'',incident:r.incident||''}));
}
function dmsServiceHistory(rows){
  const map=new Map();
  rows.forEach(r=>{
    const desc=String(r.partDesc||''); const deal=String(r.dealType||'').toUpperCase();
    const serviceLike=/\bSERVICE\b|\bK SERVICE\b|LABOR/i.test(desc) && (deal.includes('AMC') || /service/i.test(desc));
    if(!serviceLike) return;
    const key=String(r.so||'').trim()||`${r.invoiceDate}|${r.km}|${desc}`;
    const prev=map.get(key);
    if(!prev || dmsDateValue(r.invoiceDate||r.soDate)>dmsDateValue(prev.invoiceDate||prev.soDate)) map.set(key,r);
  });
  return [...map.values()].sort((a,b)=>(dmsNum(b.km)||0)-(dmsNum(a.km)||0)).slice(0,30);
}
function dmsServicePendency(rows){
  const map=new Map();
  rows.forEach(r=>{
    const inc=String(r.incident||'').trim();
    if(!inc) return;
    const key=inc;
    const prev=map.get(key)||{incident:inc,date:r.invoiceDate||r.soDate||'',coco:r.location||'',vehicle:r.vehicle||'',km:dmsNum(r.km),so:r.so||'',reported:[],actions:[]};
    if(r.partDesc) prev.reported.push(r.partDesc);
    map.set(key,prev);
  });
  return [...map.values()].sort((a,b)=>dmsDateValue(b.date)-dmsDateValue(a.date)).slice(0,12).map(x=>({...x,reported:[...new Set(x.reported)].slice(0,3)}));
}
function dmsParseCsvLine(line){
  const out=[]; let cur='', quoted=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(quoted && line[i+1]==='"'){cur+='"'; i++;}
      else quoted=!quoted;
    }else if(ch===',' && !quoted){out.push(cur);cur='';}
    else cur+=ch;
  }
  out.push(cur); return out;
}
function dmsCsvToRows(text){
  const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()!=='');
  if(!lines.length) return [];
  const headers=dmsParseCsvLine(lines[0]).map(x=>String(x).trim());
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const vals=dmsParseCsvLine(lines[i]); const row={};
    for(let c=0;c<headers.length;c++) row[headers[c]||`COL_${c}`]=vals[c]??'';
    rows.push(row);
  }
  return rows;
}
function dmsGvizJsonp(query, timeoutMs=15000){
  return new Promise((resolve,reject)=>{
    const cb='__cocoDmsGviz_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>finish(new Error('Google Sheet request timed out.')),timeoutMs);
    function cleanup(){clearTimeout(timer);try{delete window[cb];}catch(e){window[cb]=undefined;}script.remove();}
    function finish(err,data){if(done)return;done=true;cleanup();err?reject(err):resolve(data);}
    window[cb]=(data)=>{if(!data){finish(new Error('Google Sheet returned an empty response.'));return;}if(String(data.status||'').toLowerCase()==='error'){const msg=(data.errors||[]).map(x=>x.detailed_message||x.message).filter(Boolean).join(' | ')||'Google Visualization query failed.';finish(new Error(msg));return;}finish(null,data);};
    script.onerror=()=>finish(new Error('Browser could not load the published Google Sheet.'));
    const base=`${DMS_GOOGLE_SHEET_GVIZ}?sheet=${encodeURIComponent(DMS_GOOGLE_SHEET_NAME)}&headers=1&tq=${encodeURIComponent(query)}&tqx=${encodeURIComponent('responseHandler:'+cb)}`;
    script.src=base; document.head.appendChild(script);
  });
}
function dmsGvizTableToRows(data){
  const table=data?.table;if(!table)return[];
  const cols=(table.cols||[]).map((c,i)=>c.label||c.id||`COL_${i}`);
  return(table.rows||[]).map(row=>{const out={};cols.forEach((name,i)=>{const cell=row?.c?.[i];out[name]=cell?.f??cell?.v??'';});return out;});
}
function dmsCsvUrlForVehicle(vehicleNo){
  const v=dmsVehicleClean(vehicleNo).replace(/'/g,"''");

}
async function dmsFetchVehicle(vehicleNo){
  const no=dmsVehicleClean(vehicleNo); if(!no)return[];
  if(Object.prototype.hasOwnProperty.call(dmsRemoteCache,no))return dmsRemoteCache[no];
  dmsRemoteStatus=`Loading ${no} from Google Sheet…`;
  try{
    const data=await dmsGvizJsonp(dmsCsvUrlForVehicle(no));
    const raw=dmsGvizTableToRows(data); const rows=raw.map(dmsCompactRow).filter(Boolean);
    dmsRemoteCache[no]=rows; dmsRemoteLastSync=nowISO(); dmsRemoteStatus=`Connected · ${Object.keys(dmsRemoteCache).length} vehicle(s) loaded`; return rows;
  }catch(e){console.error('DMS Google Sheet fetch error:',e);dmsRemoteStatus=`Connection failed: ${e.message||'Unable to read Google Sheet'}`;throw e;}
}

function dmsFormatLatestInvoice(value){
  const raw=String(value||'').trim();
  if(!raw) return '';
  const d=new Date(raw);
  if(!Number.isNaN(d.getTime())) return d.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'});
  const m=raw.match(/(\d{4})[-\/]?(\d{2})[-\/]?(\d{2})/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  return raw;
}
async function dmsCheckConnection(force=false){
  // Connection status is NOT polled continuously. A successful check is kept
  // in memory for this browser session and is reused when the Profile panel
  // is opened again. Only RECHECK/RETRY starts a new Google request.
  if(!force && dmsConnectionResult) return dmsConnectionResult;
  if(dmsConnectionCheckInFlight) return dmsConnectionCheckInFlight;

  dmsConnectionCheckInFlight=(async()=>{
    const tq=`select A where A is not null`;
    const started=Date.now();
    try{
      dmsRemoteStatus='Checking Google Sheet…';
      const data=await dmsGvizJsonp(tq);
      const rows=Array.isArray(data?.table?.rows)?data.table.rows:[];
      let latest='', latestTime=0;
      rows.forEach(row=>{
        const cell=row?.c?.[0];
        const display=String(cell?.f ?? cell?.v ?? '').trim();
        const time=dmsDateValue(display);
        if(time>latestTime){ latestTime=time; latest=display; }
      });
      if(!latest) throw new Error('Sheet is reachable, but no valid Invoice Date was found in column A.');
      dmsRemoteLastSync=nowISO();
      dmsRemoteStatus='Connected';
      dmsConnectionResult={ok:true,latestInvoice:latest,checkedAt:dmsRemoteLastSync,ms:Date.now()-started};
      return dmsConnectionResult;
    }catch(e){
      const msg=String(e?.message||e||'Unable to read Google Sheet');
      let reason=msg, solution='';
      if(/timeout/i.test(msg)){
        reason='Google Sheets did not return the data to COCO FLOW within 15 seconds.';
        solution='Check internet access and confirm the Google Sheet is still Published to web. Then press RETRY.';
      }else if(/could not load|browser could not|failed to load/i.test(msg)){
        reason='Browser could not load the Google Visualization response from the sheet.';
        solution='The sheet is published correctly. If COCO FLOW is opened as a local HTML file, publish COCO FLOW on HTTPS/GitHub Pages and press RETRY.';
      }else if(/query failed|not found|column/i.test(msg)){
        reason=msg;
        solution='Confirm Sheet1 is published and Invoice Date is column A and Vehicle No is column C. Then press RETRY.';
      }else{
        reason=msg;
        solution='Confirm the published Sheet1 link is active and accessible without signing in. Then press RETRY.';
      }
      dmsRemoteStatus=`Connection failed: ${reason}`;
      dmsConnectionResult={ok:false,reason,solution,checkedAt:nowISO(),ms:Date.now()-started};
      return dmsConnectionResult;
    }finally{
      dmsConnectionCheckInFlight=null;
    }
  })();
  return dmsConnectionCheckInFlight;
}

function reportMonthDefault(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthBounds(ym){
  const m=String(ym||'').match(/^(\d{4})-(\d{2})$/); if(!m)return null;
  const y=Number(m[1]), mo=Number(m[2]); if(mo<1||mo>12)return null;
  const start=`${y}-${String(mo).padStart(2,'0')}-01`;
  const next=new Date(y,mo,1);
  return {start,next:`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-01`};
}
function reportMonthDateValue(v){ return dmsDateValue(v); }
function reportMonthLabel(ym){
  const m=monthBounds(ym); if(!m)return ym||'';
  return new Date(`${m.start}T00:00:00`).toLocaleDateString([], {month:'long',year:'numeric'});
}
function reportEscape(v){return escapeHtml(String(v??''));}

/*
  MONTHLY COCO REPORT — SOURCE OF TRUTH: DMS GOOGLE SHEET ONLY.
  No COCO FLOW technician timers or local vehicle records are used here.
  Rules requested by WM:
    - SO OPENED = unique Service Order Number whose Order Date is in the selected month.
    - PAID JOB = unique SO whose Deal Type is PAID, based on the selected month's DMS rows.
    - BOOKED SO = unique SO whose Invoice Doc Date is in the selected month.
    - LABOUR HRS = SUM(Quantity) only for DMS rows where Item type = G/L Account.
      In the supplied DMS file, these labour rows use Material No 3200040.
    - COCO = Location Code from the DMS sheet.
*/
function buildCocoMonthlyReport(rows, ym){
  const bounds=monthBounds(ym); if(!bounds)return {cocos:[],totals:{}};
  const a0=new Date(bounds.start+'T00:00:00').getTime();
  const a1=new Date(bounds.next+'T00:00:00').getTime();
  const map=new Map();
  const soDetails=new Map();
  const ensure=(coco)=>{
    const key=(String(coco||'UNMAPPED').trim()||'UNMAPPED').toUpperCase();
    if(!map.has(key)) map.set(key,{coco:key,soOpened:new Set(),paidSO:new Set(),bookedSO:new Set(),laborHours:0,rows:0,vehicles:new Set()});
    return map.get(key);
  };
  const inMonth=t=>t>=a0 && t<a1;
  rows.forEach(r=>{
    const coco=String(r.location||'UNMAPPED').trim()||'UNMAPPED';
    const x=ensure(coco);
    const so=String(r.so||'').trim();
    const orderT=reportMonthDateValue(r.soDate);
    const invoiceT=reportMonthDateValue(r.invoiceDate);
    const deal=String(r.dealType||'').trim().toUpperCase();
    const itemType=String(r.itemType||'').trim().toUpperCase().replace(/\s+/g,' ');
    const materialNo=String(r.materialNo||'').trim().toUpperCase();
    const qty=Number(String(r.qty??'').replace(/,/g,'').trim());

    if(inMonth(orderT) && so) x.soOpened.add(so);
    if(inMonth(invoiceT) && so){
      x.bookedSO.add(so);
      if(deal==='PAID' || deal.includes('PAID')) x.paidSO.add(so);
      x.rows++;
      if(r.vehicle) x.vehicles.add(r.vehicle);
      if(!soDetails.has(so)) soDetails.set(so,{so,coco,dealType:r.dealType||'',vehicle:r.vehicle||'',soDate:r.soDate||'',invoiceDate:r.invoiceDate||'',incident:r.incident||''});
    }

    // Labour is ONLY the DMS G/L Account line quantity.
    // Do not use local technician work timers.
    if(inMonth(invoiceT) && itemType==='G/L ACCOUNT' && Number.isFinite(qty)) x.laborHours+=qty;
  });

  const cocos=[...map.values()].sort((a,b)=>a.coco.localeCompare(b.coco));
  const totals={soOpened:0,paidSO:0,bookedSO:0,laborHours:0,rows:0,vehicles:0};
  const all={soOpened:new Set(),paidSO:new Set(),bookedSO:new Set(),vehicles:new Set()};
  cocos.forEach(x=>{
    x.soOpened=[...x.soOpened];
    x.paidSO=[...x.paidSO];
    x.bookedSO=[...x.bookedSO];
    x.soOpened.forEach(z=>all.soOpened.add(z));
    x.paidSO.forEach(z=>all.paidSO.add(z));
    x.bookedSO.forEach(z=>all.bookedSO.add(z));
    x.vehicles.forEach(z=>all.vehicles.add(z));
    totals.laborHours+=x.laborHours;
    totals.rows+=x.rows;
  });
  totals.soOpened=all.soOpened.size;
  totals.paidSO=all.paidSO.size;
  totals.bookedSO=all.bookedSO.size;
  totals.vehicles=all.vehicles.size;
  return {cocos,totals,soDetails:[...soDetails.values()]};
}

async function loadCocoMonthlyReport(){
  const ym=document.getElementById('cocoReportMonth')?.value||reportMonthDefault(); window.__cocoReportMonth=ym;
  const box=document.getElementById('cocoMonthlyReport'); if(!box)return;
  const bounds=monthBounds(ym); if(!bounds){box.innerHTML='<div class="notice">Please select a valid month.</div>';return;}
  box.innerHTML='<div class="report-loading">Loading selected month from DMS Google Sheet…</div>';
  try{
    // Query the DMS source itself. Columns in the supplied DMS workbook:
    // C=Invoice Doc Date, D=Order Date, G=Vehicle, J=Incident, L=SO,
    // P=Service Order Date, AM=Location Code, AP=Item type, AQ=Material No,
    // AR=Material Description, AS=Quantity, AT=Deal Type.
    // Only the DMS columns required for this report are selected, but every value is calculated from the supplied DMS sheet itself.
    const q=`select A,C,D,G,J,L,P,AM,AP,AQ,AR,AS,AT where ((C >= date '${bounds.start}' and C < date '${bounds.next}') or (D >= date '${bounds.start}' and D < date '${bounds.next}'))`;
    const data=await dmsGvizJsonp(q,30000);

          <div class="coco-report-kpi"><span>LABOUR HRS</span><b>${rep.totals.laborHours.toFixed(2)}</b></div>
        </div>
        <div class="card-meta" style="margin-top:10px">Source: DMS Google Sheet only · ${rows.length.toLocaleString('en-IN')} source rows used</div>
      </div>
      <div class="panel"><h2>COCO-WISE MONTHLY COMPARISON</h2>
        <div class="coco-compare-wrap"><table class="coco-compare"><thead><tr><th>COCO</th><th>SO OPENED</th><th>PAID JOB / SO</th><th>BOOKED / INVOICED SO</th><th>LABOUR HRS</th><th>INVOICE ROWS</th><th>VEHICLES</th></tr></thead><tbody>
        ${rep.cocos.map(x=>`<tr><td><b>${reportEscape(x.coco)}</b></td><td>${x.soOpened.length}</td><td>${x.paidSO.length}</td><td>${x.bookedSO.length}</td><td>${x.laborHours.toFixed(2)}</td><td>${x.rows}</td><td>${x.vehicles.size}</td></tr>`).join('')||'<tr><td colspan="7">No DMS data found for selected month.</td></tr>'}
        </tbody></table></div>
      </div>
      <div class="panel"><h2>COCO DETAILS</h2>
        ${rep.cocos.map(x=>`<details class="coco-detail"><summary>${reportEscape(x.coco)} — ${x.bookedSO.length} BOOKED · ${x.paidSO.length} PAID · ${x.laborHours.toFixed(2)} labour hrs</summary>
          <table><thead><tr><th>SO NO.</th><th>SO DATE</th><th>INVOICE DATE</th><th>VEHICLE</th><th>DEAL TYPE</th><th>INCIDENT</th></tr></thead><tbody>
          ${rep.soDetails.filter(d=>String(d.coco||'').trim().toUpperCase()===x.coco).map(d=>`<tr><td>${reportEscape(d.so)}</td><td>${reportEscape(d.soDate||'—')}</td><td>${reportEscape(d.invoiceDate||'—')}</td><td>${reportEscape(d.vehicle||'—')}</td><td>${reportEscape(d.dealType||'—')}</td><td>${reportEscape(d.incident||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No SO details.</td></tr>'}
          </tbody></table>
        </details>`).join('')}
      </div>`;
  }catch(e){
    console.error(e);
    box.innerHTML=`<div class="notice" style="color:var(--red)"><b>REPORT LOAD FAILED</b><br>${escapeHtml(e.message||'Unable to read monthly DMS data from Google Sheet.')}<br><small>Check Google Sheet connection and click GET REPORT again.</small></div>`;
  }
}
function excelSafe(v){
  if(v===undefined || v===null) return '';
  if(v instanceof Date) return v;
  if(typeof v==='object'){
    try{return JSON.stringify(v);}
    catch(e){return String(v);}
  }
  return v;
}
function flattenRecord(obj){
  const out={};
  Object.keys(obj||{}).forEach(k=>out[k]=excelSafe(obj[k]));
  return out;
}
function downloadWorkbook(sheets, filename){
  if(typeof XLSX==='undefined'){
    toast('Excel module not loaded — check internet and reload');
    return;
  }
  const wb=XLSX.utils.book_new();
  sheets.forEach(sh=>{
    const rows=(sh.rows||[]).map(flattenRecord);
    if(!rows.length) rows.push({Message:'No records'});
    const ws=XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb,ws,String(sh.name||'Report').slice(0,31));
  });
  XLSX.writeFile(wb,filename,{bookType:'xlsx'});
}
function exportAllExcel(){
  const date=new Date().toISOString().slice(0,10);
  const sheets=[
    {name:'Vehicles',rows:DATA.vehicles||[]},
    {name:'Breakdowns',rows:DATA.breakdowns||[]},

    {name:'Staff',rows:DATA.staff||[]},

    {name:'Visitors',rows:DATA.visitors||[]},
    {name:'Leaves',rows:DATA.leaves||[]},
    {name:'Tours',rows:DATA.tours||[]},

    {name:'Parts Master',rows:DATA.settings?.partsList||[]},
    {name:'Complaint Master',rows:DATA.settings?.complaintList||[]},
    {name:'Action Master',rows:DATA.settings?.actionList||[]}
  ];
  // Export the hydrated DMS index too, when available. Each key becomes one row.
  if(DATA.dmsIndex && typeof DATA.dmsIndex==='object' && Object.keys(DATA.dmsIndex).length){
    const dmsRows=Object.entries(DATA.dmsIndex).map(([key,value])=>({
      Vehicle:key,
      Data:value
    }));
    sheets.push({name:'DMS Data',rows:dmsRows});
  }
  downloadWorkbook(sheets,`COCO-FLOW-ALL-REPORTS-${date}.xlsx`);

function exportDmsExcel(){
  const ym=document.getElementById('cocoReportMonth')?.value||window.__cocoReportMonth||reportMonthDefault();
  if(!DATA.dmsIndex || typeof DATA.dmsIndex!=='object' || !Object.keys(DATA.dmsIndex).length){
    toast('Load the DMS report first, then export');
    return;
  }
  const rows=[];
  Object.entries(DATA.dmsIndex).forEach(([vehicle,data])=>{
    if(Array.isArray(data)){
      data.forEach(r=>rows.push(Object.assign({Vehicle:vehicle},r)));
    }else if(data && typeof data==='object'){
      rows.push(Object.assign({Vehicle:vehicle},data));
    }else{
      rows.push({Vehicle:vehicle,Data:data});
    }
  });
  downloadWorkbook([{name:'DMS Records',rows}],`COCO-FLOW-DMS-${ym}.xlsx`);
  toast('DMS report exported to Excel');
}
function exportCsv(){
  let rows = [['Type','Vehicle/Employee','Details','Time In','Time Out']];
  DATA.vehicles.forEach(v=> rows.push(['Vehicle', v.vehicleNo, `${v.driverName} | ${v.currentStatus||''} | ${v.bay||''} | ${v.complaint||''}`, v.inTime, v.outTime||'']));
  DATA.breakdowns.forEach(b=> rows.push(['Breakdown', b.vehicleNo, `${b.complaint} | Stage:${b.stage} | Tech:${b.assignedTechnician} | MSV:${b.assignedMsvDriver}`, b.createdAt, b.msvDriverPunchAt||'']));
  DATA.employees.forEach(e=> rows.push(['Employee', e.empName, e.empId||'', e.inTime, e.outTime||'']));
  const csv = rows.map(r=> r.map(c=> `"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'gate-register-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
