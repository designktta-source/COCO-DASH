    }
    return `<div class="inline-action bd-step"><b>TECHNICIAN: START FROM COCO (${mode})</b><div class="card-meta">Tap START when you leave COCO. The travel timer and ETA run from this moment. No Security verification is needed.</div><div class="row-actions"><button class="btn btn-green" data-bdtrip-pubstart="${id}">START FROM COCO</button></div></div>`;

      return bdNote(`${mode}: AWAITING SECURITY`,`Security must verify the parts and the ${mode} KM before it leaves COCO.`);
    }
    if(!actor) return bdNote(`${mode} ON THE WAY`,'Waiting for the technician to confirm REACHED at the BD location.');
    return `<div class="inline-action bd-step"><b>TECHNICIAN: REACHED BD LOCATION</b>${kind==='VEH'?`<div class="card-meta">Enter the ${mode} odometer reading at the BD spot.</div>${bdNum(mode+' REACH KM *','bd_tripreachkm_'+id,'Odometer at BD spot')}`:'<div class="card-meta">Tap REACHED when you arrive at the BD location.</div>'}<div class="row-actions"><button class="btn btn-green" data-bdtrip-reach="${id}">REACHED</button></div></div>`;
  }
  if(b.stage==='ONROAD'){
    if(kind==='VEH'){
      if(can('breakdownReturnKm')) return `<div class="inline-action bd-step"><b>SECURITY: ${mode} RETURNED TO COCO</b><div class="field"><label>${mode} RETURN KM *</label><input id="bd_returnkm_${id}" type="number" inputmode="decimal" min="${Number(b.tripReachKm||b.tripOutKm||0)}" placeholder="Odometer on arrival at COCO"></div><div class="row-actions"><button class="btn btn-green" data-bdreturnkm="${id}">SAVE RETURN KM</button></div></div>`;
      return bdNote('RETURNING TO COCO',`Security will record the ${mode} KM on arrival.`);
    }
    if(actor) return `<div class="inline-action bd-step"><b>TECHNICIAN: RETURNED TO COCO (${mode})</b><div class="card-meta">Enter the total amount spent on travelling. Security verification is not required.</div>${bdNum('TRAVELLING AMOUNT SPENT (Rs) *','bd_tripamt_'+id,'0.00')}<div class="row-actions"><button class="btn btn-green" data-bdtrip-pubreturn="${id}">RETURNED TO COCO</button></div></div>`;
    return bdNote('RETURNING TO COCO','The technician will enter the travelling amount on arrival.');
  }

  }
  return '';
}

/* ----- handlers (re-bound after every render) ----- */
async function bdCommit(msg){ const r=await saveData(); toast(r===true?msg:msg+' (saved on device - cloud sync pending)'); render(); }
function bindBdTripHandlers(){
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(btn=>{ btn.onclick=()=>fn(btn); });
  const numOk=v=>v!==''&&Number.isFinite(Number(v))&&Number(v)>=0;
  on('[data-bdtrip-report]',btn=>{
    const id=btn.dataset.bdtripReport, b=bdFind(id); if(!b||!bdTechActor(b)) return; const mode=bdMode(b);
    const reg=bdVal('bd_tripreg_'+id).toUpperCase(), drv=bdVal('bd_tripdrv_'+id), sk=bdVal('bd_tripstart_'+id), ck=bdVal('bd_tripcoco_'+id);
    if(mode==='CAB'){
      if(reg.length<5){ toast('Enter the CAB registration number'); return; } if(drv.length<2){ toast('Enter the CAB driver name'); return; }
      if(!numOk(sk)){ toast('Enter CAB START KM'); return; } if(!numOk(ck)){ toast('Enter CAB COCO REACH KM'); return; }
      if(Number(ck)<Number(sk)){ toast('CAB COCO REACH KM cannot be less than CAB START KM'); return; }
    } else if(!numOk(sk)){ toast('Enter BIKE START KM'); return; }
    confirmAndRun(`Submit ${mode} details for Security verification?`,async()=>{
      const l=bdFind(id); if(!l) return;
      Object.assign(l,{tripRegNo:reg,tripDriverName:drv,tripStartKm:String(sk),tripCocoReachKm:String(mode==='CAB'?ck:sk),tripReportedAt:nowISO(),tripReportedBy:whoTag(),stage:'STARTED',partsKmVerifiedAt:null,partsKmVerifiedBy:null,tripOutAt:null});
      await bdCommit(`${mode} reported - waiting for Security verification`);
    });
  });
  on('[data-bdtrip-verify]',btn=>{
    if(!can('breakdownVerify')) return; const id=btn.dataset.bdtripVerify, b=bdFind(id); if(!b) return; const mode=bdModeLabel(b), km=bdVal('bd_tripverkm_'+id);
    const parts=b.partsCarrying||[], ver=Array.isArray(b.partsVerified)?b.partsVerified:[];
    if(!numOk(km)){ toast(`Enter the ${mode} KM`); return; }
    if(Number(km)<Number(b.tripStartKm||0)){ toast(`KM cannot be less than the start KM ${b.tripStartKm}`); return; }
    if(parts.length&&!parts.every((p,i)=>!!ver[i]?.checked)){ toast('Please complete parts verification first'); return; }
    confirmAndRun(`Confirm parts and ${mode} KM - allow it to leave COCO?`,async()=>{
      const l=bdFind(id); if(!l) return; l.tripOutKm=String(km); l.tripKmCorrected=String(km)!==String(l.tripCocoReachKm);
      l.partsKmVerifiedAt=nowISO(); l.partsKmVerifiedBy=whoTag(); l.tripOutAt=l.partsKmVerifiedAt; await bdCommit(`${mode} verified - cleared to leave COCO`);
    });
  });
  on('[data-bdtrip-pubstart]',btn=>{
    const id=btn.dataset.bdtripPubstart, b=bdFind(id); if(!b||!bdTechActor(b)) return;
    confirmAndRun(`Start from COCO by ${bdModeLabel(b)}?`,async()=>{ const l=bdFind(id); if(!l) return; l.tripStartAt=nowISO(); l.tripStartBy=whoTag(); l.stage='STARTED'; await bdCommit('Started from COCO - travel timer running'); });
  });
  on('[data-bdtrip-reach]',btn=>{
    const id=btn.dataset.bdtripReach, b=bdFind(id); if(!b||!bdTechActor(b)) return; const veh=bdKind(b)==='VEH'; let km='';
    if(veh){ km=bdVal('bd_tripreachkm_'+id); if(!numOk(km)){ toast('Enter the REACH KM at the BD spot'); return; } if(Number(km)<Number(b.tripOutKm||b.tripStartKm||0)){ toast(`REACH KM cannot be less than ${b.tripOutKm||b.tripStartKm}`); return; } }
    confirmAndRun('Confirm reached at the BD location?',async()=>{ const l=bdFind(id); if(!l) return; l.reachTime=nowISO(); l.reachBy=whoTag(); if(veh){ l.tripReachKm=String(km); l.reachKm=String(km); } l.stage='REACHED'; await bdCommit('Reached BD location - work in progress'); });
  });
  on('[data-bdtrip-pubreturn]',btn=>{
    const id=btn.dataset.bdtripPubreturn, b=bdFind(id); if(!b||!bdTechActor(b)) return; const amt=bdVal('bd_tripamt_'+id);
    if(!numOk(amt)){ toast('Enter the travelling amount spent (Rs)'); return; }
    confirmAndRun('Confirm return to COCO and the travelling amount?',async()=>{ const l=bdFind(id); if(!l) return; l.tripReturnAt=nowISO(); l.returnTimeToCOCO=l.tripReturnAt; l.travelAmount=Number(amt); l.travelAmountBy=whoTag(); l.stage='CLOSED'; await bdCommit('Returned to COCO - breakdown closed'); });
  });
  on('[data-bdtrip-partsreturn]',btn=>{
    const id=btn.dataset.bdtripPartsreturn, b=bdFind(id); if(!b||!bdTechActor(b)) return;
    confirmAndRun('Return the remaining parts to the Store?',async()=>{ const l=bdFind(id); if(!l) return; l.partsDisposition='RETURN_TO_STORE'; l.partsDispositionSelectedAt=nowISO(); l.partsDispositionSelectedBy=whoTag(); l.tripPartsReturnedAt=l.partsDispositionSelectedAt; await bdCommit('Parts handed over - Store Executive will confirm receipt'); });
  });
}

function bdReportRows(ym){
  const coco=String((DATA.settings&&DATA.settings.cocoName)||'NAGPUR COCO').toUpperCase();

  return (DATA.breakdowns||[]).filter(b=>b&&inReportMonth(b.createdAt,ym)).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))).map((b,i)=>{
    const km=Number(b.kmFromCOCO);
    return [i+1,coco,dmyhm(b.createdAt),hmOnly(b.createdAt),b.incidentNumber||'',bdModeLabel(b),b.customer||'',b.vehicleNo||'',b.vehicleLocation||'',b.district||'',Number.isFinite(km)&&b.kmFromCOCO!==''&&b.kmFromCOCO!=null?km:'',dmyhm(bdStartedAt(b)),dmyhm(b.reachTime),gap(b.createdAt,b.reachTime),dmyhm(b.onroadTime),b.onroadTime?hhmm(b.totalTimeMs!=null?b.totalTimeMs:new Date(b.onroadTime)-new Date(b.createdAt)):'',(Array.isArray(b.complaints)&&b.complaints.length?b.complaints.join(' | '):(b.complaint||'')),b.observation||'',b.workDoneText||''];
  });

async function clearAllOperationalData(includeToolsMaster){

document.getElementById('syncPill')?.addEventListener('click',async()=>{ if(syncState.pending){ toast('Syncing…'); const r=await saveData(); toast(r===true?'All data synced to cloud':'Still offline — will retry automatically'); } else { toast('All data is synced to the cloud'); } });
window.addEventListener('popstate',()=>{
  const m=location.hash.match(/^#manage-job=(.+)$/);
  const ml=location.hash.match(/^#master-list=(partsList|complaintList|actionList)$/);
  activeVehicleJobId=m?decodeURIComponent(m[1]):null;
  activeMasterList=ml?ml[1]:null;
  activeServiceSchedule=location.hash==='#service-schedule';
  if(currentUser) render();
});

function renderLogin(){

  if(storageStatus==='unavailable'){

    document.getElementById('mainNotice').style.borderColor = 'var(--red)';
  } else {
    document.getElementById('mainNotice').innerHTML = `<b>✅ Connected.</b> Select your name and tap CONTINUE.`;

                 placeholder="Enter password">
        </div>
        <div class="row-actions">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
        <div style="margin-top:10px;color:var(--muted);font-size:12px;text-align:center;">
          Login ID is your registered mobile number. Default password is the <b>last 4 digits of your mobile number</b>.
          Change it after login.
        </div>
      </form>
      `}
    </div>
  `;

  const form = document.getElementById('loginForm');
  if(!form) return;

  form.addEventListener('submit', async (ev)=>{
    ev.preventDefault();

    const mobile = document.getElementById('login_mobile').value.trim().replace(/\D/g,'');
    const password = document.getElementById('login_password').value;

    if(!mobile){ toast('Enter mobile number'); return; }
    if(!password){ toast('Enter password'); return; }

    const staff = (DATA.staff||[]).find(s => {
      if(!s) return false;
      const role=String(s.position||s.role||'').trim();
      const phone=String(s.phone||s.mobile||s.loginId||'').replace(/\D/g,'');
      return ROLES.includes(role) && phone === mobile;
    });

    if(!staff){
      toast('Mobile number not found');
      return;
    }

    // New/default password is the last four mobile digits. Migrate legacy
    // auto-generated six-digit passwords without overriding a custom password.
    const newDefault=defaultStaffPassword(staff);
    const legacyDefault=legacyDefaultStaffPassword(staff);
    const stored=staff.password==null?'':String(staff.password);
    const isLegacyDefault=!!legacyDefault && stored===legacyDefault && legacyDefault!==newDefault;
    const acceptedPasswords = stored ? [stored] : [newDefault];
    // For legacy accounts whose saved password is the old auto-generated six digits,
    // allow the new four-digit default once so the account can migrate safely.
    if(isLegacyDefault) acceptedPasswords.push(newDefault);
    if(!acceptedPasswords.includes(String(password))){
      toast('Incorrect mobile number or password');
      return;
    }
    if(isLegacyDefault && String(password)===newDefault){ staff.password=newDefault; await saveData(); }

    currentUser = {
      id: staff.id,
      name: staff.name,
      role: staff.position || staff.role,
      phone: staff.phone || staff.mobile || staff.loginId || '',
      loginPhone: mobile
    };
    if(currentUser.role==='Workshop Manager'){
      try{localStorage.setItem('coco-flow-wm-original-user',JSON.stringify({id:staff.id,name:staff.name,role:'Workshop Manager',phone:currentUser.phone}));}catch(_e){}
    } else {
      try{localStorage.removeItem('coco-flow-wm-original-user');}catch(_e){}
    }
    await saveSession();
    render();
  });
}

function isSecurityStaff(st){
  const text=[st?.role,st?.position,st?.designation,st?.employeeRole,st?.department,st?.employee_type,st?.employeeType,st?.name]
    .map(x=>String(x||'').toLowerCase()).join(' ');
  return /\bsecurity\b|\bguard\b/.test(text);
}
function regularStaffList(){
  return (DATA.staff||[]).filter(s=>s&&s.name&&!isSecurityStaff(s));
}
function securityStaffList(){
  return (DATA.staff||[]).filter(s=>s&&s.name&&isSecurityStaff(s));
}

function dashboardSimpleRows(type){

      return [st.name,st.position||'—',e?.inTime?fmtTime(e.inTime):'—'];

  if(type==='vehicleIn'){

  }

    const personRole=isVirtualMsv?'MSV Driver':(staffPerson?.position||'');
    if(!personName){toast('Selected user not found');return;}
    t.qty=toolAvailableQty(t)-q;
    DATA.toolAssignments.push({id:uid(),toolId:t.id,toolDescription:t.description,qty:q,assigneeId,assigneeName:personName,assigneeRole:personRole,assignedAt:nowISO(),assignedById:currentUser.id,assignedByName:currentUser.name,acknowledgedAt:null,acknowledgedById:null,acknowledgedByName:null});
    logToolTx('ASSIGNED',DATA.toolAssignments[DATA.toolAssignments.length-1]);
    // Close the assignment window immediately. Do not keep the modal open while
    // waiting for cloud synchronization (which can take several seconds on Android).
    // saveData() already writes a local recovery copy first, so the assignment is
    // safely stored on this device before the cloud request starts.
    close();
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA)); }catch(e){ console.warn('Tool assignment local save failed',e); }
    toast(`Tool assigned to ${personName}. Acknowledgment required.`);
    renderMyToolsModal();
    // Synchronize in the background. The UI must not wait for the cloud save.
    saveData().then(saved=>{
      if(saved===false){
        toast('Tool assignment saved on this device. Cloud sync is pending.');
      }
    }).catch(err=>{
      console.error('Tool assignment cloud sync failed:',err);
      toast('Tool assignment saved on this device. Cloud sync is pending.');
    });
  });
}

  const reopenTools=()=>{ document.getElementById('myToolsModal')?.remove(); renderMyToolsModal(); };
  document.getElementById('myToolsModal')?.addEventListener('click',async ev=>{
    const b=ev.target.closest('[data-tool-return-req],[data-tool-receive],[data-tool-reassign]'); if(!b||b.disabled) return;
    const id=b.dataset.toolReturnReq||b.dataset.toolReceive||b.dataset.toolReassign, a=DATA.toolAssignments.find(x=>String(x.id)===String(id));

    }
    if(b.dataset.toolReassign){
      const toolId=a.toolId; b.disabled=true; await completeToolReturn(a.id,a.qty,'reassign');
      document.getElementById('myToolsModal')?.remove(); renderToolAssignModal(toolId); return;
    }
  });
}

function msvTripStatusLabel(st){return ({ASSIGNED:'TEAM ASSIGNED',STARTED:'STARTED BY DRIVER',OUT:'MSV OUT',AT_LOCATION:'AT LOCATION',RESUMED:'TRIP RESUMED',IN_MSV:'IN MSV',ENDED:'TRIP COMPLETED'}[st]||st||'—');}
function msvTripLastKm(driverId){
  const vals=[];
  (DATA.msvTrips||[]).filter(t=>String(t.driverId||'')===String(driverId||'')).forEach(t=>{if(t.endKm!=null)vals.push(Number(t.endKm)||0);else if(t.returnKm!=null)vals.push(Number(t.returnKm)||0);else if(t.startKm!=null)vals.push(Number(t.startKm)||0);});
  (DATA.breakdowns||[]).filter(b=>String(b.assignedMsvDriverId||'')===String(driverId||'')).forEach(b=>{[b.returnKm,b.msvReturnKm,b.msvStartKm,b.km].some(x=>{if(x!==undefined&&x!==null&&x!==''){vals.push(Number(x)||0);return true;}return false;});});
  return vals.length ? Math.max(0,...vals) : 100;
}
function bdMsvStartBaseKm(b){
  // BD-attending MSV must start from the last KM recorded when the MSV
  // returned/ended at COCO. Do not use the BD vehicle's reported KM.
  const driverId=b?.assignedMsvDriverId || b?.msvDriverId || currentUser?.id || '';
  const vals=[];
  (DATA.msvTrips||[]).filter(t=>String(t.driverId||'')===String(driverId||'')).forEach(t=>{
    [t.endKm,t.returnKm,t.cocoEndKm,t.msvReturnKm].some(x=>{
      if(x!==undefined&&x!==null&&x!==''){ const n=Number(x); if(Number.isFinite(n)&&n>0) vals.push(n); return true; }
      return false;
    });
  });
  (DATA.breakdowns||[]).filter(x=>String(x.id)!==String(b?.id||'') && String(x.assignedMsvDriverId||'')===String(driverId||'')).forEach(x=>{
    [x.returnKm,x.msvReturnKm,x.cocoEndKm,x.msvEndKm].some(v=>{
      if(v!==undefined&&v!==null&&v!==''){ const n=Number(v); if(Number.isFinite(n)&&n>0) vals.push(n); return true; }
      return false;
    });
  });
  const last=vals.length?Math.max(...vals):100;
  return Number.isFinite(last) && last>0 ? last : 100;
}

function isVehicleDeleted(v){ return !!(v && v.deletedAt); }
function isVehicleHeld(v){ return !!(v && v.hold === true); }
function canDeleteVehicle(){ return !!currentUser && currentUser.role==='Workshop Manager'; }
function canManageVehicleLock(){ return !!currentUser && currentUser.role==='Workshop Manager'; }
function canEditVehicle(v){
  if(!v || isVehicleDeleted(v)) return false;
  if(isVehicleHeld(v)) return currentUser?.role==='Workshop Manager';
  return true;
}


function fmtDuration(ms){
  ms=Math.max(0,Number(ms)||0);
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function vehicleWorkElapsed(v){
  if(!v) return '00:00:00';
  const now=Date.now();
  let total=0;
  if(Array.isArray(v.workSegments) && v.workSegments.length){
    v.workSegments.forEach(seg=>{
      if(!seg?.start) return;
      const a=new Date(seg.start).getTime();
      const b=seg.end ? new Date(seg.end).getTime() : now;
      if(Number.isFinite(a) && Number.isFinite(b) && b>=a) total += (b-a);
    });
    return fmtDuration(total);
  }
  // Backward compatibility for vehicles created before workSegments existed.
  if(!v.workStartedAt) return '00:00:00';
  const end=v.workDoneAt ? new Date(v.workDoneAt).getTime() : (v.rfdAt ? new Date(v.rfdAt).getTime() : now);
  const start=new Date(v.workStartedAt).getTime();
  return Number.isFinite(start) && Number.isFinite(end) && end>=start ? fmtDuration(end-start) : '00:00:00';
}
function hasActiveWorkSegment(v){
  return !!(v && Array.isArray(v.workSegments) && v.workSegments.some(s=>s && s.start && !s.end));
}
function closeActiveWorkSegment(v, at){
  if(!Array.isArray(v.workSegments)) v.workSegments=[];
  const active=v.workSegments.find(s=>s && s.start && !s.end);
  if(active) active.end=at;
}
function startWorkSegment(v, at){
  if(!Array.isArray(v.workSegments)) v.workSegments=[];
  // Never create a second live segment. If a timer is already running,
  // keep the existing segment instead of allowing START WORK to restart it.
  if(hasActiveWorkSegment(v)) return false;
  v.workSegments.push({start:at,end:null});
  v.workStartedAt=at;
  v.workStartedBy=whoTag();
  v.currentStatus='WIP';
  return true;
}

function recordWorkflowEvent(v, action, at, extra={}){
  if(!v) return;
  if(!Array.isArray(v.workflowHistory)) v.workflowHistory=[];
  v.workflowHistory.push(Object.assign({
    id:uid(), action:String(action||''), at:at||nowISO(), by:whoTag(),
    vehicleStatus:v.currentStatus||'', workElapsed:vehicleWorkElapsed(v)
  }, extra||{}));
  // Keep the embedded audit trail bounded so workshop_state remains compact.
  if(v.workflowHistory.length>200) v.workflowHistory=v.workflowHistory.slice(-200);
}
async function persistWorkflow(v, action, at, extra={}){
  recordWorkflowEvent(v,action,at,extra);
  const saved=await saveData();
  if(!saved){
    toast(`${action} NOT saved to cloud. Please reconnect and retry.`);
    return false;
  }
  return true;
}
function vehicleComplaints(v){
  if(!v) return [];
  if(!Array.isArray(v.complaintItems)){
    const arr=Array.isArray(v.complaints)?v.complaints:(v.complaint?[v.complaint]:[]);
    v.complaintItems=arr.filter(Boolean).map((c,i)=>({id:uid(),text:String(c),status:'',pendingReason:'',pna:'',action:'',remark:'',resolvedAt:null,resolvedBy:null,workStartedAt:null}));
  }
  return v.complaintItems;
}
function technicianStaffList(){
  return (DATA.staff||[]).filter(s=>s && s.name && s.position==='Technician');
}
function technicianIsBusy(staffId, excludeVehicleId){
  return DATA.vehicles.some(v=>!isVehicleDeleted(v) && v.id!==excludeVehicleId && v.status!=='OUT' && !isVehicleHeld(v) &&
    ((v.responsibleTechnicianId===staffId) || (Array.isArray(v.supportingTechnicianIds)&&v.supportingTechnicianIds.includes(staffId))));
}
function availableTechnicians(excludeVehicleId){
  return technicianStaffList().filter(s=>!technicianIsBusy(s.id,excludeVehicleId));
}
function vehicleWorkComplete(v){
  const cs=vehicleComplaints(v);
  return cs.length>0 && cs.every(c=>c.status==='RESOLVED');
}

function technicianAndMsvStaffList(){
  return (DATA.staff||[]).filter(s=>s && s.name && (s.position==='Technician' || s.position==='MSV Driver'));
}
function presentTechniciansForVehicle(excludeVehicleId){
  return (DATA.staff||[]).filter(s=>{
    if(!s || !s.name) return false;
    if(!['Technician','MSV Driver'].includes(s.position)) return false;
    return !technicianIsBusy(s.id,excludeVehicleId);
  });
}
function responsibleTechniciansForVehicle(excludeVehicleId){
  return (DATA.staff||[]).filter(s=>s && s.name && s.position==='Technician' && !technicianIsBusy(s.id,excludeVehicleId));
}

    (String(b.assignedTechnicianId||'')===uid || String(b.assignedTechnician||'').trim().toLowerCase()===uname));

  return !!v && user?.role==='Technician' && v.status==='IN' && (!isVehicleHeld(v) || techOwnPause(v,user));

function msvAssignedToBDVehicle(v,user){
  if(!v || !user || user.role!=='MSV Driver') return false;
  const uid=String(user.id||'');

  return (DATA.breakdowns||[]).some(b=>b && b.stage!=='CLOSED' && String(b.vehicleNo||'').trim().toLowerCase()===String(v.vehicleNo||'').trim().toLowerCase() &&

function userCanSeeVehicle(v,user){
  if(!v || !user) return false;
  if(['Workshop Manager','Service Advisor','Security Guard'].includes(user.role)) return true;
  if(user.role==='Technician') return technicianCanSeeVehicle(v,user);
  if(user.role==='MSV Driver') return v.status==='IN' && !isVehicleHeld(v);
  return false;
}

  return !!v && !isVehicleDeleted(v) && !isVehicleHeld(v) && v.status==='IN';

function vehicleWorkDoneAllowed(v){

function vehicleCanRFD(v){

function vehicleCanRelease(v){
  return !!v && !!v.rfdAt && !!v.incidentNumber && /^\d{6}$/.test(String(v.incidentNumber));

  // MSV Driver must see the BD vehicles specifically assigned to them.
  // Workshop Manager continues to see all BD vehicles.
  if(currentUser?.role==='MSV Driver'){
    const myId=String(currentUser.id||'');
    const myName=String(currentUser.name||'').trim().toLowerCase();
    list=list.filter(b=>String(b.assignedMsvDriverId||'')===myId || String(b.assignedMsvDriver||'').trim().toLowerCase()===myName);
  }
  if(DASHBOARD_LIST_FILTER==='breakdownOpen') list=list.filter(b=>b.stage!=='CLOSED');
  if(DASHBOARD_LIST_FILTER==='breakdownToday') list=list.filter(b=>isToday(b.createdAt));
  if(term.length<3) list=list.filter(b=>bdVisibleInList(b));   /* finished breakdowns drop off the list; search (3+ chars) still finds them */
  if(term) list = list.filter(b => (b.vehicleNo+' '+b.driverName+' '+b.assignedTechnician+' '+b.assignedMsvDriver).toLowerCase().includes(term));

function stageBadge(stage){
  const map = {ASSIGNED:'TEAM ASSIGN', STARTED:'TEAM ON THE WAY', VERIFIED:'TEAM ON THE WAY', REACHED:'WIP', ONROAD:'ON ROAD', RETURNED:'RETURNING TO COCO', CLOSED:'CLOSED'};
  return `<span class="badge stage">${map[stage]||stage}</span>`;
}

function renderBreakdownCard(b){
  const latestLat = b.reachLatitude ?? b.startLatitude ?? b.latitude;
  const latestLng = b.reachLongitude ?? b.startLongitude ?? b.longitude;
  const hasMap = latestLat!=null && latestLng!=null && Number.isFinite(Number(latestLat)) && Number.isFinite(Number(latestLng));
  const googleMap = hasMap ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(Number(latestLat)+','+Number(latestLng))}` : '';
  const appleMap = hasMap ? `https://maps.apple.com/?ll=${encodeURIComponent(Number(latestLat)+','+Number(latestLng))}&q=${encodeURIComponent(b.vehicleNo||'Vehicle')}` : '';
  const locationText = b.reachedLocation || b.vehicleLocation || (hasMap ? `${Number(latestLat).toFixed(5)}, ${Number(latestLng).toFixed(5)}` : 'Location not available');
  const stageLabel = ({ASSIGNED:'TEAM ASSIGN',STARTED:'TEAM ON THE WAY',VERIFIED:'TEAM ON THE WAY',REACHED:'WIP',ONROAD:'ON ROAD',RETURNED:'RETURNING TO COCO',CLOSED:'CLOSED'})[b.stage] || b.stage || '—';
  const stageClass = b.stage==='REACHED' ? 'reached' : b.stage==='CLOSED' ? 'closed' : '';
  const distance = b.kmFromCOCO!=null && b.kmFromCOCO!=='' ? `${escapeHtml(b.kmFromCOCO)} km` : '—';
  return `<div class="bd-clean-card bd-summary-card ${b.stage==='REACHED'?'bd-reached':''} ${b.stage==='CLOSED'?'bd-closed':''}" data-bd-open-detail="${escapeHtml(b.id)}" role="button" tabindex="0" aria-label="Open BD details for ${escapeHtml(b.vehicleNo||'vehicle')}">
    <div class="bd-summary-row">
      <div class="bd-summary-vehicle"><strong>${escapeHtml(b.vehicleNo||'—')}</strong><span class="bd-status ${stageClass}">${stageLabel}</span></div>
      <div class="bd-summary-location"><span class="bd-summary-label">BD LOCATION</span><strong>${escapeHtml(locationText)}</strong></div>
      <div class="bd-summary-distance"><span class="bd-summary-label">FROM COCO</span><strong>${distance}</strong></div>
      <div class="bd-summary-status"><span class="bd-summary-label">STATUS</span><strong>${stageLabel}</strong></div>
      ${hasMap?`<div class="bd-summary-map"><a href="${googleMap}" target="_blank" rel="noopener" class="bd-get-location" title="Get vehicle location in Google Maps" onclick="event.stopPropagation()">📍</a><div>GET<br>LOCATION</div></div>`:`<div class="bd-summary-map bd-no-location" title="Location not available">📍</div>`}
    </div>
    ${bdSummaryExtraHtml(b)}<div class="bd-summary-hint">Tap vehicle to open full BD details &amp; actions</div>
  </div>`;
}

function renderBreakdownDetailPage(b){
  const canEdit = ['Workshop Manager','Service Advisor'].includes(currentUser?.role);
  const techs=(DATA.staff||[]).filter(s=>s&&s.name&&s.position==='Technician').sort((a,b)=>a.name.localeCompare(b.name));
  const msves=(DATA.staff||[]).filter(s=>s&&s.name&&s.position==='MSV Driver').sort((a,b)=>a.name.localeCompare(b.name));
  const complaintText = Array.isArray(b.complaints)&&b.complaints.length ? b.complaints.join(' | ') : (b.complaint||'');
  const detailEdit = canEdit ? `<div class="panel bd-edit-panel"><h3>EDIT BD DETAILS</h3><div class="grid">
    <div class="field"><input id="bdedit_no_${b.id}" value="${escapeHtml(b.vehicleNo||'')}"></div>
    <div class="field"><label>Incident No.</label><input id="bdedit_incident_${b.id}" maxlength="6" inputmode="numeric" value="${escapeHtml(b.incidentNumber||'')}"></div>
    <div class="field"><label>Driver Name</label><input id="bdedit_driver_${b.id}" value="${escapeHtml(b.driverName||'')}"></div>
    <div class="field"><label>Driver Mobile</label><input id="bdedit_mobile_${b.id}" inputmode="tel" value="${escapeHtml(b.mobileNo||'')}"></div>
    <div class="field"><label>BD KM</label><input id="bdedit_km_${b.id}" type="number" value="${escapeHtml(b.km||'')}" ${b.stage!=='ASSIGNED'?'disabled':''}></div>
    <div class="field"><label>BD Location</label><input id="bdedit_loc_${b.id}" value="${escapeHtml(b.vehicleLocation||b.reachedLocation||'')}"></div>
    <div class="field"><label>District</label><input id="bdedit_dist_${b.id}" value="${escapeHtml(b.district||'')}"></div>
    <div class="field"><label>Approx. KM from COCO</label><input id="bdedit_cocokm_${b.id}" type="number" step="0.01" value="${escapeHtml(b.kmFromCOCO??'')}"></div>
    <div class="field"><label>Assign Technician</label><select id="bdedit_tech_${b.id}"><option value="">Select Technician</option>${techs.map(x=>`<option value="${escapeHtml(x.id)}" ${String(b.assignedTechnicianId||'')===String(x.id)?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div>
    <div class="field"><label>2nd Technician <small>(Optional)</small></label><select id="bdedit_tech2_${b.id}"><option value="">None</option>${techs.map(x=>`<option value="${escapeHtml(x.id)}" ${String(b.assignedTechnician2Id||'')===String(x.id)?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Attend Breakdown By</label><select id="bdedit_attend_${b.id}" ${b.stage==='ASSIGNED'?'':'disabled'}>${Object.keys(BD_MODES).map(m=>`<option value="${m}" ${bdMode(b)===m?'selected':''}>${m==='OTHER'?'OTHER PUBLIC TRANSPORT':m}</option>`).join('')}</select></div>
    <div class="field"><label>Customer</label><input id="bdedit_customer_${b.id}" value="${escapeHtml(b.customer||'')}"></div>
    <div class="field"><label>Assign MSV Driver</label><select id="bdedit_msv_${b.id}"><option value="">Select MSV Driver</option>${msves.map(x=>`<option value="${escapeHtml(x.id)}" ${String(b.assignedMsvDriverId||'')===String(x.id)?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div>
    <div class="field" style="grid-column:1/-1"><label>Complaint</label><textarea id="bdedit_complaint_${b.id}" rows="2">${escapeHtml(complaintText)}</textarea></div>
    <div class="field" style="grid-column:1/-1"><label>Remarks / Notes</label><textarea id="bdedit_remark_${b.id}" rows="2">${escapeHtml(b.remarks||b.remark||'')}</textarea></div>
  </div><div class="row-actions"><button type="button" class="btn btn-green" data-bd-save-edit="${escapeHtml(b.id)}">SAVE BD DETAILS</button></div></div>` : '';
  return `<div class="bd-detail-page"><div class="bd-detail-page-head"><button type="button" class="btn-ghost" data-bd-detail-back>← BACK TO BD LIST</button><div><h2>${escapeHtml(b.vehicleNo||'BD Vehicle')}</h2><div class="card-meta">Complete BD details &amp; workflow</div></div></div>${detailEdit}${renderBreakdownDetailCard(b)}</div>`;
}

function renderBreakdownDetailCard(b){
  let inlineAction = '';

  // Store Executive must always be able to see the parts already assigned to the BD vehicle.
  // Once parts are confirmed, the assigned list is strictly read-only (no edit/delete controls).
  const currentBdUserId=String(currentUser?.id||'');
  const currentBdUserName=String(currentUser?.name||'').trim().toLowerCase();
  const assignedUserCanSeeParts = currentUser?.role==='Store Executive' ||
    String(b.assignedTechnicianId||'')===currentBdUserId || String(b.assignedMsvDriverId||'')===currentBdUserId ||
    String(b.assignedTechnician||'').trim().toLowerCase()===currentBdUserName ||
    String(b.assignedMsvDriver||'').trim().toLowerCase()===currentBdUserName;
  const storeAssignedPartsView = (assignedUserCanSeeParts && Array.isArray(b.partsCarrying) && b.partsCarrying.length && b.partsConfirmedAt) ? (()=>{
    const rows = (b.partsCarrying||[]).map((p,i)=>{
      const consumed = (b.consumedParts||[]).filter(x=>String(x.partNo||'')===String(p.partNo||'')).reduce((n,x)=>n+(Number(x.qty)||0),0);
      const remaining = Math.max(0,(Number(p.qty)||0)-consumed);
      return remaining<=0 ? '' : `<div class="bd-parts-single-row">
        <span class="bd-pn">${escapeHtml(p.partNo||'—')}</span>
        <span class="bd-pdesc">${escapeHtml(p.description||p.name||'')}</span>
        <span class="bd-qty-readonly">${remaining}</span>
        <span><span class="badge in">REMAINING</span></span>
      </div>`;
    }).join('');
    return `<div class="inline-action bd-store-assigned-parts">
      <b>REMAINING PARTS</b>
      <div class="card-meta">Only balance quantity on the MSV is shown. Consumed parts are removed automatically.</div>
      <div class="bd-parts-single-table bd-parts-readonly">
        <div class="bd-parts-single-head"><span>Part No.</span><span>Description</span><span>Remaining Qty</span><span>Status</span></div>
        ${rows || `<div class="card-meta" style="padding:10px">No parts remaining on vehicle.</div>`}
      </div>
    </div>`;
  })() : '';

  const tripHtml=tripInlineHtml(b);
  if(tripHtml){ inlineAction=tripHtml; }
  else if(b.stage==='ASSIGNED' && can('breakdownParts') && !b.partsConfirmedAt){
    const parts=(b.partsCarrying||[]);
    const escAttr=x=>escapeHtml(String(x??''));
    const partList = parts.length ? `<div class="bd-parts-single-table"><div class="bd-parts-single-head"><span>Part No.</span><span>Description</span><span>Qty</span><span>Action</span></div>${parts.map((p,i)=>`<div class="bd-parts-single-row" data-bd-part-row="${b.id}-${i}"><span class="bd-pn">${escAttr(p.partNo||'—')}</span><span class="bd-pdesc">${escAttr(p.description||p.name||'')}</span><span><input class="bd-qty" data-bd-qty="${b.id}-${i}" type="number" min="1" value="${escAttr(p.qty||1)}" disabled></span><span class="bd-part-actions"><button type="button" class="btn btn-blue bd-edit-btn" data-bd-edit-part="${b.id}" data-part-index="${i}">EDIT</button><button type="button" class="btn btn-danger" data-bd-delete-part="${b.id}" data-part-index="${i}">DELETE</button></span></div>`).join('')}</div>` : `<div class="card-meta">No parts added yet.</div>`;
    inlineAction = `<div class="inline-action"><b>Store Executive: ADD PARTS TO VEHICLE</b>
      <div class="card-meta"><b>PARTS CARRYING</b></div>${partList}
      ${b.partsConfirmedAt?'':`${partPickerHtml('bd_store_'+b.id,'Add Part',true)}
      <div class="field"><label>Quantity *</label><input id="bd_store_partqty_${b.id}" type="number" min="1" step="1" placeholder="Qty"></div>
      <div class="row-actions"><button class="btn btn-blue" data-bdaddpart="${b.id}">ADD PART</button>${parts.length?`<button class="btn btn-green" data-bdconfirm-parts="${b.id}">CONFIRM PARTS</button>`:''}</div>`}
    </div>`;
  }
  else if(b.stage==='ASSIGNED' && b.partsConfirmedAt && can('breakdownStart') && !b.msvStartAt){
    inlineAction = `<div class="inline-action"><b>MSV DRIVER: START FROM COCO</b>
      <div class="field"><label>MSV START KM *</label><input id="bd_kmstart_${b.id}" type="number" min="${bdMsvStartBaseKm(b)}" placeholder="Last COCO end KM: ${bdMsvStartBaseKm(b)}" value="${escapeHtml(b.msvStartKm||bdMsvStartBaseKm(b))}"></div>
      <div class="card-meta">Starting KM is automatically taken from the last COCO end KM. You may edit it only if required, but it cannot be lower than the last COCO end KM.</div>
      <div class="row-actions"><button class="btn btn-blue" data-bdmsvstart="${b.id}">START</button></div>
    </div>`;
  }
  else if(b.stage==='STARTED' && b.msvStartAt && !b.partsKmVerifiedAt && currentUser?.role==='Security Guard'){
    inlineAction = `<div class="inline-action"><b>SECURITY GUARD: CONFIRM PARTS + START KM</b>
      <div class="card-meta">MSV Driver has started from COCO. Check all carrying parts physically and confirm/correct the start KM. Fuel and REACH remain locked until this confirmation.</div>
      ${(b.partsCarrying||[]).map((p,i)=>{ const v=(b.partsVerified||[])[i]||{}; const expected=Number(p.qty)||0; const physical=v.physicalQty??''; const done=!!v.checked; const mismatch=!!v.mismatch; return `<div class="part-verify-row" style="padding:9px 0;border-bottom:1px solid var(--border);"><b>${i+1}. ${escapeHtml(p.partNo||'—')} · ${escapeHtml(p.description||p.name||'')}</b><small style="display:block;color:var(--muted);">System Qty: <b>${expected}</b>${physical!==''?' · Physical Qty: <b>'+escapeHtml(physical)+'</b>':''}${done?(mismatch?' · ✕ MISMATCH — confirmation still allowed':' · ✓ MATCH'):''}</small>${done?'<span class="badge">CHECKED</span>':`<div class="field"><label>Physical Qty *</label><input id="bd_physicalqty_${b.id}_${i}" type="number" min="0" step="1" value="${escapeHtml(physical)}"></div><button class="btn btn-blue" data-bdverify-part="${b.id}" data-part-index="${i}">CHECK PART</button>`}</div>`; }).join('')}
      <div class="field"><label>MSV START KM — VERIFY / EDIT *</label><input id="bd_verify_start_km_${b.id}" type="number" min="${bdMsvStartBaseKm(b)}" value="${escapeHtml(b.msvStartKm||bdMsvStartBaseKm(b))}"></div>
      <div class="row-actions"><button class="btn btn-green" data-bdverify-start="${b.id}">CONFIRM PARTS & KM</button></div>
    </div>`;
  }
  else if(b.stage==='STARTED' && b.partsKmVerifiedAt && can('breakdownReach')){
    inlineAction = `<div class="inline-action"><b>MSV DRIVER: REACH BD LOCATION</b><div class="card-meta">Parts and start KM confirmed by Security Guard. GPS is optional.</div><div class="row-actions"><button class="btn btn-green" data-bdreach="${b.id}">REACH</button></div></div>`;
  }
  else if(b.stage==='REACHED' && can('breakdownOnroad')){
    const consumed=Array.isArray(b.partsConsumed)?b.partsConsumed:[];
    inlineAction = `<div class="inline-action"><b>TECHNICIAN: PART CONSUMPTION / WIP</b>${(b.partsCarrying||[]).map((p,i)=>{const c=consumed[i]||{};return `<div class="part-verify-row"><b>${escapeHtml(p.partNo||'—')} · ${escapeHtml(p.description||p.name||'')}</b><div class="field"><label>Consumed Qty</label><input id="bd_consume_${b.id}_${i}" type="number" min="0" max="${Number(p.qty)||0}" value="${escapeHtml(c.qty??'0')}"></div></div>`}).join('')}<div class="field"><label>Observation * <small>(what was found at the BD spot)</small></label><textarea id="bd_observation_${b.id}" rows="2" placeholder="e.g. Dip stick cover cracked">${escapeHtml(b.observation||'')}</textarea></div><div class="field"><label>Work done *</label><textarea id="bd_workdone_${b.id}" rows="2" placeholder="e.g. Dip stick changed">${escapeHtml(b.workDoneText||'')}</textarea></div><div class="row-actions"><button class="btn btn-green" data-bdonroad="${b.id}">CONFIRM ON ROAD</button></div></div>`;
  }
  else if(b.stage==='ONROAD'){
    let extra='';
    if(can('breakdownReturnKm')){
      const minKm=Number(b.msvStartKm||b.km)||0;
      extra += `<div class="inline-action"><b>Security Guard: MSV RETURN</b><div class="field"><label>RETURN KM *</label><input id="bd_returnkm_${b.id}" type="number" min="${minKm}" placeholder="Enter current KM"></div><div class="row-actions"><button class="btn btn-blue" data-bdreturnkm="${b.id}">MSV RETURN</button></div></div>`;
    }
    inlineAction=extra;
  }
  else if(b.stage==='RETURNED' && can('breakdownPunch')){
    const returnMin=Number(b.msvStartKm||b.km)||0;
    inlineAction = `<div class="inline-action"><b>MSV DRIVER: RETURN TO COCO / STOP</b><div class="card-meta">Return KM entered by Security: <b>${escapeHtml(b.returnKm||'')}</b>. You can edit/correct it before STOP.</div><div class="field"><label>RETURN KM</label><input id="bd_msv_returnkm_${b.id}" type="number" min="${returnMin}" value="${escapeHtml(b.returnKm||'')}"></div><div class="row-actions"><button class="btn btn-blue" data-bdreturnedit="${b.id}">EDIT / SAVE KM</button><button class="btn btn-green" data-bdpunch="${b.id}">STOP & COMPLETE BD</button></div></div>`;
  }
  else if(b.stage==='CLOSED' && !b.partsDisposition && currentUser?.role==='MSV Driver' && String(b.assignedMsvDriverId||'')===String(currentUser?.id||'')){
    const remainingCount=(b.partsCarrying||[]).reduce((sum,p)=>{ const c=(b.consumedParts||[]).filter(x=>String(x.partNo||'')===String(p.partNo||'')).reduce((n,x)=>n+(Number(x.qty)||0),0); return sum+Math.max(0,(Number(p.qty)||0)-c); },0);
    inlineAction = `<div class="inline-action bd-disposition-box"><b>MSV DRIVER: REMAINING PARTS DISPOSITION</b><div class="card-meta">BD is stopped. Remaining parts on the MSV: <b>${remainingCount}</b>. Select where the balance will go.</div><div class="row-actions"><button class="btn btn-blue" data-bd-disposition="${b.id}" data-disposition="RETURN_TO_STORE">RETURN TO COCO / STORE</button><button class="btn btn-green" data-bd-disposition="${b.id}" data-disposition="KEEP_IN_MSV">KEEP IN MSV</button></div></div>`;
  }
  else if(b.stage==='CLOSED' && b.partsDisposition==='RETURN_TO_STORE' && !b.partsReturnConfirmedAt && can('breakdownReturnParts')){
    inlineAction = `<div class="inline-action"><b>STORE EXECUTIVE: RETURN NON-CONSUMED PARTS</b><div class="card-meta">Compare system remaining quantity with physical return. Any short quantity will automatically transfer to MSV Stock.</div>${(b.partsCarrying||[]).map((p,i)=>{ const consumed=(b.consumedParts||[]).filter(x=>String(x.partNo||'')===String(p.partNo||'')).reduce((n,x)=>n+(Number(x.qty)||0),0); const expected=Math.max(0,(Number(p.qty)||0)-consumed); if(expected<=0)return ''; const v=(b.partsReturnVerified||[])[i]||{}; return `<div class="part-verify-row"><b>${i+1}. ${escapeHtml(p.partNo||'—')} · ${escapeHtml(p.description||p.name||'')}</b><small>System Remaining: <b>${expected}</b></small>${v.checked?`<span class="badge">${v.mismatch?'SHORT / MISMATCH':'MATCH'}</span><small style="display:block">Physical: <b>${escapeHtml(v.physicalQty)}</b>${v.shortQty>0?' · Short transferred to MSV Stock: <b>'+escapeHtml(v.shortQty)+'</b>':''}</small>`:`<div class="field"><label>Physical Return Qty *</label><input id="bd_returnqty_${b.id}_${i}" type="number" min="0" max="${expected}" value="${escapeHtml(v.physicalQty??'')}"></div><button class="btn btn-blue" data-bdreturnpart="${b.id}" data-part-index="${i}">CHECK RETURN</button>`}</div>`; }).join('')}<div class="field"><label>Final Return Remark (Optional)</label><textarea id="bd_returnremark_${b.id}" rows="2" placeholder="Optional overall remark"></textarea></div><div class="row-actions"><button class="btn btn-green" data-bdconfirm-return="${b.id}">CONFIRM STORE RETURN</button></div></div>`;
  }
  else if(b.stage==='CLOSED' && !b.partsDisposition && !b.partsReturnConfirmedAt && can('breakdownReturnParts')){
    inlineAction = `<div class="inline-action"><b>Store Executive: RETURN NON-CONSUMED PARTS</b><div class="card-meta">Enter physical return quantity for each carrying part. One final optional remark is available before confirmation.</div>${(b.partsCarrying||[]).map((p,i)=>{const c=(b.partsConsumed||[])[i]||{};const expected=Math.max(0,(Number(p.qty)||0)-(Number(c.qty)||0));const v=(b.partsReturnVerified||[])[i]||{};return `<div class="part-verify-row"><b>${i+1}. ${escapeHtml(p.partNo||'—')} · ${escapeHtml(p.description||p.name||'')}</b><small>Expected return: <b>${expected}</b></small>${v.checked?`<span class="badge">${v.mismatch?'MISMATCH':'MATCH'}</span>`:`<div class="field"><label>Physical Return Qty *</label><input id="bd_returnqty_${b.id}_${i}" type="number" min="0" value="${escapeHtml(v.physicalQty??'')}"></div><button class="btn btn-blue" data-bdreturnpart="${b.id}" data-part-index="${i}">CHECK RETURN</button>`}</div>`}).join('')}<div class="field"><label>Final Return Remark (Optional)</label><textarea id="bd_returnremark_${b.id}" rows="2" placeholder="Optional overall remark"></textarea></div><div class="row-actions"><button class="btn btn-green" data-bdconfirm-return="${b.id}">CONFIRM ALL RETURNED PARTS</button></div></div>`;
  }
  else if(b.stage==='CLOSED' && b.partsReturnConfirmedAt){
    inlineAction=`<div class="inline-action"><b>✓ NON-CONSUMED PARTS RETURN COMPLETED</b><div class="card-meta">Confirmed by ${escapeHtml(b.partsReturnConfirmedBy||'')} · ${escapeHtml(b.partsReturnConfirmedAt||'')}</div>${b.partsReturnRemark?`<div class="card-meta"><b>Remark:</b> ${escapeHtml(b.partsReturnRemark)}</div>`:''}</div>`;
  }

  // Keep the read-only Store Executive parts view visible alongside the BD workflow.
  if(storeAssignedPartsView) inlineAction += storeAssignedPartsView;

  const allFuel = Array.isArray(b.fuelEntries)?b.fuelEntries:[];
  const totalFuelAmount = allFuel.reduce((sum,f)=>sum+(Number(f.amount??f.price)||0),0);
  const totalFuelQty = allFuel.reduce((sum,f)=>sum+(Number(f.qty)||0),0);
  const fuelEditor = can('breakdownFuel') && ['STARTED','REACHED','ONROAD','RETURNED'].includes(b.stage) && !!b.partsKmVerifiedAt ? `
    <div class="bd-fuel-box">
      <div class="bd-fuel-row">
        <div class="bd-fuel-label">⛽ <b>Fuel Entry</b></div>
        <div class="bd-fuel-input-wrap"><span>₹</span><input id="bd_fuelamount_${b.id}" type="number" min="0" step="0.01" placeholder="Amount"></div>
        <div class="bd-fuel-rate">@ ₹${Number(MARKET_DIESEL_RATE||98.38).toFixed(2)}/L</div>
        <div class="bd-fuel-input-wrap"><input id="bd_fuelqty_${b.id}" type="number" min="0.01" step="0.01" placeholder="Fuel Qty (L)"></div>
        <button class="btn btn-blue bd-fuel-add" data-bdfuel="${b.id}">ADD</button>
      </div>
      <div class="bd-fuel-total"><div><span>⛽</span><div><small>Total Fuel Used (This BD)</small><strong>₹${totalFuelAmount.toFixed(2)} · ${totalFuelQty.toFixed(2)} L</strong></div></div><div><small>Avg. Rate</small><strong>₹${Number(totalFuelQty>0?totalFuelAmount/totalFuelQty:(MARKET_DIESEL_RATE||98.38)).toFixed(2)}/L</strong></div></div>
    </div>` : (allFuel.length ? `<div class="bd-fuel-total bd-fuel-total-only"><div><span>⛽</span><div><small>Total Fuel Used (This BD)</small><strong>₹${totalFuelAmount.toFixed(2)} · ${totalFuelQty.toFixed(2)} L</strong></div></div><div><small>Avg. Rate</small><strong>₹${Number(totalFuelQty>0?totalFuelAmount/totalFuelQty:(MARKET_DIESEL_RATE||98.38)).toFixed(2)}/L</strong></div></div>` : '');

  const latestLat = b.reachLatitude ?? b.startLatitude ?? b.latitude;
  const latestLng = b.reachLongitude ?? b.startLongitude ?? b.longitude;
  const hasMap = latestLat!=null && latestLng!=null && Number.isFinite(Number(latestLat)) && Number.isFinite(Number(latestLng));
  const googleMap = hasMap ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(Number(latestLat)+','+Number(latestLng))}` : '';
  const appleMap = hasMap ? `https://maps.apple.com/?ll=${encodeURIComponent(Number(latestLat)+','+Number(latestLng))}&q=${encodeURIComponent(b.vehicleNo||'Vehicle')}` : '';
  const locationText = b.reachedLocation || b.vehicleLocation || (hasMap ? `${Number(latestLat).toFixed(5)}, ${Number(latestLng).toFixed(5)}` : 'Location not available');
  const stageLabel = ({ASSIGNED:'ASSIGNED',STARTED:'ON SERVICE',VERIFIED:'PARTS & KM VERIFIED',REACHED:'REACHED LOCATION',ONROAD:'ON ROAD',RETURNED:'RETURNING',CLOSED:'CLOSED'})[b.stage] || b.stage;
  const stageClass = b.stage==='REACHED' ? 'reached' : b.stage==='CLOSED' ? 'closed' : '';
  const startKm = b.msvStartKm || '';
  const reachedKm = b.reachKm || b.msvKmOut || '';
  const reachedDistance = (b.kmFromCOCO!=null && b.kmFromCOCO!=='') ? ` (${escapeHtml(b.kmFromCOCO)} km)` : '';
  const assignedText = b.createdAt ? `${fmtTime(b.createdAt)} · ${new Date(b.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}` : '';

  return `

const DMS_GOOGLE_SHEET_GVIZ = 'https://docs.google.com/spreadsheets/d/1wliSl4YR73iphHE_UpETg0OaMWsrC2baJXtzx98oP38/gviz/tq';
const DMS_GOOGLE_SHEET_NAME = 'Sheet1';
const dmsRemoteCache = Object.create(null);
let dmsRemoteLastSync = '';
let dmsRemoteStatus = 'Not checked yet';
let dmsConnectionResult = null;
let dmsConnectionCheckInFlight = null;

function dmsNorm(s){ return String(s??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,''); }
function dmsVehicleClean(s){ return String(s??'').replace(/\u00a0/g,' ').trim().replace(/\s+/g,' ').toUpperCase(); }
function dmsFind(row, aliases){
  const keys=Object.keys(row||{}); const wanted=aliases.map(dmsNorm);
  for(const k of keys){ const nk=dmsNorm(k); if(wanted.includes(nk)) return row[k]; }
  for(const k of keys){ const nk=dmsNorm(k); if(wanted.some(a=>nk.includes(a)||a.includes(nk))) return row[k]; }
  return '';
}
function dmsVehicleNo(row){ return dmsVehicleClean(dmsFind(row,['VEHICLE NO','Vehicle Registration No','Vehicle Reg No','Registration No','Vehicle No','Reg No','VEHICLE','Vehicle'])); }
function dmsCompactRow(row){
  const vehicle=dmsVehicleNo(row); if(!vehicle) return null;
  const invoiceDate=String(dmsFind(row,['INVOICE DATE','Invoice Date'])||'').trim();
  const soDate=String(dmsFind(row,['SO DATE','Service Order Date','Order Date','Date'])||'').trim();
  const km=String(dmsFind(row,['KM','On KM','Current KM','Current Mileage'])||'').trim();
  const location=String(dmsFind(row,['LOCATION','COCO','Workshop'])||'').trim();
  const type=String(dmsFind(row,['TYPE','Type'])||'').trim();
  const partNo=String(dmsFind(row,['ITEM NO','Part No','Part Number','Material No'])||'').trim();
  const partDesc=String(dmsFind(row,['ITEM DISRIPTION','ITEM DESCRIPTION','Part Description','Material Description','Description'])||'').trim();
  const qty=String(dmsFind(row,['QTY','Quantity','Qty'])||'').trim();
  const dealType=String(dmsFind(row,['DEAL TYPE','Deal Type'])||'').trim();
  const so=String(dmsFind(row,['SO NO','Service Order Number','Service Order No','SO Number','SO'])||'').trim();
  const incident=String(dmsFind(row,['INCIDENT NO','Incident No','Incident Number'])||'').trim();
  const itemType=String(dmsFind(row,['Item type','ITEM TYPE','Item Type','GL Account','G/L Account'])||'').trim();
  const materialNo=String(dmsFind(row,['Material No','MATERIAL NO','Item No','ITEM NO'])||'').trim();
  return {vehicle,invoiceDate,soDate,km,location,type,partNo,partDesc,qty,dealType,so,incident,itemType,materialNo};
}

function dmsNum(v){
  const n=Number(String(v??'').replace(/,/g,'').trim());
  return Number.isFinite(n)?n:null;
}
function dmsDateValue(v){
  const raw=String(v??'').trim(); if(!raw) return 0;
  // Parse DD/MM/YYYY explicitly before Date.parse to avoid browser locale ambiguity.
  let m=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if(m){ let y=Number(m[3]); if(y<100)y+=2000; const d=new Date(y,Number(m[2])-1,Number(m[1])); return Number.isNaN(d.getTime())?0:d.getTime(); }
  m=raw.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
  if(m){ const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3])); return Number.isNaN(d.getTime())?0:d.getTime(); }
  m=raw.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);
  if(m){ const d=new Date(Number(m[1]),Number(m[2]),Number(m[3])); return Number.isNaN(d.getTime())?0:d.getTime(); }
  const t=Date.parse(raw); return Number.isNaN(t)?0:t;
}
function dmsFmtDate(v){
  const t=dmsDateValue(v); if(!t) return String(v||'—');
  return new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function dmsFmtKm(v){ const n=dmsNum(v); return n===null?'—':Math.round(n).toLocaleString('en-IN'); }
function dmsStatusClass(status){ const s=String(status||'').toUpperCase(); return s.includes('OVER')?'overdue':s==='DUE'?'due':s==='PENDING'?'pending':'normal'; }
function dmsEsc(v){ return escapeHtml(v===undefined||v===null?'':String(v)); }

/* ---------------- SERVICE SCHEDULE / DMS PENDING WORK ----------------
   Pending work is NOT inferred from old local vehicle fields or copied DASH rules.
   Workshop Manager creates the service schedule. The live Google Sheet is only
   the service-history source used to find the latest completed change. */
function normPartNo(v){ return String(v??'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function serviceScheduleRows(){
  return (DATA.settings?.serviceSchedule||[]).filter(x=>x && x.active!==false);
}
function serviceScheduleApplicable(rule,vehicle){
  const vt=String(rule.vehicleType||'ALL').trim().toUpperCase();
  return !vt || vt==='ALL' || vt===String(vehicle?.vehicleType||'').trim().toUpperCase();

function dmsParseCsvLine(line){
  const out=[]; let cur='', quoted=false;

      if(quoted && line[i+1]==='"'){cur+='"'; i++;}
      else quoted=!quoted;
    }else if(ch===',' && !quoted){out.push(cur);cur='';}

  }
  out.push(cur); return out;
}
function dmsCsvToRows(text){

  const headers=dmsParseCsvLine(lines[0]).map(x=>String(x).trim());
  const rows=[];

    const vals=dmsParseCsvLine(lines[i]); const row={};

function dmsGvizJsonp(query, timeoutMs=15000){

    const cb='__cocoDmsGviz_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>finish(new Error('Google Sheet request timed out.')),timeoutMs);
    function cleanup(){clearTimeout(timer);try{delete window[cb];}catch(e){window[cb]=undefined;}script.remove();}

    window[cb]=(data)=>{if(!data){finish(new Error('Google Sheet returned an empty response.'));return;}if(String(data.status||'').toLowerCase()==='error'){const msg=(data.errors||[]).map(x=>x.detailed_message||x.message).filter(Boolean).join(' | ')||'Google Visualization query failed.';finish(new Error(msg));return;}finish(null,data);};
    script.onerror=()=>finish(new Error('Browser could not load the published Google Sheet.'));
    const base=`${DMS_GOOGLE_SHEET_GVIZ}?sheet=${encodeURIComponent(DMS_GOOGLE_SHEET_NAME)}&headers=1&tq=${encodeURIComponent(query)}&tqx=${encodeURIComponent('responseHandler:'+cb)}`;

  return(table.rows||[]).map(row=>{const out={};cols.forEach((name,i)=>{const cell=row?.c?.[i];out[name]=cell?.f??cell?.v??'';});return out;});
}

      dmsRemoteLastSync=nowISO();

        reason='Google Sheets did not return the data to COCO FLOW within 15 seconds.';
        solution='Check internet access and confirm the Google Sheet is still Published to web. Then press RETRY.';
      }else if(/could not load|browser could not|failed to load/i.test(msg)){
        reason='Browser could not load the Google Visualization response from the sheet.';
        solution='The sheet is published correctly. If COCO FLOW is opened as a local HTML file, publish COCO FLOW on HTTPS/GitHub Pages and press RETRY.';
      }else if(/query failed|not found|column/i.test(msg)){
        reason=msg;
        solution='Confirm Sheet1 is published and Invoice Date is column A and Vehicle No is column C. Then press RETRY.';
      }else{
        reason=msg;
        solution='Confirm the published Sheet1 link is active and accessible without signing in. Then press RETRY.';
      }
      dmsRemoteStatus=`Connection failed: ${reason}`;
      dmsConnectionResult={ok:false,reason,solution,checkedAt:nowISO(),ms:Date.now()-started};
      return dmsConnectionResult;
    }finally{
      dmsConnectionCheckInFlight=null;
    }
  })();
  return dmsConnectionCheckInFlight;
}

function monthBounds(ym){
  const m=String(ym||'').match(/^(\d{4})-(\d{2})$/); if(!m)return null;
  const y=Number(m[1]), mo=Number(m[2]); if(mo<1||mo>12)return null;
  const start=`${y}-${String(mo).padStart(2,'0')}-01`;
  const next=new Date(y,mo,1);
  return {start,next:`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-01`};
}

/*
  MONTHLY COCO REPORT — SOURCE OF TRUTH: DMS GOOGLE SHEET ONLY.
  No COCO FLOW technician timers or local vehicle records are used here.
  Rules requested by WM:
    - SO OPENED = unique Service Order Number whose Order Date is in the selected month.
    - PAID JOB = unique SO whose Deal Type is PAID, based on the selected month's DMS rows.
    - BOOKED SO = unique SO whose Invoice Doc Date is in the selected month.
    - LABOUR HRS = SUM(Quantity) only for DMS rows where Item type = G/L Account.
      In the supplied DMS file, these labour rows use Material No 3200040.
    - COCO = Location Code from the DMS sheet.
*/
function buildCocoMonthlyReport(rows, ym){
  const bounds=monthBounds(ym); if(!bounds)return {cocos:[],totals:{}};
  const a0=new Date(bounds.start+'T00:00:00').getTime();
  const a1=new Date(bounds.next+'T00:00:00').getTime();
  const map=new Map();
  const soDetails=new Map();
  const ensure=(coco)=>{
    const key=(String(coco||'UNMAPPED').trim()||'UNMAPPED').toUpperCase();
    if(!map.has(key)) map.set(key,{coco:key,soOpened:new Set(),paidSO:new Set(),bookedSO:new Set(),laborHours:0,rows:0,vehicles:new Set()});
    return map.get(key);
  };
  const inMonth=t=>t>=a0 && t<a1;
  rows.forEach(r=>{
    const coco=String(r.location||'UNMAPPED').trim()||'UNMAPPED';
    const x=ensure(coco);
    const so=String(r.so||'').trim();
    const orderT=reportMonthDateValue(r.soDate);
    const invoiceT=reportMonthDateValue(r.invoiceDate);
    const deal=String(r.dealType||'').trim().toUpperCase();
    const itemType=String(r.itemType||'').trim().toUpperCase().replace(/\s+/g,' ');
    const materialNo=String(r.materialNo||'').trim().toUpperCase();
    const qty=Number(String(r.qty??'').replace(/,/g,'').trim());

    if(inMonth(orderT) && so) x.soOpened.add(so);
    if(inMonth(invoiceT) && so){
      x.bookedSO.add(so);
      if(deal==='PAID' || deal.includes('PAID')) x.paidSO.add(so);
      x.rows++;
      if(r.vehicle) x.vehicles.add(r.vehicle);
      if(!soDetails.has(so)) soDetails.set(so,{so,coco,dealType:r.dealType||'',vehicle:r.vehicle||'',soDate:r.soDate||'',invoiceDate:r.invoiceDate||'',incident:r.incident||''});
    }

    // Labour is ONLY the DMS G/L Account line quantity.
    // Do not use local technician work timers.
    if(inMonth(invoiceT) && itemType==='G/L ACCOUNT' && Number.isFinite(qty)) x.laborHours+=qty;
  });

  const cocos=[...map.values()].sort((a,b)=>a.coco.localeCompare(b.coco));
  const totals={soOpened:0,paidSO:0,bookedSO:0,laborHours:0,rows:0,vehicles:0};
  const all={soOpened:new Set(),paidSO:new Set(),bookedSO:new Set(),vehicles:new Set()};
  cocos.forEach(x=>{
    x.soOpened=[...x.soOpened];
    x.paidSO=[...x.paidSO];
    x.bookedSO=[...x.bookedSO];
    x.soOpened.forEach(z=>all.soOpened.add(z));
    x.paidSO.forEach(z=>all.paidSO.add(z));
    x.bookedSO.forEach(z=>all.bookedSO.add(z));
    x.vehicles.forEach(z=>all.vehicles.add(z));
    totals.laborHours+=x.laborHours;
    totals.rows+=x.rows;
  });
  totals.soOpened=all.soOpened.size;
  totals.paidSO=all.paidSO.size;
  totals.bookedSO=all.bookedSO.size;
  totals.vehicles=all.vehicles.size;
  return {cocos,totals,soDetails:[...soDetails.values()]};
}

function excelSafe(v){
  if(v===undefined || v===null) return '';
  if(v instanceof Date) return v;
  if(typeof v==='object'){
    try{return JSON.stringify(v);}
    catch(e){return String(v);}
  }
  return v;
}
function flattenRecord(obj){
  const out={};
  Object.keys(obj||{}).forEach(k=>out[k]=excelSafe(obj[k]));
  return out;
}
