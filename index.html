        if(!await persistWorkflow(v,'ASSIGN VEHICLE',nowISO(),{bay,incidentNumber:inc,responsibleTechnician:v.responsibleTechnician,supportingTechnicians:v.supportingTechnicians||[]})) return;
        toast('Vehicle assigned and saved successfully');
        close();
        render();
      });

      // Search and add more complaints ONLY from WM master Complaint List.
      const jobSearch=document.getElementById(`jobComplaintSearch_${v.id}`);
      if(jobSearch){
        const drawJobComplaints=()=>{
          const q=jobSearch.value.trim().toLowerCase();
          const master=[...new Set((DATA.settings?.complaintList||[]).map(x=>String(x).trim()).filter(Boolean))];
          const existing=vehicleComplaints(v).map(c=>c.text.toLowerCase());
          const box=document.getElementById(`jobComplaintResults_${v.id}`);
          // Keep the complaint master hidden until the user actually searches.
          // Only matching complaints are shown; selected complaints remain in the
          // vehicle's complaint list above.
          if(!q){
            if(box) box.innerHTML='';
            return;
          }
          const matches=master.filter(x=>!existing.includes(x.toLowerCase()) && x.toLowerCase().includes(q)).slice(0,15);
          if(box) box.innerHTML=matches.map(x=>`<button type="button" class="master-result" data-add-job-complaint="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('') || '<small style="color:var(--muted)">No matching master complaints.</small>';
          box?.querySelectorAll('[data-add-job-complaint]').forEach(b=>b.addEventListener('click',async()=>{
            vehicleComplaints(v).push({id:uid(),text:b.dataset.addJobComplaint,status:'',pendingReason:'',remark:'',resolvedAt:null,resolvedBy:null,workStartedAt:null});
            v.complaint=vehicleComplaints(v).map(c=>c.text).join(' | ');
            await saveData(); jobSearch.value=''; drawJobComplaints();
            const box2=document.querySelector('#vehicleJobModal .complaint-list-scroll');
            if(box2) box2.outerHTML=renderVehicleComplaints(v);
          }));
        };
        jobSearch.addEventListener('input',drawJobComplaints); drawJobComplaints();
      }

      document.getElementById(`workStart_${v.id}`)?.addEventListener('click',async()=>{
        const role=String(currentUser?.role||'').trim();
        if(role==='Technician' && String(v.responsibleTechnicianId)!==String(currentUser.id)){toast('Only Responsible Technician can start work');return;}
        if(!['Technician','Workshop Manager'].includes(role)){toast('You do not have permission to start work');return;}
        if(!v.assignedAt){toast('Vehicle must be assigned first');return;}
        if(v.hold){toast('Vehicle is on HOLD');return;}
        if(hasActiveWorkSegment(v)){toast('WORK TIMER IS ALREADY RUNNING');return;}
        const started=nowISO();
        if(!startWorkSegment(v,started)){toast('WORK TIMER IS ALREADY RUNNING');return;}
        vehicleComplaints(v).forEach(c=>{if(!c.workStartedAt)c.workStartedAt=started;});
        v.currentStatus='WIP';
        if(!await persistWorkflow(v,'START WORK',started,{segmentStart:started})) return;
        toast('WORK STARTED — WIP');close();render();
      });

      const saveComplaintState=async(idx)=>{
        const c=vehicleComplaints(v)[idx]; if(!c)return;
        const st=document.getElementById(`vc_status_${v.id}_${idx}`)?.value||'';
        const reason=document.getElementById(`vc_reason_${v.id}_${idx}`)?.value||'';
        const remark=document.getElementById(`vc_action_${v.id}_${idx}`)?.value.trim()||'';
        if(!st){toast('Complaint status is mandatory');return;}
        if(st==='PENDING' && !reason){toast('Pending reason is mandatory');return;}
        c.status=st;c.pendingReason=st==='PENDING'?reason:'';
        c.remark=remark;
        if(st==='RESOLVED'){c.resolvedAt=nowISO();c.resolvedBy=whoTag();}
        else {c.resolvedAt=null;c.resolvedBy=null;}
        await saveData();toast('Complaint updated');
        const box=modal.querySelector('.complaint-list-scroll');if(box)box.outerHTML=renderVehicleComplaints(v);
      };
      modal?.addEventListener('click',async(e)=>{
        const b=e.target.closest(`[data-save-complaint="${v.id}"]`);
        if(b){
          if(!assignedToVehicle(v,currentUser?.id) && currentUser?.role!=='Workshop Manager'){return;}
          await saveComplaintState(Number(b.dataset.complaintIndex)); return;
        }
        if(e.target.closest(`#saveVehicleRemark_${v.id}`)){
          if(!assignedToVehicle(v,currentUser?.id) && currentUser?.role!=='Workshop Manager')return;
          v.workRemark=document.getElementById(`vehicleRemark_${v.id}`)?.value.trim()||'';
          await saveData();toast('Remark saved');return;
        }
        if(e.target.closest(`#copyDriverFeedback_${v.id}`)){
          if(currentUser?.role!=='Workshop Manager' && currentUser?.role!=='Service Advisor')return;
          await sendDriverFeedbackCopy(v);
          return;
        }
        if(e.target.closest(`#workDone_${v.id}`)){
          if(currentUser?.role!=='Workshop Manager' && !assignedToVehicle(v,currentUser?.id))return;
          if(v.hold || !hasActiveWorkSegment(v)){toast('Work is not actively running. Resume the job before WORK DONE.');return;}
          if(v.workDoneAt || v.rfdAt){toast('This job is already completed.');return;}
          if(!vehicleWorkDoneAllowed(v)){toast('Complete every complaint or give a pending reason');return;}
          const t=nowISO();
          closeActiveWorkSegment(v,t);
          v.workDoneAt=t;
          v.workDoneBy=whoTag();
          v.workStartedAt=null;
          v.currentStatus='WORK DONE';
          v.workTimerFinishedAt=t;
          v.workTimerFinishedDuration=vehicleWorkElapsed(v);
          driverFeedbackToken(v);
          if(!await persistWorkflow(v,'WORK DONE',t,{finalWorkTime:v.workTimerFinishedDuration,workDoneAt:t})) return;
          toast(`WORK DONE — final work time ${v.workTimerFinishedDuration}`);close();render();return;
        }
        if(e.target.closest(`#holdVehicleJob_${v.id}`)){
          if(currentUser?.role!=='Workshop Manager' && !assignedToVehicle(v,currentUser?.id))return;
          if(v.hold || !hasActiveWorkSegment(v) || v.workDoneAt || v.rfdAt){toast('No active work timer to put on HOLD.');return;}
          // Use a safe default so HOLD works reliably on Android/WebView where prompt dialogs may be blocked.
          let reason='WORK HOLD';
          try{ const entered=window.prompt('Hold reason (optional):', v.holdReason||'WORK HOLD'); if(entered!==null && String(entered).trim()) reason=String(entered).trim(); }catch(err){}
          const t=nowISO();
          closeActiveWorkSegment(v,t);
          v.hold=true;
          v.holdAt=t;
          v.holdBy=whoTag();
          v.holdReason=reason.trim();
          v.holdStartedWorkAt=v.workStartedAt||v.holdStartedWorkAt||t;
          v.workStartedAt=null;
          v.currentStatus='HOLD';
          if(!await persistWorkflow(v,'HOLD WORK',t,{holdReason:v.holdReason,holdAt:t,workTime:vehicleWorkElapsed(v)})) return;
          toast(`WORK PAUSED — timer stopped at ${vehicleWorkElapsed(v)}`);close();render();return;
        }
        if(e.target.closest(`#resumeHeld_${v.id}`)){
          if(!['Service Advisor','Workshop Manager'].includes(currentUser?.role))return;
          if(!v.hold || v.workDoneAt || v.rfdAt){toast('Vehicle is not in a resumable HOLD state.');return;}
          if(hasActiveWorkSegment(v)){toast('WORK TIMER IS ALREADY RUNNING');return;}
          const bay=prompt('Parking / Bay for resumed vehicle:',v.allocatedBay||'');
          if(!bay?.trim()){toast('Parking / Bay is required');return;}
          v.allocatedBay=bay.trim();
          const resumed=nowISO();
          v.hold=false;
          v.holdReleasedAt=resumed;
          v.holdReleasedBy=whoTag();
          // Resume creates a new work segment. Previous segments remain closed,
          // so HOLD time is excluded from the total and the live timer continues.
          if(!startWorkSegment(v,resumed)){toast('Unable to resume — active work timer already exists');return;}
          if(!await persistWorkflow(v,'UNHOLD / RESUME',resumed,{holdReleasedAt:resumed,bay:v.allocatedBay||''})) return;
          toast(`WORK RESUMED — timer continues from ${vehicleWorkElapsed(v)}`);close();render();return;
        }
        if(e.target.closest(`#rfd_${v.id}`)){
          if(!['Service Advisor','Workshop Manager'].includes(currentUser?.role))return;
          if(!v.workDoneAt || v.hold || hasActiveWorkSegment(v)){toast('RFD is available only after WORK DONE and a stopped timer.');return;}
          const inc=document.getElementById(`incidentFinal_${v.id}`)?.value.trim()||v.incidentNumber||'';
          if(!/^\d{6}$/.test(inc)){toast('Incident No. must be exactly 6 digits');return;}
          if(!vehicleWorkDoneAllowed(v)){toast('Pending complaint needs a reason before RFD');return;}
          const rfdAt=nowISO();
          v.incidentNumber=inc;v.rfdAt=rfdAt;v.rfdBy=whoTag();v.currentStatus='RFD';
          if(!await persistWorkflow(v,'RFD',rfdAt,{incidentNumber:inc,rfdAt})) return;
          toast('RFD completed');close();render();return;
        }
        if(e.target.closest(`#reassignVehicle_${v.id}`)){
          if(!['Service Advisor','Workshop Manager'].includes(currentUser?.role))return;
          const resumed=nowISO();v.rfdAt=null;v.rfdBy=null;v.workDoneAt=null;
          if(!startWorkSegment(v,resumed)){toast('Unable to resume — active work timer already exists');return;}
          if(!await persistWorkflow(v,'RE-ASSIGN / RESUME',resumed,{fromRFD:true})) return;
          toast('Work resumed — timer continues from previous segments');close();render();return;
        }
        if(e.target.closest(`#releaseVehicle_${v.id}`)){
          if(!['Service Advisor','Workshop Manager'].includes(currentUser?.role))return;
          if(!vehicleCanRelease(v)){toast('Complete billing/payment and enter a valid 6-digit incident number before RFD');return;}
          const releasedAt=nowISO();
          v.releaseAt=releasedAt;v.releaseBy=whoTag();v.currentStatus='WAITING FOR OUT';
          if(!await persistWorkflow(v,'RELEASE TO SECURITY',releasedAt,{releaseAt:releasedAt})) return;
          toast('Vehicle released — WAITING FOR OUT');close();render();return;
        }
        if(e.target.closest(`#gateOutFromJob_${v.id}`)){
          if(!['Security Guard','Workshop Manager'].includes(currentUser?.role)){toast('Security Guard / Workshop Manager permission required');return;}
          if(isVehicleHeld(v)){toast('Vehicle is on HOLD');return;}
          if(v.currentStatus!=='WAITING FOR OUT' || !v.releaseAt){toast('Vehicle must be released to Security first');return;}
          if(v.status==='OUT'){toast('Vehicle is already OUT');return;}
          const outAt=nowISO();
          v.outTime=outAt;v.outLoggedBy=whoTag();v.status='OUT';v.currentStatus='OUT';
          if(!await persistWorkflow(v,'GATE OUT',outAt,{outTime:outAt,releaseAt:v.releaseAt})) return;
          toast('Vehicle marked OUT');close();render();return;
        }
      });
      modal?.addEventListener('change',async(e)=>{
        const control=e.target.closest(`select[id^="vc_status_"],select[id^="vc_reason_"]`);
        if(!control)return;
        const id=control.id, parts=id.split('_'), idx=Number(parts[parts.length-1]);
        const c=vehicleComplaints(v)[idx]; if(!c)return;
        const st=document.getElementById(`vc_status_${v.id}_${idx}`)?.value||'';
        const reason=document.getElementById(`vc_reason_${v.id}_${idx}`)?.value||'';
        c.status=st;
        c.pendingReason=st==='PENDING'?reason:'';
        await saveData();
        const box=modal.querySelector('.complaint-list-scroll');if(box)box.outerHTML=renderVehicleComplaints(v);
      });

      }catch(err){
        console.error('Manage Job error:',err);
        toast((err && err.message) ? 'Manage Job error: '+err.message : 'Unable to open Manage Job');
      }
    });
  });

  // If the app was opened/refreshed on a Manage Job URL, open that job as a page.

  if(notificationBtn) notificationBtn.addEventListener('click',()=>{
    document.getElementById('notificationPanel')?.remove();
    document.body.insertAdjacentHTML('beforeend',renderNotificationPanel());
    const panel=document.getElementById('notificationPanel');
    bindNotificationCalendar(panel);
    const close=()=>panel?.remove();
    document.getElementById('notificationClose')?.addEventListener('click',close);
    panel?.addEventListener('click',e=>{if(e.target===panel)close();});
    document.querySelectorAll('[data-leave-view]').forEach(btn=>btn.addEventListener('click',()=>{
      document.getElementById('employeeOffModal')?.remove(); document.body.insertAdjacentHTML('beforeend',renderEmployeeOffModal(btn.dataset.leaveView));
      const m=document.getElementById('employeeOffModal'); document.getElementById('closeEmployeeOff')?.addEventListener('click',()=>m?.remove()); m?.addEventListener('click',ev=>{if(ev.target===m)m.remove();});

    document.querySelectorAll('[data-leave-action]').forEach(btn=>btn.addEventListener('click',()=>{
      const id=btn.dataset.leaveId, action=btn.dataset.leaveAction; document.getElementById('leaveDecisionModal')?.remove(); document.body.insertAdjacentHTML('beforeend',renderLeaveDecisionModal(id,action));
      const m=document.getElementById('leaveDecisionModal'); document.getElementById('decisionCancel')?.addEventListener('click',()=>m?.remove());
      document.getElementById('decisionViewOff')?.addEventListener('click',()=>{m?.remove();document.getElementById('employeeOffModal')?.remove();document.body.insertAdjacentHTML('beforeend',renderEmployeeOffModal((DATA.leaves||[]).find(x=>x.id===id)?.staffId));const om=document.getElementById('employeeOffModal');document.getElementById('closeEmployeeOff')?.addEventListener('click',()=>om?.remove());});
      document.getElementById('decisionConfirm')?.addEventListener('click',async()=>{
        const l=(DATA.leaves||[]).find(x=>x.id===id); if(!l)return;
        const oldStatus=l.status, oldRemark=l.rejectionRemark, nextStatus=action==='approve'?'APPROVED':'REJECTED';

        l.status=nextStatus; l.decidedAt=nowISO(); l.decidedBy=whoTag();

        if(!saved){l.status=oldStatus; l.rejectionRemark=oldRemark; return;}
        // Keep the decision in the local state and refresh the open panel immediately.
        // Do not call readRemote() here: a concurrent realtime/poll refresh can re-apply an older snapshot.
        m?.remove();
        toast(action==='approve'?'Leave accepted — status updated':'Leave rejected — status updated');
        const panel=document.getElementById('notificationPanel');
        if(panel){
          const month=panel.querySelector('[data-calendar-month]')?.getAttribute('data-calendar-month')||'';

          const md=parts.length===2?new Date(Number(parts[0]),Number(parts[1])-1,1):new Date();

          if(wrap)wrap.innerHTML=pendingNow.length?pendingNow.map(leaveRequestCard).join(''):emptyBlock('✓','No new leave applications.');
          const cw=panel.querySelector('#notificationCalendarWrap'); if(cw)cw.innerHTML=notificationCalendar(md);
          bindNotificationCalendar(panel);

        updateNotificationBadge();

  /* Security complaint picker: selected complaints stay as a clean vertical list.
     A fresh search box appears below the last selected complaint. Results only
     appear after typing and are shown one-per-line. */
  const complaintRows=document.getElementById('vehicleComplaintSearchRows');
  const complaintSelected=document.getElementById('vehicleComplaintSelected');
  if(complaintRows){
    const allComplaints=()=>[...new Set((Array.isArray(DATA.settings?.complaintList)?DATA.settings.complaintList:[])
      .map(x=>String(x).trim()).filter(Boolean))];

    const renderVehicleComplaintPicker=()=>{
      complaintRows.innerHTML='';

      selectedVehicleComplaints.forEach((value,index)=>{
        const row=document.createElement('div');
        row.className='selected-complaint-row';
        row.innerHTML=`<span class="complaint-number">${index+1}.</span>
          <span class="complaint-text">${escapeHtml(value)}</span>
          <button type="button" class="remove-complaint" data-remove-complaint="${index}" aria-label="Remove complaint">×</button>`;
        complaintRows.appendChild(row);
      });

      const row=document.createElement('div');
      row.className='complaint-search-row';
      row.innerHTML=`<input class="vehicle-complaint-search" placeholder="${selectedVehicleComplaints.length?'Search complaint  '+(selectedVehicleComplaints.length+1)+' from master list...':'Type complaint to search master list...'}" autocomplete="off">
        <div class="master-search-results complaint-search-results"></div>`;
      complaintRows.appendChild(row);

      const input=row.querySelector('input');
      const results=row.querySelector('.complaint-search-results');

      const update=()=>{
        const q=input.value.trim().toLowerCase();
        if(!q){ results.innerHTML=''; return; }
        const matches=allComplaints()
          .filter(x=>!selectedVehicleComplaints.some(sel=>sel.toLowerCase()===x.toLowerCase()) && x.toLowerCase().includes(q))
          .slice(0,15);
        results.innerHTML=matches.length
          ? matches.map(x=>`<button type="button" class="master-result" data-pick-complaint="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('')
          : '<div class="complaint-picker-empty">No matching complaints found.</div>';
        results.querySelectorAll('[data-pick-complaint]').forEach(btn=>btn.addEventListener('click',()=>{
          const value=btn.dataset.pickComplaint;
          if(value && !selectedVehicleComplaints.some(x=>x.toLowerCase()===value.toLowerCase())){
            selectedVehicleComplaints.push(value);
          }
          renderVehicleComplaintPicker();
          const inputs=complaintRows.querySelectorAll('.vehicle-complaint-search');
          inputs[inputs.length-1]?.focus();
        }));
      };

      input.addEventListener('input',update);
      input.addEventListener('keydown',e=>{if(e.key==='Escape'){input.value='';results.innerHTML='';}});
      row.querySelectorAll('[data-remove-complaint]').forEach(btn=>btn.addEventListener('click',()=>{
        selectedVehicleComplaints.splice(Number(btn.dataset.removeComplaint),1);
        renderVehicleComplaintPicker();
        const inputs=complaintRows.querySelectorAll('.vehicle-complaint-search');
        inputs[inputs.length-1]?.focus();
      }));
    };

    // Keep the legacy selected container empty; the vertical list is rendered in the picker.

  /* Vehicle number lookup: if this vehicle has visited before, fetch the latest
     driver contact/name automatically. Fields remain editable. */
  const vNo=document.getElementById('v_no');
  const vPhone=document.getElementById('v_phone');
  const vDriver=document.getElementById('v_driver');
  if(vNo){
    let lookupTimer;
    let lastDuplicatePopupNo='';
    const duplicateMsg=document.getElementById('vehicleDuplicateMsg');
    const duplicateModal=document.getElementById('duplicateVehicleModal');
    const duplicateText=document.getElementById('duplicateVehicleText');
    const duplicateClose=document.getElementById('duplicateVehicleClose');
    const isOpenVehicleTicket=(no)=>{
      const normalized=String(no||'').trim().toUpperCase();
      if(!normalized) return null;
      return (DATA.vehicles||[]).find(v=>!isVehicleDeleted(v)
        && String(v.vehicleNo||'').trim().toUpperCase()===normalized
        && v.status!=='OUT' && v.currentStatus!=='OUT');
    };
    const checkVehicleDuplicate=()=>{
      const no=vNo.value.trim().toUpperCase();
      const duplicate=isOpenVehicleTicket(no);
      vNo.classList.toggle('vehicle-number-duplicate',!!duplicate);
      duplicateMsg?.classList.toggle('show',!!duplicate);
      const submitBtn=vNo.form?.querySelector('button[type="submit"]');
      if(submitBtn) submitBtn.disabled=!!duplicate;
      if(duplicate && no!==lastDuplicatePopupNo){
        lastDuplicatePopupNo=no;

/* ---------------- DRIVER FEEDBACK ---------------- */
const DRIVER_FEEDBACK_TABLE = 'driver_feedback';

function driverFeedbackToken(v){
  if(!v.driverFeedbackToken){
    v.driverFeedbackToken = (crypto && crypto.randomUUID) ? crypto.randomUUID() : ('fb_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));
  }
  return v.driverFeedbackToken;
}
// A driver feedback link must be HTTPS-hosted to work on the driver's phone.
// When COCO FLOW is opened from Android content://, there is no shareable public URL.
// Set this constant after hosting the same HTML at an HTTPS address.
const DRIVER_FEEDBACK_PUBLIC_BASE_URL = '';
function driverFeedbackBaseUrl(){
  if(DRIVER_FEEDBACK_PUBLIC_BASE_URL) return DRIVER_FEEDBACK_PUBLIC_BASE_URL.replace(/\?$/,'');
  if(/^https?:$/i.test(location.protocol)) return location.href.split('#')[0].split('?')[0];
  return '';
}

function driverFeedbackLink(v){
  const token = driverFeedbackToken(v);
  const base = driverFeedbackBaseUrl();
  if(!base) return '';
  const p = new URLSearchParams();
  p.set('driverFeedback', token);
  return base+'?'+p.toString();
}
function driverFeedbackMessage(v, link){
  return `COCO FLOW – Driver Feedback\n\nDear ${v.driverName||'Driver'}, your vehicle ${v.vehicleNo||''} work has been completed.\nPlease share your feedback about the service received.\n\nFeedback Link:\n${link}\n\nThank you – COCO FLOW`;
}
function driverFeedbackPhone(v){
  return String(v.driverPhone||v.phone||'').replace(/[^\d+]/g,'');
}
function driverFeedbackWhatsApp(v){
  const phone=driverFeedbackPhone(v);
  const link=driverFeedbackLink(v);
  const msg=driverFeedbackMessage(v,link);
  return 'https://wa.me/'+phone.replace(/^\+/,'')+'?text='+encodeURIComponent(msg);
}
function driverFeedbackSms(v){
  const phone=driverFeedbackPhone(v);
  const link=driverFeedbackLink(v);
  const msg=driverFeedbackMessage(v,link);
  return 'sms:'+phone+'?body='+encodeURIComponent(msg);
}
function driverFeedbackHtml(v){
  if(!v.workDoneAt) return '';
  const phone=driverFeedbackPhone(v);
  const link=driverFeedbackLink(v);
  const status=v.driverFeedbackSubmittedAt
    ? `Received ${fmtTime(v.driverFeedbackSubmittedAt)} · Rating: ${v.driverFeedbackRating||'—'}/5`
    : 'Not yet received';
  return `<div class="driver-feedback-box">
    <div class="driver-feedback-head">
      <span class="driver-feedback-title">DRIVER FEEDBACK</span>
      <span class="badge stage">${v.driverFeedbackSubmittedAt?'RECEIVED':'PENDING'}</span>
    </div>
    <div class="driver-feedback-status">${escapeHtml(status)}</div>
    <div class="driver-feedback-actions">
      ${phone && link ? `<a class="btn btn-green" href="${escapeHtml(driverFeedbackWhatsApp(v))}" target="_blank" rel="noopener">WHATSAPP</a>` : ''}
      ${phone && link ? `<a class="btn btn-blue" href="${escapeHtml(driverFeedbackSms(v))}">SMS</a>` : ''}
      ${link ? `<button type="button" class="btn-ghost" id="copyDriverFeedback_${v.id}">COPY LINK</button>` : ''}
    </div>
    ${!link ? '<small style="color:var(--red);display:block;margin-top:8px;">Feedback link is not active while COCO FLOW is opened from a local Android file. Host the app at an HTTPS address first.</small>' : (phone ? '' : '<small style="color:var(--red);display:block;margin-top:8px;">Driver phone number is missing. Add the number before sending feedback.</small>')}
  </div>`;
}
async function sendDriverFeedbackCopy(v){
  const link=driverFeedbackLink(v);
  if(!link){toast('Feedback link is not active until COCO FLOW is hosted at an HTTPS web address');return;}
  try{
    await navigator.clipboard.writeText(link);
    toast('Driver feedback link copied');
  }catch(e){
    prompt('Copy driver feedback link:',link);
  }
}
async function ensureDriverFeedbackSupabase(){
  if(window.supabase?.createClient) return window.supabase;
  await loadExternalScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js','supabase',12000);
  if(!window.supabase?.createClient) throw new Error('Feedback connection library unavailable');
  return window.supabase;
}
async function saveDriverFeedbackPublic(payload){
  const sb=await ensureDriverFeedbackSupabase();
  const client=sb.createClient(DEFAULT_SUPABASE_URL,DEFAULT_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false}});
  const {error}=await client.from(DRIVER_FEEDBACK_TABLE).insert(payload);
  if(error) throw error;
}

      <select id="driverFeedbackQuality"><option value="">Select</option><option value="EXCELLENT">Excellent</option><option value="GOOD">Good</option><option value="AVERAGE">Average</option><option value="POOR">Poor</option></select>
    </div>
    <div class="field"><label>Comments / Suggestions</label><textarea id="driverFeedbackComment" rows="4" maxlength="1000" placeholder="Tell us what went well or what we should improve..."></textarea></div>
    <div id="driverFeedbackError"></div>
    <button type="button" class="btn btn-primary driver-feedback-submit" id="driverFeedbackSubmit">SUBMIT FEEDBACK</button>`;

    host.querySelectorAll('[data-feedback-rating]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        rating=Number(btn.dataset.feedbackRating);
        host.querySelectorAll('[data-feedback-rating]').forEach(x=>x.classList.toggle('selected',Number(x.dataset.feedbackRating)===rating));
      });
    });
    document.getElementById('driverFeedbackSubmit').addEventListener('click',async()=>{
      const err=document.getElementById('driverFeedbackError');
      const resolved=document.getElementById('driverFeedbackResolved').value;
      if(!rating){err.innerHTML='<div class="driver-feedback-error">Please select an overall rating.</div>';return;}
      if(!resolved){err.innerHTML='<div class="driver-feedback-error">Please tell us whether your issue was resolved.</div>';return;}
      const btn=document.getElementById('driverFeedbackSubmit');
      btn.disabled=true; btn.textContent='SUBMITTING...'; err.innerHTML='';
      try{
        await saveDriverFeedbackPublic({
          token,
          vehicle_id:null,
          vehicle_no:vehicle,
          driver_name:driver,
          incident_no:incident,
          rating,
          issue_resolved:resolved,
          technician_behaviour:document.getElementById('driverFeedbackTechnician').value||null,
          repair_quality:document.getElementById('driverFeedbackQuality').value||null,
          comments:document.getElementById('driverFeedbackComment').value.trim()||null,
          submitted_at:new Date().toISOString()
        });
        host.innerHTML=`<div class="driver-feedback-thanks">
          <div style="font-size:40px;">✓</div>
          <h2>Thank You</h2>
          <p style="color:var(--muted);">Your feedback has been submitted successfully.</p>
          <p style="font-size:12px;color:var(--muted);">COCO FLOW Workshop</p>
        </div>`;
      }catch(e){
        console.error(e);
        btn.disabled=false; btn.textContent='SUBMIT FEEDBACK';
        err.innerHTML='<div class="driver-feedback-error">Feedback could not be submitted. The feedback table/policy may not be configured yet.</div>';
      }
    });
  };
  renderForm();
  return true;
}

<script id="clean-login-controller">
(function(){
  function loadCachedWorkshopData(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const parsed=JSON.parse(raw);
      if(!parsed || typeof parsed!=='object') return false;
      normalizeData(parsed);
      return Array.isArray(DATA.staff) && DATA.staff.length>0;
    }catch(e){ console.warn('Local workshop cache unavailable',e); return false; }
  }

  async function doCleanLogin(){
    const idEl=document.getElementById('cleanLoginId');
    const passEl=document.getElementById('cleanLoginPassword');
    const err=document.getElementById('cleanLoginError');
    const button=document.getElementById('cleanLoginButton');
    const id=(idEl?.value||'').trim().replace(/\D/g,'');
    const pass=passEl?.value||'';
    if(err) err.textContent='';
    if(!id||!pass){ if(err) err.textContent='Enter Login ID and Password.'; return; }

    // The clean login screen is the real login now. Do not depend on a
    // hidden/secondary form elsewhere in the page.
    if(storageStatus!=='ok'){
      if(button) button.disabled=true;
      if(err) err.textContent='Connecting to workshop…';
      try{
        await loadData(true);
      }catch(e){}
      if(storageStatus!=='ok'){
        if(loadCachedWorkshopData()){
          storageStatus='offline';
          if(err) err.textContent='Cloud unavailable. Using saved workshop data on this device.';
        }else{
          if(button) button.disabled=false;
          if(err && !err.textContent) err.textContent='Workshop cloud connection failed. Please check internet and try again.';
          return;
        }
      } else if(err) err.textContent='';
    }

    const staff=(DATA.staff||[]).find(s=>{
      if(!s) return false;
      const role=String(s.position||s.role||'').trim();
      const phone=String(s.phone||s.mobile||s.loginId||'').replace(/\D/g,'');
      return ROLES.includes(role) && phone===id;
    });
    if(!staff){ if(err) err.textContent='Mobile number not found. Check the registered mobile number.'; return; }

    const defaultPassword=id.length>=6 ? id.slice(-6) : id;
    const expectedPassword=String(staff.password ?? defaultPassword);
    if(String(pass)!==expectedPassword){ if(err) err.textContent='Incorrect password.'; return; }

    const staffRole=String(staff.position||staff.role||'').trim();
    currentUser={
      id:staff.id,
      name:staff.name,
      role:staffRole,
      phone:staff.phone||staff.mobile||staff.loginId||'',
      loginPhone:id
    };

    if(button) button.disabled=true;
    try{
      await saveSession();
      document.body.classList.remove('clean-login-active');
      const screen=document.getElementById('cleanLoginScreen');
      if(screen) screen.style.display='none';
      render();
    }catch(e){
      console.error(e);
      currentUser=null;
      if(button) button.disabled=false;
      if(err) err.textContent=(e&&e.message)?e.message:'Login failed. Please try again.';
    }
  }

  const button=document.getElementById('cleanLoginButton');
  const password=document.getElementById('cleanLoginPassword');
  if(button) button.addEventListener('click',doCleanLogin);
  if(password) password.addEventListener('keydown',e=>{if(e.key==='Enter') doCleanLogin();});
})();
</script>

<script id="coco-security-guard-access-fix">
(function(){
  function isSecurityGuard(emp){
    const text = [
      emp?.role, emp?.position, emp?.designation, emp?.employeeRole,
      emp?.department, emp?.employee_type, emp?.employeeType, emp?.name
    ].map(x=>String(x||'').toLowerCase()).join(' ');
    return /\bsecurity\b|\bsecurity guard\b|\bguard\b/.test(text);
  }

  function getSecurityGuards(){
    const a = Array.isArray(DATA?.staff) ? DATA.staff : [];
    return a.filter(isSecurityGuard);
  }

  function guardId(g){
    return String(g?.id || g?.employee_id || g?.employeeCode || g?.code || g?.name || '');
  }

  function ensureDutyStore(){
    if(!DATA) return {};
    if(!DATA.securityDuty || typeof DATA.securityDuty !== 'object' || Array.isArray(DATA.securityDuty)){
      DATA.securityDuty = {};
    }
    return DATA.securityDuty;
  }

  window.cocoIsSecurityGuard = isSecurityGuard;

  window.cocoSetSecurityDuty = async function(guard, action){
    if(!guard || !isSecurityGuard(guard)) return false;
    action = String(action||'').toUpperCase();
    if(!['IN','OUT'].includes(action)) return false;

    const id = guardId(guard);
    if(!id) return false;

    const store = ensureDutyStore();
    const now = new Date().toISOString();
    const old = store[id] || {};
    store[id] = {
      ...old,
      employee_id:id,
      employee_name:guard.name || guard.employee_name || 'Security Guard',
      phone:guard.phone || guard.mobile || guard.loginId || guard.loginPhone || '',
      status: action==='IN' ? 'ON DUTY' : 'OFF DUTY',
      inAt: action==='IN' ? now : (old.inAt || null),
      outAt: action==='OUT' ? now : null,
      lastAction: action,
      lastUpdatedAt: now,
      updatedBy: currentUser ? currentUser.name : 'Security Guard'
    };

    try{
      if(typeof window.saveData === 'function') await window.saveData();
      if(typeof window.render === 'function') window.render();
    }catch(e){
      console.error('Security duty save failed:', e);
      return false;
    }

    window.cocoRefreshSecurityCallPanel?.();
    return true;
  };

  window.cocoGetAvailableSecurityGuards = function(){
    const store = ensureDutyStore();
    const guards = getSecurityGuards();
    return guards.filter(g=>{
      const d = store[guardId(g)];
      const punch = (()=>{ try { return typeof window.staffPunchRecords==='function' ? window.staffPunchRecords(g).find(e=>!e?.outTime && String(e?.status||'').toUpperCase()==='IN') : (DATA.employees||[]).find(e=>(e?.staffId===g?.id || e?.empName===g?.name) && !e?.outTime && String(e?.status||'').toUpperCase()==='IN'); } catch(e){ return null; } })();
      return !!(punch || (d && d.status==='ON DUTY' && d.lastAction==='IN'));
    });
  };

  // Emergency contacts. Set the nearest hospital number here when your site number is available.
  window.COCO_EMERGENCY_CONTACTS = window.COCO_EMERGENCY_CONTACTS || { hospital:'', fire:'101' };

  window.cocoRefreshSecurityCallPanel = function(){
    const p=document.getElementById('cocoSecurityCallPanel');
    if(!p) return;
    const list=p.querySelector('#cocoSecList');
    if(!list) return;

    const staffList=Array.isArray(DATA?.staff)?DATA.staff:[];
    const employees=Array.isArray(DATA?.employees)?DATA.employees:[];
    const store=ensureDutyStore();
    const settings=(DATA?.settings && typeof DATA.settings==='object') ? DATA.settings : {};
    const saved=(settings.emergencyContacts && typeof settings.emergencyContacts==='object') ? settings.emergencyContacts : {};
    const norm=v=>String(v??'').trim();
    const digits=v=>norm(v).replace(/\D/g,'');
    const roleText=x=>[x?.role,x?.position,x?.designation,x?.employeeRole,x?.employee_type,x?.employeeType].map(norm).join(' ');
    const isSG=x=>/security\s*guard|security|guard/i.test(roleText(x)+' '+norm(x?.name));
    const isWM=x=>/workshop\s*manager/i.test(roleText(x)) || norm(x?.role).toUpperCase()==='WM';
    const personName=x=>norm(x?.name||x?.employee_name||x?.empName||x?.staffName||'');
    const personId=x=>norm(x?.id||x?.employee_id||x?.staffId||x?.employeeCode||x?.code||'');

    // Find a phone number regardless of which field the old/new staff record uses.
    const phoneOf=(obj)=>{
      const seen=new Set();
      const preferred=/(phone|mobile|contact|telephone|tel|whatsapp|cell)/i;
      const blocked=/(password|pass|pin|otp|incident|vehicle|staffid|employee.?id|^id$|code)/i;
      const walk=(v,key='')=>{
        if(v===null||v===undefined) return '';
        if(typeof v==='string'||typeof v==='number'){
          const raw=norm(v), d=digits(raw);
          if(blocked.test(key)) return '';
          if(preferred.test(key) && d.length>=7 && d.length<=15) return raw;
          if(/^\+?91[\s-]?\d{10}$/.test(raw) || /^\d{10}$/.test(d)) return raw;
          return '';
        }
        if(typeof v!=='object'||seen.has(v)) return '';
        seen.add(v);
        const keys=Object.keys(v);
        for(const k of keys){ if(preferred.test(k)){ const hit=walk(v[k],k); if(hit) return hit; } }
        for(const k of keys){ if(blocked.test(k)) continue; const hit=walk(v[k],k); if(hit) return hit; }
        return '';
      };
      return walk(obj);
    };

    const samePerson=(a,b)=>{
      if(!a||!b) return false;
      const ai=personId(a), bi=personId(b);
      if(ai&&bi&&ai===bi) return true;
      const an=personName(a).toLowerCase(), bn=personName(b).toLowerCase();
      return !!an && !!bn && an===bn;
    };

    // Attendance can contain the staff phone even when the staff directory record is old.
    const attendanceFor=(person)=>employees.filter(e=>{
      if(!e) return false;
      if(person?.id!=null && norm(e.staffId)===norm(person.id)) return true;
      if(personName(e) && personName(person) && personName(e).toLowerCase()===personName(person).toLowerCase()) return true;
      const a=digits(e.staffPhone||e.phone||e.mobileNo||e.mobile);
      const b=digits(phoneOf(person));
      return !!a && !!b && a===b;
    });
    const openAttendanceFor=(person)=>attendanceFor(person).find(e=>!e.outTime && String(e.status||'').toUpperCase()==='IN') || null;

    const allSG=staffList.filter(isSG);
    const allWM=staffList.filter(isWM);
    const currentSG=isSG(currentUser) ? currentUser : null;
    const currentWM=isWM(currentUser) ? currentUser : null;
    // The login screen authenticates by mobile/Login ID. Keep that value even
    // when an older staff record has an empty phone field.
    const currentSGPhone = currentSG ? norm(currentSG.phone || currentSG.mobile || currentSG.loginId || currentSG.loginPhone || '') : '';
    const currentWMPhone = currentWM ? norm(currentWM.phone || currentWM.mobile || currentWM.loginId || currentWM.loginPhone || '') : '';

    // Prefer an actually on-duty Security Guard; otherwise use the first registered guard.
    let dutyGuard=currentSG || allSG.find(g=>openAttendanceFor(g));
    if(!dutyGuard) dutyGuard=allSG.find(g=>{
      const d=store[guardId(g)];
      return d && d.status==='ON DUTY' && d.lastAction==='IN';
    }) || allSG[0] || null;

    // If the logged-in Security Guard is not present in DATA.staff, still use the login record.
    if(!dutyGuard && currentSG) dutyGuard=currentSG;
    const dutyRec=dutyGuard ? (openAttendanceFor(dutyGuard) || attendanceFor(dutyGuard).slice(-1)[0] || null) : null;
    const dutyStore=dutyGuard ? store[guardId(dutyGuard)] : null;
    if(dutyGuard===currentSG && currentSG?.loginPhone && dutyStore && !phoneOf(dutyStore)){ dutyStore.phone=currentSG.loginPhone; }
    const dutyPhone=phoneOf(dutyGuard) || phoneOf(dutyRec) || phoneOf(dutyStore) || currentSGPhone || norm(currentSG?.loginPhone||'') || phoneOf(currentSG) || norm(saved.securityGuard?.phone||saved.security?.phone||'');
    const dutyDigits=digits(dutyPhone);

    // WM: current login is the strongest source; otherwise find the registered WM.
    const wm=currentWM || allWM[0] || employees.find(isWM) || null;
    const wmRec=wm ? (openAttendanceFor(wm) || attendanceFor(wm).slice(-1)[0] || null) : null;
    const wmPhone=phoneOf(wm) || phoneOf(wmRec) || currentWMPhone || norm(currentWM?.loginPhone||'') || phoneOf(currentWM) || norm(saved.workshopManager?.phone||saved.wm?.phone||'');
    const wmDigits=digits(wmPhone);

    // Persist the two verified login contacts so they survive old/missing directory fields.
    try{
      if(!DATA.settings || typeof DATA.settings!=='object') DATA.settings={};
      if(!DATA.settings.emergencyContacts || typeof DATA.settings.emergencyContacts!=='object') DATA.settings.emergencyContacts={};
      if(currentSG && (currentSGPhone || currentSG.loginPhone || phoneOf(currentSG))) DATA.settings.emergencyContacts.securityGuard={name:personName(currentSG)||'Security Guard',phone:currentSGPhone || norm(currentSG.loginPhone||'') || phoneOf(currentSG)};
      if(currentWM && (currentWMPhone || currentWM.loginPhone || phoneOf(currentWM))) DATA.settings.emergencyContacts.workshopManager={name:personName(currentWM)||'Workshop Manager',phone:currentWMPhone || norm(currentWM.loginPhone||'') || phoneOf(currentWM)};
    }catch(e){}

    const hospitalPhone=norm(window.COCO_EMERGENCY_CONTACTS?.hospital);
    const firePhone=norm(window.COCO_EMERGENCY_CONTACTS?.fire||'101');
    const call=(label,icon,phone,sub)=>{
      const d=digits(phone);
      return `<div class="coco-emergency-card"><div style="min-width:0;flex:1"><b>${icon} ${escapeHtml(label)}</b><small>${escapeHtml(sub||'')}</small><div class="coco-emergency-number">${phone?escapeHtml(phone):'CONTACT NUMBER NOT AVAILABLE'}</div></div>${d?`<a class="coco-sec-call" href="tel:${escapeHtml(d)}">☎ Call</a>`:''}</div>`;
    };

    const guardName=dutyGuard ? (personName(dutyGuard)||'Security Guard') : 'Security Guard';
    const wmName=wm ? (personName(wm)||'Workshop Manager') : 'Workshop Manager';
    list.innerHTML=
      call('Security Guard','🛡️',dutyPhone,dutyGuard ? `${guardName}${openAttendanceFor(dutyGuard)?' · ON DUTY':' · CONTACT'}` : 'No Security Guard registered')+
      call('Workshop Manager','👷',wmPhone,wm ? wmName : 'No Workshop Manager registered')+
      call('Nearest Hospital','🏥',hospitalPhone,'Add hospital contact number in emergency settings')+
      call('Fire Station','🚒',firePhone,'Emergency fire number');
  };

  window.cocoOpenSecurityCallPanel = function(){
    let p=document.getElementById('cocoSecurityCallPanel');
    if(!p){
      p=document.createElement('div');
      p.id='cocoSecurityCallPanel';
      p.innerHTML=`<div class="coco-sec-overlay"></div>
        <aside class="coco-sec-drawer">
          <div class="coco-sec-head">
            <b>🚨 Emergency Security Call</b>
            <button type="button" id="cocoSecClose" aria-label="Close">×</button>
          </div>
          <div class="coco-sec-sub">Emergency contacts — one duty security guard, hospital, fire station and Workshop Manager</div>
          <div id="cocoSecList"></div>
        </aside>`;
      document.body.appendChild(p);
      p.querySelector('.coco-sec-overlay').addEventListener('click',()=>p.classList.remove('open'));
      p.querySelector('#cocoSecClose').addEventListener('click',()=>p.classList.remove('open'));
    }
    window.cocoRefreshSecurityCallPanel();
    p.classList.add('open');
  };

  function injectSecurityDutyControls(){
    const user=currentUser;
    if(!user) return;

    const guards=getSecurityGuards();
    if(!guards.length) return;

    /* Only a logged-in Security Guard gets IN/OUT controls.
       Everyone else only gets the emergency call button. */
    if(String(user.role||'')!=='Security Guard') return;

    const myGuard=guards.find(g=>guardId(g)===String(user.id) || String(g.name||'')===String(user.name||''));
    if(!myGuard) return;

    if(document.getElementById('cocoMySecurityDuty')){
      updateDutyControlState(myGuard);
      return;
    }

    const host=document.getElementById('identityBar') || document.querySelector('.wrap');
    if(!host) return;

    const box=document.createElement('div');
    box.id='cocoMySecurityDuty';
    box.style.cssText='margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap';
    box.innerHTML=`
      <div><b>Security Duty</b><div id="cocoDutyStatus" style="font-size:11px;color:var(--muted)">Checking duty status…</div></div>
      <div style="display:flex;gap:7px">
        <button type="button" class="btn btn-primary" id="cocoDutyIn">🟢 DUTY IN</button>
        <button type="button" class="btn-ghost" id="cocoDutyOut">🔴 DUTY OUT</button>
      </div>`;
    host.parentNode.insertBefore(box, host.nextSibling);

    box.querySelector('#cocoDutyIn').addEventListener('click',async()=>{
      await window.cocoSetSecurityDuty(myGuard,'IN');
    });
    box.querySelector('#cocoDutyOut').addEventListener('click',async()=>{
      await window.cocoSetSecurityDuty(myGuard,'OUT');
    });
    updateDutyControlState(myGuard);
  }

  function updateDutyControlState(guard){
    const d=ensureDutyStore()[guardId(guard)]||{};
    const status=document.getElementById('cocoDutyStatus');
    const inBtn=document.getElementById('cocoDutyIn');
    const outBtn=document.getElementById('cocoDutyOut');
    const on=d.status==='ON DUTY' && d.lastAction==='IN';
    if(status) status.textContent=on ? '🟢 ON DUTY' : '⚪ OFF DUTY';
    if(inBtn) inBtn.disabled=on;
    if(outBtn) outBtn.disabled=!on;
  }

  function ensureEmergencyButton(){
    if(!document.body || document.body.classList.contains('clean-login-active')) return;
    if(document.getElementById('cocoEmergencySecurityBtn')) return;

    const b=document.createElement('button');
    b.id='cocoEmergencySecurityBtn';
    b.type='button';
    b.title='Emergency Security Guard Call';
    b.setAttribute('aria-label','Emergency Security Guard Call');
    b.textContent='🛡️';
    b.addEventListener('click',window.cocoOpenSecurityCallPanel);
    document.body.appendChild(b);
  }

  function boot(){
    ensureEmergencyButton();
    injectSecurityDutyControls();
  }

  document.addEventListener('DOMContentLoaded',boot);
  const oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(){
      const r=oldRender.apply(this,arguments);
      setTimeout(boot,0);
      return r;
    };
  }
  setInterval(()=>{
    if(currentUser){
      ensureEmergencyButton();
      injectSecurityDutyControls();
      if(document.getElementById('cocoSecurityCallPanel')?.classList.contains('open')){
        window.cocoRefreshSecurityCallPanel();
      }
    }
  },1000);
})();
